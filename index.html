/* ---------- 15. 器物 / 功法 发放 ---------- */
function mkItem(spec){
  const slot = spec.slot || 'weapon';
  let g = spec.g==null ? 0 : clamp(spec.g,0,5);
  const capG = (function(){ let mx=0; for(let i=0;i<GRADE_MIN.length;i++) if(S.stage>=GRADE_MIN[i]) mx=i; return mx; })();
  if(g > capG) g = capG;
  const G = G_TBL[g];
  const gs = gearScale(g);                    // FDR-012 批3 · R3 §3.2 境界缩放（法器认主：同件随主人增强）
  const r = ()=>rnd(0.85,1.15);
  const it = {n:spec.n, slot:slot, g:g, atk:0, def:0, hp:0, esc:0, dur:0};
  switch(slot){
    case 'weapon':   it.atk = spec.atk!=null?spec.atk:G[0]*r(); break;
    case 'armor':    it.def = spec.def!=null?spec.def:G[1]*r();
                     it.hp  = spec.hp !=null?spec.hp :G[2]*0.60*r(); break;
    case 'treasure': it.atk = spec.atk!=null?spec.atk:G[0]*0.55*r();
                     it.def = spec.def!=null?spec.def:G[1]*0.35*r(); break;
    case 'escape':   it.def = spec.def!=null?spec.def:G[1]*0.50*r();
                     it.esc = spec.esc!=null?spec.esc:G[3]*r(); break;
    case 'ornament': it.hp  = spec.hp !=null?spec.hp :G[2]*0.80*r(); break;
    default:         it.atk = spec.atk!=null?spec.atk:G[0]*r();
  }
  /* R3 §3.2 · 派生属性 × gearScale(g)。空格位保持 0；有值的位置保底 1 */
  it.atk = it.atk>0 ? Math.max(1, Math.round(it.atk*gs)) : 0;
  it.def = it.def>0 ? Math.max(1, Math.round(it.def*gs)) : 0;
  it.hp  = it.hp >0 ? Math.max(1, Math.round(it.hp *gs)) : 0;
  it.esc = it.esc>0 ? Math.max(1, Math.round(it.esc*gs)) : 0;
  if(spec.spec) it.spec = spec.spec;
  if(spec.set)  it.set  = spec.set;
  return it;
}
const SPEC_IDS = Object.keys(SPEC_TBL);
function gradeDrop(tier){
  const L = LOOT_TBL[tier] || LOOT_TBL['凡缘'];
  const g = wpick(L.w);
  /* FDR-012 批3 · R3 §8.3：优先从 60 件新装备表按品阶取名；取不到再回落到通用名 */
  const pool = (EQ_BY_G[g] && EQ_BY_G[g].length) ? EQ_BY_G[g] : null;
  if(pool){
    const e = pick(pool);
    let sp = e.spec;
    /* R3 §3.6：品阶 ≥3 的佩饰/法器掉落有 30% 带 spec（只在 spec 生效槽位生成，避免无效特效） */
    if(!sp && e.g>=3 && (e.slot==='ornament'||e.slot==='treasure') && Math.random()<0.30) sp = pick(SPEC_IDS);
    return mkItem({n:e.n, slot:e.slot, g:e.g, spec:sp, set:e.set});
  }
  const slots = ['weapon','armor','treasure','escape','ornament'];
  const slot = pick(slots);
  const mkName = ['铁口之物','旧锻之器','坊间法器','认主之器','古遗之宝','洞天之珍'][g];
  return mkItem({n:mkName+'（'+SLOT_N[slot]+'）', slot:slot, g:g});
}
function itemLine(it){
  const bits=[];
  if(it.atk) bits.push('攻'+it.atk);
  if(it.def) bits.push('防'+it.def);
  if(it.hp)  bits.push('血'+it.hp);
  if(it.esc) bits.push('遁'+it.esc);
  return esc(it.n)+'［'+GRADE_N[clamp(it.g,0,5)]+' · '+SLOT_N[it.slot]+' · '+(bits.join(' ')||'无')+'］';
}
/* FDR-012 批3 · R3 §3.5 套装（无定·散修 三件）使行囊 +2 */
function bagMax(){ return BAG_MAX + ((equipSum().setFx && equipSum().setFx.bag) || 0); }
function bagRoom(){ return bagMax() - S.bag.length; }
function sellItem(it){
  const sfx = equipSum().setFx || {};
  const v = Math.round((GRADE_SELL[clamp(it.g,0,5)]||8) * DUR_MUL[clamp(it.dur||0,0,2)] * 0.4 * (1 + (sfx.sell||0)));
  S.ss += v;
  return v;
}
function destroyWeakest(){
  if(!S.bag.length) return null;
  let idx=0;
  for(let i=1;i<S.bag.length;i++) if(itemVal(S.bag[i])<itemVal(S.bag[idx])) idx=i;
  return S.bag.splice(idx,1)[0];
}

/* ---------- FDR-011 批2 · R10 手动换装（增补 §D；不耗 AP / 回合，不触发结算） ---------- */
let _toastT = null;
function toast(msg){
  const el = $('toast'); if(!el) return;
  el.textContent = msg;
  el.classList.add('in');
  if(_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(()=>{ el.classList.remove('in'); }, 1200);
}
/* 行囊 ↔ 槽位 原地交换（不改变 S.bag.length ⇒ 包满时「换上」仍可用） */
function swapEquip(bagIndex){
  if(over) return;
  const it = S.bag[bagIndex];
  if(!it){ return; }
  if(!SLOTS.some(s=>s[0]===it.slot)){ toast('此物无处可着'); return; }
  const slot = it.slot;
  const b = stats(), bSpec = specsText(), bHp = S.hp;
  const old = S.equip[slot] || null;
  S.equip[slot] = it;
  if(old) S.bag.splice(bagIndex, 1, old);
  else    S.bag.splice(bagIndex, 1);
  recomputeBound(); renderAll();
  const st = stats();
  entry('', '你换了件随身的', '你把'+esc(it.n)+'换到了身上。'+(old?'换下来的那件，收进了行囊。':'那槽位原先空着。'),
    '换装 · '+slot+' '+(old?esc(old.n):'（空）')+' → '+esc(it.n)+'［'+GRADE_N[clamp(it.g,0,5)]+',g'+it.g+'］'
    + ' · 攻 '+b.atk+'→'+st.atk+' · 防 '+b.def+'→'+st.def+' · 气血 '+fmtNum(b.hpMax)+'→'+fmtNum(st.hpMax)+' · 遁 '+b.esc+'→'+st.esc
    + ' · 特效 '+bSpec+' → '+specsText() + (S.hp<bHp?(' · 气血收口 '+fmtNum(bHp)+'→'+fmtNum(S.hp)):''));
  toast(old?('已换上《'+it.n+'》'):('已装备《'+it.n+'》'));
}
/* 卸下进包；包满则拒绝 + toast（§D.2） */
function unequipSlot(slot){
  if(over) return;
  const it = S.equip[slot];
  if(!it) return;
  if(bagRoom()<=0){ toast('囊已满，先腾出一格'); return; }
  const b = stats(), bSpec = specsText(), bHp = S.hp;
  S.bag.push(it); S.equip[slot] = null;
  recomputeBound(); renderAll();
  const st = stats();
  entry('', '你把这件收进了行囊', '你把'+esc(it.n)+'卸了下来，归进囊中。',
    '卸下 · '+slot+' '+esc(it.n)+'［'+GRADE_N[clamp(it.g,0,5)]+',g'+it.g+'］'
    + ' · 攻 '+b.atk+'→'+st.atk+' · 防 '+b.def+'→'+st.def+' · 气血 '+fmtNum(b.hpMax)+'→'+fmtNum(st.hpMax)+' · 遁 '+b.esc+'→'+st.esc
    + ' · 特效 '+bSpec+' → '+specsText() + (S.hp<bHp?(' · 气血收口 '+fmtNum(bHp)+'→'+fmtNum(S.hp)):''));
  toast('已卸下《'+it.n+'》');
}
/* FDR-012 批3 · R3 §3.6 修复：灵材全修 > 宗门修一档 > 坊市修一档（不触及永久伤 S.wound） */
function repairItem(slot){
  if(over) return;
  const it = S.equip[slot];
  if(!it || !(it.dur>0)) return;
  const g = clamp(it.g||0,0,5);
  const L = [];
  if(S.mat >= g+1){                                   // 灵材修复：耗 灵材 = g+1 → dur=0（全修）
    S.mat -= (g+1); it.dur = 0;
    L.push('灵材 <span class="neg">−'+(g+1)+'</span>'); L.push('器物 <span class="pos">'+esc(DUR_N[0])+'</span>');
  }else if(S.sect && S.contrib >= 8){                 // 宗门修复：耗 贡献 8 → 修一档
    S.contrib -= 8; it.dur = Math.max(0, it.dur-1);
    L.push(esc(FACTIONS[S.sect.id].axis)+' <span class="neg">−8</span>'); L.push('器物 <span class="pos">'+esc(DUR_N[clamp(it.dur,0,2)])+'</span>');
  }else{                                              // 坊市修复：耗 灵石 = round(GRADE_SELL[g]×0.6×dur) → 修一档
    const cost = Math.round((GRADE_SELL[g]||8)*0.6*(it.dur||1));
    if(S.ss < cost){ toast('手中之物，还修不起'); return; }
    S.ss -= cost; it.dur = Math.max(0, it.dur-1);
    L.push('灵石 <span class="neg">−'+cost+'</span>'); L.push('器物 <span class="pos">'+esc(DUR_N[clamp(it.dur,0,2)])+'</span>');
  }
  recomputeBound(); renderAll();
  entry('', '你把《'+esc(it.n)+'》修补了一番', '旧东西补一补，还能再用些时日。',
    '修复 · '+esc(it.n)+'［g'+g+',dur→'+it.dur+'］ · '+L.join(' · ')+' · 永久伤不受修复影响');
  toast('已修复《'+it.n+'》');
}

/* FDR-014 · 功法「遗忘」：不限量习练的出口。遗忘一门（并清去「曾习」记录，以便日后重遇重学），
   若所忘为主修则将余下熟练最高者推为新主修，免落「无根之木」之罚。不耗 AP、不推回合。 */
function forgetArt(name){
  if(over) return;
  let i = -1; for(let k=0;k<S.arts.length;k++) if(S.arts[k].n===name){ i=k; break; }
  if(i<0) return;
  const a = S.arts[i], wasMain = !!a.main;
  S.arts.splice(i,1);
  if(S.seenArt) delete S.seenArt[name];
  let heir = null;
  if(wasMain && S.arts.length){
    let bi=0; for(let k=1;k<S.arts.length;k++) if(S.arts[k].lv>S.arts[bi].lv) bi=k;
    S.arts[bi].main = true; heir = S.arts[bi].n;
  }
  if(!mainArt() && S.arts.length){ S.arts[0].main = true; heir = S.arts[0].n; }
  recomputeBound(); renderAll();
  toast('已忘《'+a.n+'》'+(heir?(' · '+heir+' 继为主修'):''));
  entry('', '你把《'+esc(a.n)+'》忘在了脑后',
    '练过的路数，一笔勾去。手底下空出一片地方。',
    '遗忘 · '+esc(a.n)+' ［'+ART_LV[a.lv]+(a.lv>=4&&(a.cp||0)?('·参悟'+cnNum(a.cp)):'')+'］'
    + ' · 门数 → '+cnNum(S.arts.length)+(heir?(' · 主修 → '+esc(heir)):' · 已无主修'));
}

/* 获得器物：槽内为空即装上；已有则由玩家三选一取舍 */
function giveEquip(spec, done){
  const it = mkItem(spec);
  const old = S.equip[it.slot];
  const put = dest=>{
    let soldOld=null, soldNew=null, melted=null;
    if(old){
      if(dest==='bag'){ if(bagRoom()>0) S.bag.push(old); else soldOld = sellItem(old); }
      else if(dest==='sell') soldOld = sellItem(old);
      else if(dest==='melt'){ S.mat += (old.g+1); melted = old; }
    }
    S.equip[it.slot] = it;
    return {soldOld:soldOld, soldNew:soldNew, melted:melted};
  };
  if(!old){
    S.equip[it.slot] = it; recomputeBound();
    note(7, '得 '+esc(it.n)+'（'+GRADE_N[clamp(it.g,0,5)]+'）');
    entry('', '', '你把'+esc(it.n)+'收在了身上。'+esc(SLOT_N[it.slot])+'有了正经的东西。',
      'equip · '+itemLine(it)+' · slot='+it.slot);
    return done ? done() : null;
  }
  // 三选一（不允许静默丢弃）
  const opts = [
    {k:'bag',  lb:'换上新的（旧件入囊）', d: bagRoom()>0 ? '旧的那件收进行囊，日后或许用得上。' : '行囊已满，这一项不可用。', dis: bagRoom()<=0},
    {k:'sell', lb:'换上新的（旧件折价）', d:'把旧的那件折给坊市，换些灵石。'},
    {k:'melt', lb:'换上新的（旧件熔炼）', d:'拆了旧的，取回几分灵材。'},
    {k:'keep', lb:'不换（新件折价）',     d:'你使惯了手里那件，新的卖了换钱。'}
  ];
  askChoice('器 物 取 舍', '你手里已有'+esc(old.n)+'。'+esc(it.n)+'看着更好，可要换，旧的就得有个去处。',
    '<div class="prow"><span>新得</span><span>'+esc(it.n)+'<em>'+GRADE_N[clamp(it.g,0,5)]+' · 估值 '+itemVal(it).toFixed(1)+'</em></span></div>'
    + '<div class="prow"><span>原有</span><span>'+esc(old.n)+'<em>'+GRADE_N[clamp(old.g,0,5)]+' · 估值 '+itemVal(old).toFixed(1)+'</em></span></div>'
    + '<div class="prow"><span>行囊</span><span>'+S.bag.length+' / '+bagMax()+'</span></div>',
    opts,
    k=>{
      const L = [];
      if(k==='keep'){
        const v = sellItem(it);
        L.push('灵石 <span class="pos">+'+v+'</span>');
        note(6, '灵石 +'+v);
        entry('', '', '你掂了掂'+esc(it.n)+'，最后还是把它折给了坊市。手里的旧物使惯了。',
          'equip(skip) · '+itemLine(it)+' · 折价 +'+v+' 灵石');
      }else{
        const r0 = put(k);
        L.push('换上 <span class="pos">'+esc(it.n)+'</span>');
        if(r0.soldOld!=null) L.push('旧件折价 <span class="pos">+'+r0.soldOld+'</span>');
        if(r0.melted)        L.push('熔炼旧件 <span class="pos">灵材 +'+(old.g+1)+'</span>');
        note(7, '换 '+esc(it.n)+'（'+GRADE_N[clamp(it.g,0,5)]+'）');
        entry('', '', '你把'+esc(it.n)+'换到了手上。旧的那一件，自有去处。',
          'equip · '+itemLine(it)+' · 替换 '+esc(old.n)+(r0.soldOld!=null?(' · 折价 +'+r0.soldOld):'')+(r0.melted?(' · 灵材 +'+(old.g+1)):''));
      }
      recomputeBound();
      if(L.length) entry('', '结算', '', L.join(' · '));
      renderAll();
      if(done) done();
    });
}

function giveArt(spec, L, tier){
  const key = spec.n;
  tier = tier || '灵缘';
  if(S.seenArt[key]){
    const a = S.arts.filter(x=>x.n===key)[0];
    if(a){
      const wmul = WX_EXP[wxRel(S.rootEl, a.el)] * (equipSum().insightMul || 1);
      /* FDR-011 批2 · 规则3 · 满级（化境）后重复获得 → 转「参悟」，折算修为（v4 §2.2） */
      if(a.lv>=4){
        const cp0 = (a.cp||0);
        if(cp0 < CP_CAP){
          a.cp = cp0 + 1;
          const gain = Math.round(80*coef());
          S.progress += gain;
          L.push('重习《'+esc(a.n)+'》· <span class="pos">参悟 '+cnNum(a.cp)+'</span> · 修为 +'+gain);
          note(7, '《'+esc(a.n)+'》参悟 '+cnNum(a.cp));
          entry('retake','','这一门你早已练透。再走一遍，走的是另一条路上的东西。',
            '参悟 · '+esc(a.n)+' cp '+cp0+'→'+a.cp+' · 功法数值 ×'+Math.min(1+CP_STEP*a.cp,1.20).toFixed(2)+' · 修为 +'+gain);
        }else{
          const gain = Math.round(60*coef());
          S.progress += gain;
          L.push('《'+esc(a.n)+'》已极，重习只余 <span class="pos">修为 +'+gain+'</span>');
          note(5, '修为 +'+gain);
          entry('retake','','这一门已经练到不能再练。剩下的，只能熬成修为。',
            '参悟已满 · '+esc(a.n)+' · 修为 +'+gain+'（cp 封顶 '+CP_CAP+'，不再提示参悟）');
        }
        return;
      }
      /* 规则1 · 重复获得按品阶给推进量（五行适配 / 慧根已在 addArtExp 内乘入） */
      const amt = ART_RETAKE[tier] || 15;
      const up = addArtExp(a, amt);
      const shown = Math.round(amt*wmul);
      L.push('重习 <span class="pos">'+esc(a.n)+'</span> · 熟练大进 +'+shown+(up>0?(' 晋 '+ART_LV[a.lv]):''));
      note(7,'习 '+esc(a.n));
      entry('retake','','你把《'+esc(a.n)+'》又走了一遍。这一遍，比头一遍更顺。',
        '重习 · 品阶 '+tier+' · 熟练 +'+shown+(up>0?(' · 晋 '+ART_LV[a.lv]):'')+' · 五行 '+WX_NAME[wxRel(S.rootEl,a.el)]);
      return;
    }
  }
  let el = spec.el || '无', ty = spec.type || '养元';
  if(!ART_TBL[ty]) ty = '养元';
  const a = {n:key, el:el, type:ty, exp:0, lv:0, main:false, cp:0};
  const m0 = mainArt();
  /* FDR-014 · 功法不限量：唯首位入门者为「主修」，其后习得皆列「兼修」，不再顶替旧学 ——
     取舍全交玩家（详情页「遗忘」）。 */
  if(!m0) a.main = true;
  S.arts.push(a);
  S.seenArt[key] = 1;
  L.push('习得 <span class="pos">'+esc(a.n)+'</span>' + (a.main?'（主修）':'（兼修）'));
  note(7, '得《'+esc(a.n)+'》');
}
function artLvOf(a){
  let lv=0; for(let i=0;i<ART_EXP.length;i++) if(a.exp>=ART_EXP[i]) lv=i;
  return lv;
}
function addArtExp(a, v){
  if(!a) return 0;
  const ins = equipSum().insightMul || 1;                 // FDR-011 批2 · 慧根：功法熟练获取 ×
  const mul = WX_EXP[wxRel(S.rootEl, a.el)] * ins;
  const before = a.lv;
  a.exp += Math.max(1, Math.round(v*mul));
  a.lv = artLvOf(a);
  return a.lv - before;
}

/* ---------- 16. 战斗 ---------- */
function foePw(b){
  if(b.pw && b.pw.length===2) return Math.round(rnd(b.pw[0], b.pw[1]));
  const sc = (typeof b.scale==='number') ? b.scale : 1.0;
  return Math.max(4, Math.round(stats().power * sc));
}
function canAskHelp(){
  if(S.sect) return true;
  const ks = Object.keys(S.rel);
  for(let i=0;i<ks.length;i++) if(S.rel[ks[i]]>=1) return true;
  return false;
}
function beginBattle(card, done){
  const b = card.ef.battle;
  const pw = foePw(b);
  const st = stats();
  const foe = {n:b.foe, pw:pw, hp:Math.round(pw*1.80), atk:pw*0.62, def:pw*0.38};
  const recovering = S.woundTurns>0;
  entry('big','','洞口那头的'+esc(foe.n)+'站起来了。它比你想的难缠。', null);
  const opts = [
    {k:'fight', lb:'力战', d:'正面交手。打得赢就拿得全，也挨得实。'},
    {k:'wit',   lb:'智取', d:'寻它的破绽，出手稍弱，受创亦轻。须得心境不乱。', dis: S.dao<2},
    {k:'flee',  lb:'遁走', d:'不与它纠缠，抽身便走。走不成会被追着打。', dis: !b.canFlee},
    {k:'help',  lb:'求援', d:'请人搭手。代价是欠下人情，或分去大半所得。', dis: !canAskHelp()},
    {k:'sac',   lb:'祭器', d:'碎一件随身之物，换一阵锋芒。东西就没了。', dis: !(S.equip.weapon||S.equip.treasure)},
    {k:'yield', lb:'示弱', d:'低头认输。丢人，丢钱，最重要的是——它还记着你。'}
  ];
  if(b.ambush) entry('sys','','这一回躲不过去。', 'ambush · '+cardEng(card));
  askChoice('如 何 应 对', '面前是'+esc(foe.n)+'。你有片刻工夫可以想。',
      '<div class="prow"><span>敌</span><span>'+esc(foe.n)+'</span></div>'
    + '<div class="engine">敌 '+esc(foe.n)+' · ATK '+foe.atk.toFixed(1)+' / DEF '+foe.def.toFixed(1)+' / HP '+foe.hp+' · pw '+foe.pw+'</div>'
    + '<div class="engine">你 ATK '+st.atk+' / DEF '+st.def+' / HP '+S.hp+'·'+st.hpMax+' / power '+st.power+'</div>'
    + '<div class="engine">战力对照 '+st.power+' ↔ '+foe.pw+(recovering?(' · 伤势未愈 atk×0.70 def×0.70'):'')+'</div>',
    opts, k=>{ runBattle(card, foe, k, recovering, done); });
}

function runBattle(card, foe, mode, recovering, done){
  const b = card.ef.battle;
  const L = [];
  const lines = [];
  let pk = 1.0, edmM = 1.0, pwScale = 1.0, extra = [];
  const stFull = stats();            // 未碎器前的属性：祭器前两轮用这份

  if(mode==='wit'){ pk = 0.75; edmM = 0.50; }
  if(mode==='help'){
    pwScale = 0.55;
    if(S.sect && S.contrib>=20){ S.contrib -= 20; extra.push('派系 −20'); }
    else if(S.sect){ S.contrib = Math.max(0, S.contrib-5); extra.push('人情 −1 · 贡献 −5'); }
    else{
      const ks = Object.keys(S.rel).filter(n=>S.rel[n]>=1);
      if(ks.length){ S.rel[ks[0]] -= 1; extra.push('与'+ks[0]+' −1'); }
    }
  }
  let brokeItem = null;
  if(mode==='sac'){
    const slot = S.equip.treasure ? 'treasure' : 'weapon';
    brokeItem = S.equip[slot];
    S.equip[slot] = null;
  }
  if(mode==='yield'){
    const loss = Math.min(S.ss, Math.round(foe.pw*0.5));
    S.ss -= loss;
    S.fame = Math.max(0, S.fame-3);
    S.dao = Math.max(0, S.dao-1);
    S.enemy += 1;
    entry('', '', '你把东西留下，低头走了。身后没有追来——它没有追的必要。',
      '示弱 · 灵石 −'+loss+' · 声望 −3 · 道心 → '+DAO[S.dao][0]+' · 仇家 +1');
    note(4, '示弱 · 灵石 −'+loss);
    recomputeBound(); renderAll();
    return done();
  }
  if(mode==='flee'){
    const st0 = stats();
    const p = clamp(0.35 + (st0.esc/(foe.pw*0.5))*0.30 + (function(){const m=mainArt(); return (m&&m.type==='遁法')?m.lv*0.06:0;})()
              + (st0.def/Math.max(1,foe.atk))*0.15 + persistSum().fleeP - (b.ambush?0.20:0), 0.10, 0.85);
    const roll = Math.random(), ok = roll < p;
    entry('', '你选了：遁走', ok ? '你抽身往后退。它没有追上来——也许是不想，也许是没能。'
                                : '你转身就跑，可它比你以为的快。',
      'P_flee = '+Math.round(p*100)+'% · 骰 '+Math.round(roll*100)+' · '+(ok?'<span class="pos">脱身</span>':'<span class="neg">追击</span>'));
    if(ok){
      S.fame = Math.max(0, S.fame-1);
      if(Math.random()<0.20) S.dao = Math.max(0, S.dao-1);
      L.push('声望 <span class="neg">−1</span>');
      note(4, '遁走 · 安然脱身');
      entry('', '结算', '', L.join(' · '));
      renderAll();
      return done();
    }
    const dmg = Math.max(1, Math.round((foe.atk*rnd(0.85,1.15) - st0.def*0.5) * (1-clamp(st0.ward||0,0,0.6))));   // 护体减伤
    S.hp -= dmg;
    const ssLoss = Math.min(S.ss, Math.round(foe.pw*0.5));
    S.ss -= ssLoss; S.fame = Math.max(0, S.fame-2);
    let daoLine = '';
    if(Math.random()<0.30){ S.dao = Math.max(0, S.dao-1); daoLine = ' · 道心 → '+DAO[S.dao][0]; }
    entry('', '', '背心上挨了一下，你还手不得，只能跑。',
      '追击 · 气血 <span class="neg">−'+dmg+'</span> · 灵石 <span class="neg">−'+ssLoss+'</span> · 声望 <span class="neg">−2</span>'+daoLine);
    note(3, '遁走失败 · 气血 −'+dmg);
    recomputeBound();
    if(S.hp<=0){ S.hp=0; note(4, '遁走不成 · 毙于'+esc(foe.n)); renderAll(); return endGame('battle'); }
    renderAll();
    if(S.lifespan<=S.age){ note(2, '寿元耗尽'); return endGame('dead'); }
    return done();
  }

  // 正常交手
  const st0 = stats();
  let pAtk0 = st0.atk, pDef0 = st0.def;
  if(recovering){ pAtk0 *= 0.7; pDef0 *= 0.7; }
  // 祭器：前两轮沿用碎器前的攻击，之后按新的（更低的）攻击结算
  let atkFull = stFull.atk; if(recovering) atkFull *= 0.7;
  let eAtkE = foe.atk*pwScale, eDefE = foe.def*edmM, eHpE = Math.round(foe.hp*pwScale);
  let round = 0, critR = 0.10, missR = 0.08;
  const wardM = clamp(stats().ward||0, 0, 0.6);          // FDR-011 批2 · 护体：受创 ×(1−ward)
  const thorn = clamp(stats().thorns||0, 0, 0.5);        // FDR-011 批2 · 反噬：受击反弹敌攻 ×thorn
  const m0 = mainArt();
  if(S.rootEl==='火') critR += 0.03;
  if(m0 && m0.type==='攻伐' && m0.lv>=2) critR += 0.02;
  if(m0 && m0.type==='遁法') missR = Math.max(0, missR - m0.lv*0.015);

  if(brokeItem){
    entry('', '', '你把'+esc(brokeItem.n)+'捏在手里，然后用力一握。它断了——那一瞬间你身上腾起一股劲。',
      '祭器 · '+esc(brokeItem.n)+' 碎裂 · 前 2 轮 ATK ×1.60');
  }
  const modeText = {fight:'力战', wit:'智取', help:'求援', sac:'祭器'}[mode] || mode;
  entry('', '你选了：'+modeText, '两下就撞在了一处。',
    'K_p='+pk+' · 敌 DEF ×'+edmM+' · 敌 pw ×'+pwScale+(extra.length?' · '+extra.join(' · '):''));

  while(round < R_MAX){
    round++;
    const kp = (mode==='sac' && round<=2) ? pk*1.60 : pk;
    let curAtk = (mode==='sac' && round<=2) ? atkFull : pAtk0;
    let crit=false, miss=false;
    let r1 = Math.random();
    if(r1 < critR) crit = true; else if(r1 > 1-missR) miss = true;
    let dp = Math.max(1, curAtk*kp*rnd(0.85,1.15) - eDefE*0.5);
    if(crit) dp *= 1.60;
    if(miss) dp *= 0.20;
    dp = Math.max(1, Math.round(dp));
    eHpE -= dp;

    let cen = '';
    if(crit) cen='暴击 ×1.60 → ';
    if(miss) cen='失手 ×0.20 → ';
    if(eHpE<=0){
      lines.push('轮'+round+' 你 −'+dp+' → 敌倒 '+cen);
      break;                                     // 胜负已分，过程统一在下方输出
    }
    let de = Math.max(1, Math.round((eAtkE*rnd(0.85,1.15) - pDef0*0.5) * (1-wardM)));
    S.hp -= de;
    if(thorn>0 && eHpE>0){ const rf = Math.max(1, Math.round(eAtkE*thorn)); eHpE -= rf; }   // 反噬
    lines.push('轮'+round+' 你 −'+dp+' → 敌 '+Math.max(0,eHpE)+' ｜ 敌 −'+de+' → 你 '+Math.max(0,S.hp)+' '+cen);
    if(S.hp<=0){ S.hp=0; break; }
    if(eHpE<=0) break;                                    // 反噬补刀：敌先倒
  }

  const resolved = eHpE<=0 ? 'win' : (S.hp<=0 ? 'lose' : 'stall');
  const ratio = clamp(S.hp/Math.max(1,st0.hpMax), 0, 1);
  /* FDR-013 批4 · A5 战斗交手：引擎行逐条浮现（纯视觉，可跳过） */
  const lineHtml = lines.map((ln,i)=>'<span class="bl" style="display:block;animation:dealIn .32s cubic-bezier(.2,.8,.3,1) both;animation-delay:'+(i*130)+'ms">'+ln+'</span>').join('');
  const be = entry('', '交手经过', '', '<div class="engine">'+lineHtml+'</div>');
  playBattleSeq(be);
  return afterBat(ratio, foe, card, done, [], resolved, mode);
}

function afterBat(ratio, foe, card, done, tags, resolved, mode){
  const b = card.ef.battle || {};
  const L = [];
  const outcome = resolved || 'stall';            // 'win' | 'lose' | 'stall'
  const win = (outcome==='win');

  if(S.hp<=0 || outcome==='lose'){
    S.hp = 0;
    note(4, '战死于'+esc(foe.n));
    entry('big','','你倒下了。最后看见的是它低下来的脸。', '<span class="neg">hp ≤ 0 · 终局 T1 战死</span>');
    renderAll();
    return endGame('battle');
  }

  let lootMul = 1.0;
  if(mode==='wit') lootMul = 0.6;
  if(mode==='help') lootMul = 0.4;
  if(outcome==='stall') lootMul = Math.min(lootMul, 0.3);

  // 后果分档
  const st0 = stats();
  let tier5 = ratio>=0.80 ? 0 : ratio>=0.45 ? 1 : ratio>=0.15 ? 2 : 3;
  if(outcome==='stall' && tier5<2) tier5 = 1;
  const words = ['无伤','轻伤','重伤','濒死'];
  const prose = [
    '你抖了抖袖子，什么也没缺。',
    '身上添了几道口子，走得动，也就算了。',
    '你赢了，可你站不住了。血顺着裤管往下淌，一步比一步沉。',
    '你最后是自己爬出来的。那一路上，你数不清自己歇了多少回。'
  ];
  const tIcon = ['','','',''];
  if(tier5>=2){
    if(tier5===2){ S.wound = clamp(S.wound+0.08,0,0.50); S.woundTurns = Math.max(S.woundTurns, ri(1,3)); }
    else         { S.wound = clamp(S.wound+0.15,0,0.50); S.woundTurns = Math.max(S.woundTurns, ri(2,4));
                   if(Math.random()<0.50) S.dao = Math.max(0, S.dao-1); }
    const ll = tier5===2 ? ri(1,3) : ri(4,8);
    S.lifespan -= ll;
    L.push('寿元 <span class="neg">−'+ll+' 载</span>');
    L.push('气血上限 <span class="neg">−'+(tier5===2?8:15)+'%</span>');
    L.push('疗养 <span class="neg">'+S.woundTurns+' 回合</span>');
    note(3, words[tier5]+' · 寿元 −'+ll+' 载');
    // 装备受损
    const worn = [];
    SLOTS.forEach(sl=>{ if(S.equip[sl[0]]) worn.push(sl[0]); });
    if(worn.length){
      const sk = pick(worn); const it = S.equip[sk];
      const before = it.dur||0;
      if(before>=2){ S.equip[sk]=null; L.push(esc(it.n)+' <span class="neg">碎裂</span>'); note(7, esc(it.n)+'碎裂'); }
      else { it.dur = before+1; L.push(esc(it.n)+' <span class="neg">'+DUR_N[it.dur]+'</span>'); }
    }
  }else{
    note(3, words[tier5]);
  }
  entry('big','', win
      ? (tier5<=1 ? '它倒了。你站在原地喘了一会儿，然后才敢走过去。' : prose[tier5])
      : '谁也没赢。这样耗下去，先撑不住的一定是你——你先松了手。',
    words[tier5]+' · hp '+S.hp+'/'+st0.hpMax+' = '+Math.round(ratio*100)+'% · '+(win?'<span class="pos">胜</span>':'<span class="neg">僵持</span>')
    + (tier5>=2?(' · 伤势累积 '+Math.round(S.wound*100)+'%'):''));

  // 功法熟练（战斗来源）
  if(win){
    const mv = mainArt();
    if(mv){
      const diff = clamp((foe.pw/Math.max(1,st0.power)-1), 0, 2);
      const base  = diff>0.8?12 : diff>0.4?8 : diff>0?5 : 3;
      const up = addArtExp(mv, base);
      L.push('主修熟练 <span class="pos">+'+Math.round(base*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      if(up>0) note(7, '《'+esc(mv.n)+'》→'+ART_LV[mv.lv]);
    }
  }

  // 战利品
  const LT = LOOT_TBL[b.loot] || LOOT_TBL['凡缘'];
  let got = [];
  if(win || outcome==='stall'){
    const sl = Math.round(ri(LT.ss[0], LT.ss[1]) * lootMul);
    if(sl>0){ S.ss += sl; got.push('灵石 +'+sl); }
    const hb = Math.round(ri(LT.herb[0], LT.herb[1]) * lootMul);
    if(hb>0){ S.herb += hb; got.push('药材 +'+hb); }
    const ma = Math.round(ri(LT.mat[0], LT.mat[1]) * lootMul);
    if(ma>0){ S.mat += ma; got.push('灵材 +'+ma); }
    const fa = Math.round(LT.fame * lootMul * (stats().fameMul||1));
    if(fa>0){ S.fame += fa; got.push('声望 +'+fa); }
    if(Math.random() < LT.drop*lootMul*(1+(stats().fortune||0))*(b.loot==='玄缘'?persistSum().xuanDrop:1)){
      const it = gradeDrop(b.loot);
      if(bagRoom()>0){ S.bag.push(it); got.push('得 '+esc(it.n)+'（'+GRADE_N[it.g]+'）'); note(7,'战利 '+esc(it.n)); }
      else{
        const w = destroyWeakest();
        const v = sellItem(w||it);
        if(w){ S.bag.push(it); got.push('囊满，折去'+esc(w.n)+' 得 '+v+' 灵石'); }
        else got.push('囊满，'+esc(it.n)+'折价 '+v+' 灵石');
        S.ss += v;
      }
    }
    if(win && Math.random() < (LOOT_ART[b.loot]||0)){
      const REST = CARDS.filter(c=>c.c==='功法' && eligible(c) && c.ef && c.ef.art);
      if(REST.length){
        const c2 = pick(REST);
        const sub = [];
        giveArt(c2.ef.art, sub, c2.tier);
        got.push('功法残篇 · '+sub.join(' '));
      }
    }
  }
  if(got.length){
    note(6, got.slice(0,2).join(' · '));
    entry('', '', '你把它翻了个遍。', '<span class="pos">'+got.join(' · ')+'</span>'+(lootMul<1?(' · 战利品 ×'+lootMul):''));
  }
  if(L.length) entry('', '结算', '', L.join(' · '));

  recomputeBound();
  if(S.lifespan <= S.age){ renderAll(); return endGame('dead'); }
  renderAll();
  return done();
}

/* ---------- 17. 大境界突破 ---------- */
function brkTerms(force){
  const st = S.stage;
  const base_ = (BASE_BRK[st] != null) ? BASE_BRK[st] : 0.24;   // FDR-010 批1：九关口基数表
  const daoM  = DAO[S.dao][1];
  const boneM = (S.bone-50)/100*0.20;
  const rootM = (typeof S.rootPtr==='number') ? S.rootPtr : (P_ROOTSTEP[S.rootGrade]||0);
  const m0 = mainArt();
  const artM = m0 ? [0,0.02,0.05,0.08,0.12][clamp(m0.lv,0,4)] : -0.05;
  const hasDan = S.pill>0;
  const danM = hasDan ? 0.10 : -0.10;
  let guardM = -0.10, guardTxt = '无人护法';
  if(S.sect){
    if(S.sect.rank>=3){ guardM = 0.08; guardTxt = '长老护法'; }
    else { guardM = 0.04; guardTxt = '同门护法'; }
  }
  if(S.guard>0){ guardM = Math.min(0.08, guardM + 0.06*S.guard); guardTxt += '＋阵法'; }
  const qi = LOCS[S.loc].qi;
  const qiM = qi>=60 ? 0.05 : qi<30 ? -0.05 : 0;
  const left2 = lifeLeft();
  const ageM = left2<=10 ? -0.10 : left2>=60 ? 0.05 : 0;
  const tries = S.breakTry[st]||0;
  const tryM  = tries>=2 ? 0.05*(tries-1) : 0;            // 第 3 次起 +5%/次（D3 推荐值）
  const cfB = persistSum();                               // FDR-013 批4 · R6 组合：冲境把握 / 飞升增益
  let sum = base_+daoM+boneM+rootM+artM+danM+guardM+qiM+ageM+tryM + cfB.breakP + (st===33 ? cfB.ascendP : 0);
  if(force) sum *= 0.5;
  const p = clamp(sum, 0.05, 0.85);
  return {st:st, base_:base_, daoM:daoM, boneM:boneM, rootM:rootM, artM:artM, hasDan:hasDan, danM:danM,
          guardM:guardM, guardTxt:guardTxt, qi:qi, qiM:qiM, left2:left2, ageM:ageM, tries:tries, tryM:tryM,
          p:p, m0:m0};
}
function brkWords(p){ return p>=0.65 ? '根基扎实' : p>=0.25 ? '看运气' : '凶险'; }
function brkEngine(t){
  return '<div class="prow"><span>把握</span><span>'+brkWords(t.p)+'</span></div>'
    + '<div class="engine">P = base '+Math.round(t.base_*100)+'% + 道心 '+Math.round(t.daoM*100)+'% + 根骨 '+Math.round(t.boneM*100)
    + '% + 灵根 '+Math.round(t.rootM*100)+'% + 功法 '+Math.round(t.artM*100)+'% + 丹药 '+Math.round(t.danM*100)
    + '% + 护法 '+Math.round(t.guardM*100)+'% + 地脉 '+Math.round(t.qiM*100)+'% + 寿元 '+Math.round(t.ageM*100)
    + '% + 屡败 '+Math.round(t.tryM*100)+'% → <b>'+Math.round(t.p*100)+'%</b></div>';
}
function promptBreakthrough(done){
  const t = brkTerms(false);
  const toStage = STAGES[clamp(S.stage+1,0,STAGES.length-1)];
  entry('big','', BIG[S.stage]+' 的关口横在你面前。你闭了关。', null);
  const opts = [
    {k:'go',    lb:'冲 关',   d: t.hasDan ? '服一颗丹，把那口气顶上去。' : '手上没有破境丹，这一冲要硬来。', dis: S.breakCd>0},
    {k:'force', lb:'强 行 冲 关', d:'不管那道伤，也不管时候对不对。把握减半，代价加倍。'},
    {k:'wait',  lb:'按 捺 不 动', d:'再攒一攒。关口不会跑，寿元会。'}
  ];
  askChoice('冲 境 · '+toStage, '你的把握——'+brkWords(t.p)+'。这一步迈出去，就收不回来了。',
    brkEngine(t)
    + '<div class="engine">冷却 '+(S.breakCd>0?(S.breakCd+' 年'):'无')+' · 余寿 '+lifeLeft()+' 载 · 主修 '
      + (t.m0?(esc(t.m0.n)+' · '+ART_LV[t.m0.lv]):'无（根基不齐）')+' · 已冲 '+(S.breakTry[S.stage]||0)+' 次</div>',
    opts, k=>{
      if(k==='wait'){
        entry('', '', '你把那口气又压了回去。来日方长——如果还有来日。',
          '放弃冲境 · 修为 '+S.progress+'/'+stepText()+' 封顶保存');
        note(1, '按捺不动');
        renderAll();
        return done();
      }
      doBreakthrough(k==='force', done);
    });
}
function doBreakthrough(force, done){
  const st = S.stage;
  const t = brkTerms(force);
  const roll = Math.random(), ok = roll < t.p;
  const F = BRK_FAIL[st] || BRK_FAIL[9];
  try{ playGateSeq(ok, String(Math.round(roll*100))); }catch(e){}   // A4 冲关四段（非阻塞；判定值已定）
  let consumed = false;
  if(t.hasDan){ S.pill--; consumed = true; }
  let eng = brkEngine(t) + '<div class="engine">骰 '+Math.round(roll*100)+' → <b>'+(ok?'成功':'失败')+'</b>'
          + (consumed?' · 服丹 ×1':'') + (force?' · 强行 ×0.50':'') + '</div>';

  S.breakTry[st] = (S.breakTry[st]||0) + 1;

  if(ok){
    const oldCap = S.lifespan;
    S.progress = Math.max(0, S.progress - (isFinite(curStep())?curStep():0));
    S.stage = Math.min(STAGES.length-1, st+1);
    S.lifespan = Math.max(S.lifespan, LIFE_CAP[S.stage]);
    S.wound = clamp(S.wound - 0.05, 0, 0.50);
    S.breakCd = 0;
    let guardLife = '';
    if(S.lifespan <= S.age){ S.lifespan = S.age+5; guardLife = '吊住一口气 · '; }
    recomputeBound();
    entry('big','', '通了。丹田里那口气忽然落了地，落进了一片你从没到过的地方。', eng);
    try{ playRealmUp(STAGES[S.stage]); }catch(e){}          // A6 冲境成功
    entry('sys','','境界提升 → '+STAGES[S.stage]+' ｜ 寿元上限 '+oldCap+' → '+S.lifespan+' 载'
      + (guardLife?'（'+guardLife+'）':''), '旧伤痊愈 −5% · 永久伤累计 '+Math.round(S.wound*100)+'%');
    note(1, '冲境成功 → '+STAGES[S.stage]);
    checkLoc(); renderAll();
    if(S.stage >= STAGES.length-1){            // FDR-010 批1 · 渡劫→飞升成功 → T6 羽化登仙（v4 §4.6）
      note(1, '羽化登仙');
      renderAll();
      return endGame('ascend');
    }
    return done();
  }

  // 失败
  const stepv = isFinite(curStep()) ? curStep() : 0;
  S.progress = Math.round(stepv * F.back);
  S.lifespan += F.life;
  S.wound = clamp(S.wound + Math.abs(F.hp), 0, 0.50);
  S.dao = Math.max(0, S.dao-1);
  S.breakCd = F.cd;
  let extra = [];
  if(!t.hasDan){ S.lifespan -= 3; extra.push('无丹强冲 −3 载'); }
  if(t.left2 <= 5){ S.lifespan -= 3; extra.push('寿元不足仍冲 −3 载'); }
  if(force){ S.lifespan -= 8; S.wound = clamp(S.wound+0.10,0,0.50); extra.push('强行 −8 载 −10% 气血上限'); }
  if(Math.random() < F.fire){
    S.progress = Math.max(0, Math.round(S.progress*0.90));
    extra.push('走火入魔 修为 −10%');
  }
  if(F.dur){
    const worn = SLOTS.map(s=>s[0]).filter(k=>S.equip[k]);
    if(worn.length){
      const sk = pick(worn), it = S.equip[sk];
      if((it.dur||0)>=2){ S.equip[sk]=null; extra.push(esc(it.n)+'碎裂'); }
      else { it.dur=(it.dur||0)+1; extra.push(esc(it.n)+DUR_N[it.dur]); }
    }
  }
  if(!mainArt()){ S.progress = Math.max(0, Math.round(S.progress*0.90)); extra.push('无根之木 修为 −10%'); }
  const after = stats();
  if(S.hp > after.hpMax) S.hp = after.hpMax;
  entry('big','', '没通。那口气冲上去，又折了回来，撞得你五脏发颤。你还停在'+STAGES[st]+'。', eng);
  entry('sys','','修为回退至 '+Math.round(F.back*100)+'% ｜ 寿元 '+F.life+' 载 ｜ 气血上限 −'+Math.round(Math.abs(F.hp)*100)
    + '% ｜ 道心 → '+DAO[S.dao][0]+' ｜ 冷却 '+F.cd+' 年',
    (extra.length?('额外 · '+extra.join(' · ')+' · '):'')+'D3 屡败补偿 · 已冲 '+(S.breakTry[st]||0)+' 次');
  note(1, '冲境失败 · 寿元 '+F.life+' 载');
  renderAll();
  if(S.lifespan <= S.age){ return endGame('gate'); }
  return done();
}

/* ---------- 18. 结算一张卡 ---------- */
function applyCard(c){
  const e = c.ef || {};
  const L = [];
  const st0 = stats();
  const _cf = persistSum();                              // FDR-013 批4 · R6 组合持久加成（贡献/人情/疗伤/水行）

  if(e.cultivate){
    let base = e.cultivate;
    if(S.woundTurns>0) base *= 0.5;
    if(base>0 && e.art && e.art.el==='水') base *= _cf.waterCultMul;   // R6「渡口三别」水行加成
    if(base>0){
      const gain = Math.max(1, Math.round(base * coef() * S.rootMul * S.boneMul * st0.cult * poisonMul() * rnd(0.9,1.1)));
      S.progress += gain;
      L.push('修为 <span class="pos">+'+gain+'</span>');
      note(5, '修为 +'+gain);
    }else{
      S.progress = Math.max(0, S.progress + Math.round(base*coef()));
      L.push('修为 <span class="neg">'+Math.round(base*coef())+'</span>');
    }
  }
  if(e.progressPct){
    const loss = Math.round((isFinite(curStep())?curStep():200)*Math.abs(e.progressPct));
    S.progress = Math.max(0, S.progress-loss);
    L.push('修为 <span class="neg">−'+loss+'</span>');
  }
  /* FDR-012 批3 · R3 §3.5 套装倍率：商盟（灵石获取 +）/ 青云（贡献获取 +） */
  const _sfx = st0.setFx || {};
  if(e.ss){ const sv = e.ss>0 ? Math.round(e.ss*(1+(_sfx.ssGain||0))) : e.ss; S.ss = Math.max(0, S.ss+sv); L.push('灵石 '+signed(sv)); note(6,'灵石 '+(sv>0?'+':'')+sv); }
  if(e.herb){ S.herb = Math.max(0, S.herb+e.herb); L.push('药材 '+signed(e.herb)); }
  if(e.material){ S.mat = Math.max(0, S.mat+e.material); L.push('灵材 '+signed(e.material)); note(6,'灵材 +'+e.material); }
  if(e.pill){ S.pill = Math.max(0, S.pill+e.pill); L.push('丹药 '+signed(e.pill)); }
  if(e.fame){ const fv = e.fame>0 ? Math.round(e.fame*st0.fameMul) : e.fame; S.fame = Math.max(0, S.fame+fv); L.push('声望 '+signed(fv)); }
  if(e.contrib){
    const cv = e.contrib>0 ? Math.round(e.contrib*(1+(_sfx.contribGain||0)+_cf.contribGain)) : e.contrib;
    S.contrib = Math.max(0, S.contrib+cv);
    L.push(esc(FACTIONS[S.sect?S.sect.id:'qy'].axis)+' '+signed(cv));
    checkRank(L);
    note(8, '贡献 '+(cv>0?'+':'')+cv);
  }
  if(e.danPoison){ const dpv = e.danPoison>0 ? Math.round(e.danPoison*st0.purity) : e.danPoison; S.danPoison = Math.max(0, S.danPoison+dpv); L.push('丹毒 '+signed(dpv)); }
  if(e.debts){ S.debts += e.debts; L.push('添了一桩 <span class="neg">未了的人情</span>'); }
  if(e.enemy){ S.enemy += e.enemy; L.push('多了一个 <span class="neg">仇家</span>');
               S.fate = clamp((S.fate||50) - e.enemy, 0, 100); }   // FDR-012 §5.4：结仇 fate −1
  if(e.rel){
    const n = e.rel.n; const rv = e.rel.v>0 ? Math.round(e.rel.v*_cf.relGainMul) : e.rel.v;
    S.rel[n] = (S.rel[n]||0) + rv;
    L.push('与 <span class="pos">'+esc(n)+'</span> 的关系 '+signed(rv));
  }
  if(e.atk){ S.atkBonus += e.atk; L.push('攻击 <span class="pos">+'+e.atk+'</span>'); }
  if(e.def){ S.defBonus += e.def; L.push('防御 <span class="pos">+'+e.def+'</span>'); }
  if(e.guard){ S.guard += e.guard; L.push('护法 <span class="pos">+'+e.guard+'</span>'); }
  if(e.rep && e.rep.id){ S.rep[e.rep.id] = (S.rep[e.rep.id]||0) + (e.rep.v||0); L.push('派系声望 '+signed(e.rep.v)); }
  /* FDR-010 批1 · 新增 effect 字段结算（增补 §E.5 / v4 §7.5） */
  if(e.esc){ S.escBonus = (S.escBonus||0) + e.esc; L.push('遁走 <span class="pos">+'+e.esc+'</span>'); }
  if(e.karma){ S.karma = (S.karma||0) + e.karma; S.fate = clamp((S.fate||0) + e.karma*3, 0, 100);
               L.push('因果 <span class="'+(e.karma>0?'pos':'neg')+'">'+signed(e.karma)+'</span>'); note(8, '因果 '+(e.karma>0?'+':'')+e.karma); }
  if(e.years){                                    // 时间吞噬：只推时钟 age，不动上限 lifespan（增补 §B.4 G2）
    const _y = Math.min(Math.max(1, e.years|0), yearCap());
    S.age += _y; S.yearsTotal = (S.yearsTotal||0) + _y;
    S.yearsCd = YEARS_CD_MAX;                     // G6：冷却 4；选卡当回合不递减（见 finishTurn），故相邻跨年选择最小间隔 = 5 回合
    S._yaT = S.turn;                              // 标记本回合选过跨年卡
    L.push('岁月 <span class="neg">+'+_y+' 载</span>');
    note(2, '岁月流逝 +'+_y+' 载');
  }
  if(e.territory && e.territory.loc){             // 地盘易主（增补 §E.5）：只改 own 属性，改后必须 renderAll()
    const _ti = LOC_INDEX[e.territory.loc];
    if(_ti!=null && LOCS[_ti]){ LOCS[_ti].own = e.territory.to; L.push('地盘易主 · <span class="pos">'+esc(LOCS[_ti].name)+'</span>'); renderAll(); }
  }
  if(e.lifespan){
    S.lifespan += e.lifespan;
    L.push('寿元 <span class="'+(e.lifespan>0?'pos':'neg')+'">'+(e.lifespan>0?'+':'')+e.lifespan+' 载</span>');
    note(2, '寿元 '+(e.lifespan>0?'+':'')+e.lifespan+' 载');
  }
  if(e.dao){
    const b0 = S.dao;
    S.dao = clamp(S.dao+e.dao, 0, DAO.length-1);
    if(S.dao!==b0) L.push('道心 <span class="'+(e.dao>0?'pos':'neg')+'">'+DAO[b0][0]+' → '+DAO[S.dao][0]+'</span>');
    note(8, '道心 → '+DAO[S.dao][0]);
    /* FDR-012 §5.4：善行 dao+1 → fate+2；恶行 dao−1 → fate−2（每次变动 ≤ ±2） */
    S.fate = clamp((S.fate||50) + (S.dao!==b0 ? e.dao*2 : 0), 0, 100);
  }
  if(e.art){ giveArt(e.art, L, c.tier); }
  if(e.artExp){
    const mv = mainArt() || S.arts[0];
    const v0 = (typeof e.artExp==='number') ? e.artExp : (e.artExp.v||8);
    if(mv){
      const up = addArtExp(mv, v0);
      L.push('《'+esc(mv.n)+'》熟练 <span class="pos">+'+Math.round(v0*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      if(up>0 && mv.type==='养元'){
        if(mv.lv===3){ S.lifespan += 8; L.push('养元圆满 <span class="pos">寿元 +8 载</span>'); note(2,'寿元 +8 载'); }
        if(mv.lv===4){ S.lifespan += 12; L.push('养元化境 <span class="pos">寿元 +12 载</span>'); note(2,'寿元 +12 载'); }
      }
      note(7, '《'+esc(mv.n)+'》熟练 +'+v0);
    }else L.push('无门径可归，白白磨了一场');
  }
  if(e.arts){                                     // 旧字段：术法式数 → 主修熟练
    const mv = mainArt() || S.arts[0];
    const v0 = e.arts*12;
    if(mv){
      const up = addArtExp(mv, v0);
      L.push('术法精进 <span class="pos">+'+Math.round(v0*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      note(7, '术法精进');
    }else L.push('习得零散术法，尚无门径可归');
  }
  if(e.mainArt){                                  // 旧字段
    const mul = OLD_ART[e.mainArt] || ['无','养元'];
    giveArt({n:e.mainArt, el:mul[0], type:mul[1]}, L, c.tier || '凡缘');
  }
  if(e.hp && e.hp.pct){
    const st = stats();
    const d = Math.round(st.hpMax*e.hp.pct);
    S.hp = Math.max(1, Math.min(st.hpMax, S.hp + d));
    L.push('气血 <span class="'+(d>0?'pos':'neg')+'">'+(d>0?'+':'')+d+'</span>');
  }
  if(e.hpMax && e.hpMax.pct){
    const d0 = e.hpMax.pct;
    if(d0<0){ S.wound = clamp(S.wound + Math.abs(d0), 0, 0.50); }
    else    { S.wound = clamp(S.wound - Math.abs(d0), 0, 0.50); }
    L.push('气血上限 <span class="'+(d0>0?'pos':'neg')+'">'+(d0>0?'+':'')+Math.round(d0*100)+'%</span>');
    note(3, '气血上限 '+(d0>0?'+':'')+Math.round(d0*100)+'%');
  }
  if(e.heal && e.heal.pct){
    const st = stats();
    const mul = (1 + (S.rootEl==='水'?0.15:0) + st.healB) * _cf.healMul;
    const g = Math.round(st.hpMax*e.heal.pct*mul);
    S.hp = Math.min(st.hpMax, S.hp + g);
    L.push('气血 <span class="pos">+'+g+'</span>');
    note(3, '疗伤 +'+g);
  }
  if(e.cure){
    S.woundTurns = 0;
    L.push('伤势稳住了（疗养清零）');
  }
  if(e.wound){
    const w = {light:1, heavy:2, mortal:3}[e.wound];
    if(w){
      if(w===2){ S.wound=clamp(S.wound+0.08,0,0.50); S.woundTurns=Math.max(S.woundTurns,ri(1,3)); }
      if(w===3){ S.wound=clamp(S.wound+0.15,0,0.50); S.woundTurns=Math.max(S.woundTurns,ri(2,4)); }
      L.push('伤势 · '+['','轻伤','重伤','濒死'][w]);
      note(3, ['','轻伤','重伤','濒死'][w]);
    }
  }
  if(e.sect===true || e.sectJoin){
    const nm = (e.sectJoin && typeof e.sectJoin==='string') ? e.sectJoin : '青云宗';
    joinFaction(facIdOf(nm) || 'qy', L, !!S.swFrom);
    S.swFrom = null;                                // 一次性凭证：仅本次结算视为「改投」
  }
  if(e.locate!=null){
    const i = LOC_INDEX[e.locate];
    if(i!=null && i!==S.loc){
      S.loc = i;
      if(S.seen.indexOf(i)<0) S.seen.push(i);
      if(S.nextLoc===i){ S.nextLoc=null; S.nudge=0; }
      L.push('身在 <span class="pos">'+LOCS[i].name+'</span>');
    }
  }
  if(c.c==='抉择' && c.t==='散修的路') S.declined = true;
  return L;
}

function checkRank(L){
  if(!S.sect) return;
  const F = FACTIONS[S.sect.id];
  while(S.sect.rank < F.ranks.length-1 && S.contrib >= F.need[S.sect.rank+1]){
    S.sect.rank++;
    L.push('门庭晋升 · <span class="pos">'+F.ranks[S.sect.rank]+'</span>');
    note(8, FACTIONS[S.sect.id].n+' → '+F.ranks[S.sect.rank]);
  }
}
/* 改投的代价：原派系贡献清零 + 声望受损 + 与原派系敌对上升。
   只在 askChoice 确认后调用 —— 不得静默发生（FDR-007 P0-2） */
function switchCost(from, L){
  const F = FACTIONS[from];
  const dF = Math.min(SWITCH_COST.fame, S.fame);
  S.fame = Math.max(0, S.fame - SWITCH_COST.fame);
  S.rep[from] = (S.rep[from]||0) + SWITCH_COST.rep;      // 负值 → 与原派系敌对上升
  L.push('<span class="neg">改投代价</span> · 声望 −'+dF+' · '+esc(F.n)+'敌对上升');
  note(8, '改投代价 · 离 '+F.n);
}

/* id 派系；isSwitch=true 表示这是跨门庭的改投（已确认），须付代价 */
function joinFaction(id, L, isSwitch){
  if(!FACTIONS[id]) return;
  const F = FACTIONS[id];
  const from = S.sect ? S.sect.id : null;

  /* D6：商盟是生意不是门庭，可与另一派系并存 —— 本派贡献不该被清零 */
  if(id==='hs' && from && from!=='hs'){
    S.trade = 'hs';
    L.push('兼了 <span class="pos">'+F.n+'</span> 的生意 · '+F.ranks[0]+'<em>'+esc(FACTIONS[from].n)+' 未退</em>');
    note(8, '兼 '+F.n);
    return;
  }
  const hadCon  = S.contrib;                                   // 记录要在改动 S.sect 之前取
  const hadRank = from ? clamp(S.sect.rank, 0, FACTIONS[from].ranks.length-1) : 0;
  if(from==='hs' && id!=='hs'){ S.trade='hs'; S.sect=null; }   // 本门原是商盟 → 转投别家，商路仍然留着

  if(isSwitch && from) switchCost(from, L);

  S.sect = {id:id, rank:0};
  S.contrib = 0;                                          // 换了门庭，贡献从头算起
  L.push('入了 <span class="pos">'+F.n+'</span> · '+F.ranks[0]);
  if(isSwitch && from){
    L.push('原门庭 <span class="neg">'+esc(FACTIONS[from].n)+' · '+FACTIONS[from].ranks[hadRank]+' 的'
           +esc(FACTIONS[from].axis)+'清零</span>（原文 '+hadCon+'）');
  }
  note(8, (isSwitch && from ? '改投 ' : '入 ')+F.n);
}

/* ---------- 19. 回合循环 ---------- */
function choose(c){
  if(over || CH) return;
  const from = switchFrom(c);            // FDR-007：已有门庭者遇到别家入伙卡 → 先确认，不得静默改投
  if(from) return askSwitch(c, from);
  doChoose(c);
}

/* 改投确认浮层（卡面/描述零阿拉伯数字，数值一律走下方引擎行） */
function askSwitch(c, from){
  const id = joinTarget(c);
  const nf = FACTIONS[from], nt = FACTIONS[id];
  if(!nf || !nt) return doChoose(c);
  const oldRank = nf.ranks[clamp(S.sect.rank, 0, nf.ranks.length-1)];
  askChoice('改 投 门 庭',
    '你如今是'+esc(nf.n)+'的'+esc(oldRank)+'，攒下的'+esc(nf.axis)+'都在那本册子上。这一脚跨过去，那边就没有你的名字了。',
    '<div class="prow"><span>现门庭</span><span>'+esc(nf.n)+'<em>'+esc(oldRank)+' · '+esc(nf.axis)+' '+S.contrib+'</em></span></div>'
    + '<div class="prow"><span>投向</span><span>'+esc(nt.n)+'<em>'+esc(nt.axis)+' 从零起算</em></span></div>'
    + '<div class="prow"><span>代价</span><span>贡献清零<em>声望 −'+SWITCH_COST.fame+' · '+esc(nf.n)+'声望 '+SWITCH_COST.rep+'</em></span></div>',
    [ {k:1, lb:'改投'+nt.n, d:esc(nf.axis)+'清零 · 声望受损 · 与'+nf.n+'交恶'},
      {k:0, lb:'不去',      d:'这一趟白跑，往后别的事还得有人管。'} ],
    function(k){
      if(k===1){ S.swFrom = from; doChoose(c); return; }
      S.noJoin[c.t] = true;                       // 当面回绝过的入伙卡，不再反复来劝
      const i = (cur.indexOf(c) >= 0) ? cur.indexOf(c)
              : cur.findIndex(x => x.id != null && x.id === c.id);   // 防御：cur 里存的是副本
      const rep = (i >= 0) ? replaceCard(i, c) : null;
      if(i >= 0 && rep) cur[i] = rep;              // 顶替上去，手牌仍是 3 张、类目互异
      entry('', '你把话压了下去', '他们没再劝第二遍。第二天照旧起身，像什么也没发生过。',
        'switch(declined) · '+esc(nt.n)+' 入门卡已屏蔽');
      renderCards();
      if(!rep) afterCard();                       // 防御：换不出别的卡时不容回合空转
    });
}

/* 换掉一张被回绝的卡（保持手牌 3 张、类目互异，且不再抽别的入门卡） */
function replaceCard(idx, old){
  const usedId = {}, usedCat = {};
  cur.forEach((x,i)=>{ if(i!==idx){ if(x.id>=0) usedId[x.id]=1; usedCat[x.c]=1; } });
  const pool = CARDS.map((c,i)=>Object.assign({id:i}, c))
                    .filter(c=>eligible(c) && !usedId[c.id] && !usedCat[c.c] && !joinTarget(c));
  if(!pool.length) return null;
  return pool[wpick(pool.map(c=>TIER_W[c.tier]||1))];
}

/* =========================================================
   FDR-012 批3 · R5 天命系（rollFate / fateTier / applyFateTier）
   —— 结果由引擎侧在动画前定值（v4 §5.3.1 步4 红线）
   ========================================================= */
/* 天命值档位中文（HUD / 抽屉用，零阿拉伯数字） */
function fateWord(){ return S.fate>=60 ? '天命所归' : S.fate<=40 ? '命途多舛' : '命数尚可'; }
/* 命数偏移：shift = (S.fate−50)/50 + Σ spec.karma（上限 +0.35，§5.4） */
function fateShiftValue(){
  const st = stats();
  const karma = Math.min(st.fateShift || 0, FATE_TBL.shift.cap);
  return clamp(((S.fate||50) - 50) / 50 + karma, -1.35, 1.35);
}
/* 按 risk 基础分布 + shift 修正 → 归一化得五档概率（§5.3.1 / §5.4） */
function fateDist(risk){
  const base = FATE_TBL.risk[risk] || FATE_TBL.risk.std;
  const sh = fateShiftValue(), ap = FATE_TBL.shift.apply;
  const cfF = persistSum();                                // FDR-013 批4 · R6「天命所归」：吉/凶偏移
  const d = {};
  FATE_TIERS.forEach(t=>{
    const bias = (t==='大吉') ? ap['大吉'] : (t==='吉') ? ap['吉']
               : (t==='无咎') ? ap['无咎'] : (t==='大凶') ? ap['大凶'] : 0;
    let v = (base[t]||0) + bias*sh;
    if(t==='大吉') v += cfF.luckyP;
    if(t==='大凶') v += cfF.badP;
    d[t] = Math.max(0.004, v);
  });
  let sum = 0; FATE_TIERS.forEach(t=>{ sum += d[t]; });
  FATE_TIERS.forEach(t=>{ d[t] /= sum; });
  return d;
}
/* 采样得档位（引擎侧） */
function fateTier(risk){
  const d = fateDist(risk); let r = Math.random(), acc = 0;
  for(let i=0;i<FATE_TIERS.length;i++){ acc += d[FATE_TIERS[i]]; if(r <= acc) return FATE_TIERS[i]; }
  return '平';
}
/* 套用五档奖惩（量 = base × REALM_COEF[stage]；寿元/道心/伤势不缩放） */
function applyFateTier(tier){
  const L = [];
  const fx = FATE_TBL.tierEffect[tier]; if(!fx) return L;
  const cv = coef(), sfx = (stats().setFx) || {};
  if(fx.cultivate){
    const g = fx.cultivate>0 ? Math.max(1, Math.round(fx.cultivate*cv)) : -Math.max(1, Math.round(-fx.cultivate*cv));
    if(g>=0){ S.progress += g; L.push('修为 <span class="pos">+'+g+'</span>'); note(5,'修为 +'+g); }
    else    { S.progress = Math.max(0, S.progress+g); L.push('修为 <span class="neg">'+g+'</span>'); }
  }
  if(fx.ss){
    const sv = fx.ss>0 ? Math.round(fx.ss*cv*(1+(sfx.ssGain||0))) : Math.round(fx.ss*cv);
    S.ss = Math.max(0, S.ss+sv); L.push('灵石 '+signed(sv)); note(6,'灵石 '+(sv>0?'+':'')+sv);
  }
  if(fx.fame){ const fv = fx.fame>0 ? Math.round(fx.fame*((stats().fameMul)||1)) : fx.fame; S.fame = Math.max(0,S.fame+fv); L.push('声望 '+signed(fv)); }
  if(fx.lifespan){ S.lifespan += fx.lifespan; L.push('寿元 <span class="'+(fx.lifespan>0?'pos':'neg')+'">'+(fx.lifespan>0?'+':'')+fx.lifespan+' 载</span>'); note(2,'寿元 '+(fx.lifespan>0?'+':'')+fx.lifespan+' 载'); }
  if(fx.dao){ const b0=S.dao; S.dao = clamp(S.dao+fx.dao,0,DAO.length-1); if(S.dao!==b0) L.push('道心 <span class="'+(fx.dao>0?'pos':'neg')+'">'+DAO[b0][0]+' → '+DAO[S.dao][0]+'</span>'); }
  if(fx.hpMaxPct){ S.wound = clamp(S.wound + Math.abs(fx.hpMaxPct), 0, 0.50); L.push('气血上限 <span class="neg">'+Math.round(fx.hpMaxPct*100)+'%</span>'); }
  if(fx.wound){ const w = {light:1,heavy:2,mortal:3}[fx.wound]; if(w){ S.woundTurns = Math.max(S.woundTurns, ri(1,3)); L.push('伤势 · '+['','轻伤','重伤','濒死'][w]); note(3,'天命 · 重伤'); } }
  if(fx.enemy){ S.enemy += fx.enemy; L.push('多了一个 <span class="neg">仇家</span>'); }
  if(fx.dropHigh){                                 // 大吉可掉落 g≥4 装备（§5.3.2）
    const g = (S.stage >= GRADE_MIN[5]) ? 5 : 4;
    const pool = (EQ_BY_G[g] && EQ_BY_G[g].length) ? EQ_BY_G[g] : EQ_BY_G[4];
    if(pool && pool.length){
      const e = pick(pool);
      const it = mkItem({n:e.n, slot:e.slot, g:e.g, spec:e.spec, set:e.set});
      if(bagRoom()>0){ S.bag.push(it); L.push('得 <span class="pos">'+esc(it.n)+'</span>'); note(7,'天命赠 '+esc(it.n)); }
      else { const v = sellItem(it); L.push('得 '+esc(it.n)+'（囊满 · 折价 <span class="pos">+'+v+'</span>）'); }
    }
  }
  /* 写回天命值：好事 +、坏事 −（§5.3.1 步6） */
  const fd = {'大吉':3, '吉':1, '平':0, '无咎':-1, '大凶':-3}[tier] || 0;
  if(fd){ S.fate = clamp((S.fate||50)+fd, 0, 100); L.push('天命 <span class="'+(fd>0?'pos':'neg')+'">'+signed(fd)+'</span>'); }
  return L;
}
/* 判定呈现基础版（A8 · §5.3.3）：环形卦象轮盘 + 指针定格；批4 可经 window.__fateAnim 替换为完整动画 */
let _fateBusy = false;
function respectMotion(){
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; }
}
function playFateWheel(tier, risk, done){
  const ov = $('ov-fate');
  if(!ov){ if(done) done(); return; }
  const needle = $('fate-needle'), tierEl = $('fate-tier'), noteEl = $('fate-note'),
        goBtn = $('fate-go'), engEl = $('fate-eng');
  const tone = (tier==='大吉'||tier==='吉') ? 'good' : (tier==='大凶' ? 'bad' : 'flat');
  tierEl.textContent = tier;
  tierEl.className = 'fate-tier '+tone;
  noteEl.textContent = ({low:'此签偏稳，凶险不多。', std:'常签。成算在天，谁也说不准。', high:'重注之签，大起大落。'}[risk]) || '';
  engEl.innerHTML = 'fate · risk='+risk+' · tier='+tier+' · shift='+fateShiftValue().toFixed(2)+' · 判定值于动画前已定值';
  goBtn.style.display = 'none';
  tierEl.classList.remove('in');
  ov.classList.remove('in');            // .ov.in = 隐藏 → 移除即显示
  ov.classList.add('spinning');
  let settled = false, closed = false, tickT = null;
  const stopTicks = ()=>{ if(tickT){ try{ clearTimeout(tickT); }catch(e){} tickT = null; } };
  const spinTicks = ()=>{ let iv=120; const go=()=>{ if(settled) return; playSE('tick'); iv=Math.max(40, iv-7); tickT=setTimeout(go, iv); }; go(); };
  const settle = ()=>{
    if(settled) return; settled = true;
    stopTicks();
    ov.classList.remove('spinning');
    needle.style.transition = 'none';
    tierEl.classList.add('in');                    // 档位字爆出（transition · 纯视觉）
    playSE((tier==='大凶') ? 'fate_bad' : (tier==='大吉'||tier==='吉') ? 'fate_good' : 'tick');
    goBtn.style.display = '';
    engEl.style.display = '';
  };
  const close = ()=>{
    if(closed) return; closed = true;
    stopTicks();
    ov.classList.add('in');
    ov.removeEventListener('click', onAny);
    if(done) done();
  };
  function onAny(){ if(!settled) settle(); else close(); }
  if(respectMotion()){
    needle.style.transform = 'rotate(0deg)';
    setTimeout(settle, 0);
  }else{
    const seg = Math.floor(Math.random()*12);
    const target = 360*3 + seg*30;
    needle.style.transition = 'none';
    needle.style.transform = 'rotate(0deg)';
    void needle.offsetWidth;                                   // 强制 reflow 使 transition 生效
    needle.style.transition = 'transform 1.4s cubic-bezier(.16,.72,.22,1)';
    needle.style.transform = 'rotate('+target+'deg)';
    spinTicks();                                              // A8：加速滴答（音频，纯增）
    setTimeout(settle, 1420);                                  // 加速+减速+定格 ≈ 1400 ms
  }
  goBtn.onclick = close;
  ov.addEventListener('click', onAny);
}
/* FDR-013 批4 · 把完整天命 roll 动画挂到 window.__fateAnim（批3 预留钩子兑现） */
window.__fateAnim = playFateWheel;
/* 天命主流程（§5.3.1）：定值 → 结算 → 呈现 → 续回合 */
function rollFate(card, done){
  const risk = (card.ef && card.ef.fate && card.ef.fate.risk) || 'std';
  let tier = fateTier(risk);                   // ★ 引擎侧定值（动画前）
  let rerolled = false;
  /* FDR-013 批4 · R6「逆命者」：大凶可重掷（每局有尽，引擎侧在动画前定值） */
  if(tier==='大凶' && (S.comboReroll||0)>0){ S.comboReroll--; tier = fateTier(risk); rerolled = true; }
  if(_fateBusy){ if(done) done(); return; }    // 防御：重入保护
  _fateBusy = true;
  const L = applyFateTier(tier);
  S.fateCd = FATE_CD_MAX;                       // §5.5：结算一张天命卡后冷却 4
  entry('big','','你求得一卦。','<span class="'+(tier==='大凶'?'neg':'pos')+'">命数 · '+tier+'</span> · risk='+risk+' · shift='+fateShiftValue().toFixed(2)+' · 天命 '+Math.round(S.fate)+(rerolled?' · <span class="pos">逆命重掷</span>':''));
  if(L.length) entry('', '天命结算', '', L.join(' · '));
  const after = ()=>{
    _fateBusy = false;
    recomputeBound(); renderAll();
    if(!over && S.lifespan <= S.age){
      entry('big','','那一卦算到了底。你没能等到第二日。','<span class="neg">天命 · '+tier+' · lifespan ≤ age</span>');
      return endGame('dead');
    }
    if(done) done();
  };
  const anim = (typeof window!=='undefined' && window.__fateAnim) ? window.__fateAnim : playFateWheel;
  anim(tier, risk, after);
}
window.playFateWheel = playFateWheel;   // 调试 / 批4 覆盖入口

function doChoose(c){
  const L = applyCard(c);
  if(S && S.seenCard) S.seenCard[c.t] = 1;       // FDR-013 批4 · R6：记入 history 账（永久）
  if(turnBox) turnBox._card = c.t;               // 供折叠摘要显示卡名
  entry('choice', '第 '+S.turn+' 年 · 你选了', '《'+esc(c.t)+'》'+esc(c.d), null);
  if(L.length){ entry('', '结算', '', L.join(' · ')); try{ playSE(L.join('').indexOf('pos')>=0?'gain':'loss'); }catch(e){} }
  recomputeBound();

  // T2：某些卡直接把寿元压到年岁之下，立即终局（规格 §10.1 lifespan 字段语义）
  if(!over && S.lifespan <= S.age){
    entry('big','','一口气没续上。你坐下去，就没再起来。','<span class="neg">lifespan ≤ age · 终局 T2 寿元耗尽</span>');
    renderAll();
    return endGame('dead');
  }

  S.memory.push({turn:S.turn, ids:cur.map(x=>x.id).filter(id=>id>=0)});
  if(S.memory.length>4) S.memory.shift();
  renderAll();

  if(c.ef && c.ef.battle && typeof c.ef.battle==='object'){
    return beginBattle(c, ()=>{ if(!over) afterCard(); });
  }
  if(c.ef && c.ef.equip){
    const spec = c.ef.equip;
    return giveEquip(spec, ()=>{ if(!over) afterCard(); });
  }
  /* FDR-012 批3 · R5 天命卡：选卡后进入 rollFate() 子流程（含 A8 判定呈现），定格后再续回合 */
  if(c.ef && c.ef.fate && typeof c.ef.fate==='object'){
    return rollFate(c, ()=>{ if(!over) afterCard(); });
  }
  return afterCard();
}
function afterCard(){
  if(over) return;
  checkCombos();                                 // FDR-013 批4 · R6（applyCard 结算后、advance 前）
  if(over) return;
  advance();
}

function checkLoc(){
  LOCS.forEach((L,i)=>{
    if(i>0 && S.stage>=L.min && S.seen.indexOf(i)<0){
      S.seen.push(i); S.nextLoc=i; S.nudge=2;
      entry('sys','','你听说南边有个去处 · <b>'+L.name+'</b>', null);
    }
  });
}

function zaihuo(){
  const m0 = mainArt();
  if(!m0) return 0;
  const secs = secArts();
  const conflictsRoot = wxRel(S.rootEl, m0.el)==='ke';
  const conflictArt   = secs.some(s=>wxRel(m0.el,s.el)==='ke');
  let p = 0;
  if(conflictsRoot) p = conflictArt ? 0.12 : 0.05;
  else if(conflictArt) p = 0.06;
  p *= clamp(equipSum().purity||1, 0, 1);              // FDR-011 批2 · 净心：走火判定 P ×0.70
  if(p>0 && Math.random()<p){
    S.progress = Math.max(0, Math.round(S.progress*0.90));
    S.wound = clamp(S.wound+0.01, 0, 0.50);
    S.lifespan -= 1;
    S.dao = Math.max(0, S.dao-1);
    note(3, '走火 · 寿元 −1 载');
    entry('sys','','夜里气息忽然岔了。你按了半宿才把它压回去，人却虚了。',
      '走火 · 修为 −10% · 气血上限 −1% · 寿元 −1 载 · 道心 → '+DAO[S.dao][0]+' · P='+Math.round(p*100)+'%');
    return 1;
  }
  return 0;
}

function promoteLoop(){
  let guard = 0;
  while(S.stage < STAGES.length-1 && guard++ < 40){
    const stepv = curStep();
    if(!isFinite(stepv) || S.progress < stepv) break;
    if(BIG[S.stage]) break;                      // 大境界交给突破判定
    S.progress -= stepv;
    S.stage++;
    const cap = LIFE_CAP[S.stage];
    const old = S.lifespan;
    S.lifespan = Math.max(S.lifespan, cap);
    recomputeBound();
    entry('sys','','境界提升 → '+STAGES[S.stage], null);
    try{ playRealmUp(STAGES[S.stage]); }catch(e){}          // A6 境界提升（纯视觉）
    if(S.lifespan>old){ entry('sys','','寿元上限提升 '+old+' → '+S.lifespan+' 载', null); note(1,'境界 → '+STAGES[S.stage]); }
    else note(1,'境界 → '+STAGES[S.stage]);
    checkLoc();
  }
}

function advance(){
  // ① 基础吐纳
  S.progress += TUNE;
  // ② 主修功法自然推进 +1；五行适配已在 addArtExp 内
  const mv = mainArt();
  if(mv){
    const beforeLv = mv.lv;
    addArtExp(mv, 1);
    if(mv.lv>beforeLv) entry('sys','','你的《'+esc(mv.n)+'》又深了一层。', '熟练 → '+ART_LV[mv.lv]+' · '+WX_NAME[wxRel(S.rootEl,mv.el)]);
  }
  // ③ 走火判定
  zaihuo();
  // ④ 服丹 + 丹毒代谢
  const st1 = stats();
  let need = 0;
  if(S.hp < st1.hpMax*0.60) need = 1;
  else if(S.progress >= (isFinite(curStep())?curStep():Infinity)*0.80) need = 2;
  if(need>0 && S.pill>0){
    const cfp = persistSum();                          // FDR-013 批4 · R6「丹道」：丹药更速 / 丹毒更浅
    S.pill--;
    const pg = Math.round(8*coef()*cfp.pillMul), dp = Math.round(2*cfp.danPoisonMul);
    S.progress += pg;
    S.danPoison += dp;
    entry('sys','','你抠出一粒丹咽了下去。','服丹 · 修为 +'+pg+' · 丹毒 +'+dp);
  }
  if(S.danPoison>0) S.danPoison = Math.max(0, S.danPoison-1);
  if(S.danPoison>=10){ S.lifespan -= 1; note(2,'丹毒反噬 −1 载'); entry('sys','','你身上的药味越来越重了。','丹毒 ≥10 · 寿元 −1 载'); }
  // ⑤ 派系俸禄
  if(S.sect){
    const inc = FACTIONS[S.sect.id].pay(S.sect.rank);
    S.ss += inc;
  }
  if(S.trade){
    const inc = Math.round(FACTIONS[S.trade].pay(0)*0.5);
    S.ss += inc;
  }
  // ⑥ 阶段推进（大境界处停下）
  promoteLoop();
  recomputeBound();
  renderAll();

  // ⑦ 大境界：交给玩家决断
  if(BIG[S.stage] && isFinite(curStep()) && S.progress >= curStep()){
    if(S.breakCd>0){
      entry('sys','','关口的伤还没养回来。你只能再等。','冷却 '+S.breakCd+' 年 · 可强行冲关');
    }
    return promptBreakthrough(()=>{ if(!over) finishTurn(); });
  }
  return finishTurn();
}

function finishTurn(){
  if(over) return;
  // 年末恢复
  const st = stats();
  let heal = Math.round(st.hpMax*0.08);
  if(S.woundTurns>0){
    heal = Math.round(heal * (S.wound>=0.15?0.20:0.40));
    S.woundTurns--;
    if(S.woundTurns===0) entry('sys','','伤好得差不多了，能动了。','疗养结束');
  }
  if(S.hp < st.hpMax) S.hp = Math.min(st.hpMax, S.hp + heal);
  if(S.breakCd>0) S.breakCd--;
  if(S.yearsCd>0 && S._yaT!==S.turn) S.yearsCd--;   // FDR-010 批1 · years 冷却递减（选卡当回合不递减 → 最小间隔 5 回合）
  if(S.fateCd>0) S.fateCd--;                        // FDR-012 批3 · R5 天命冷却递减（最多每 5 回合一次）

  S.age++; S.turn++;
  recomputeBound();

  // 终局判定
  if(S.hp <= 0){ S.hp=0; note(3, '气血耗尽'); return endGame('battle'); }
  if(S.lifespan <= S.age){ note(2, '寿元耗尽'); return endGame('dead'); }
  if(S.turn > MAX_TURN){ note(1, '安全上限'); return endGame('cap'); }

  renderAll();
  const stg = STAGES[clamp(S.stage,0,STAGES.length-1)];
  openTurn('第 '+S.turn+' 年', stg+' · '+LOCS[S.loc].name+' · '+(S.sect?FACTIONS[S.sect.id].short+FACTIONS[S.sect.id].ranks[clamp(S.sect.rank,0,4)]:'无门无派'), '');
  entry('sys','','时年 '+S.age+' 岁，余寿 '+lifeLeft()+' 载。',
    '吐纳 +'+TUNE+' · 修为 '+S.progress+'/'+stepText()+' · 气血 '+S.hp+'/'+stats().hpMax
    + (S.sect?' · 俸禄 +'+FACTIONS[S.sect.id].pay(S.sect.rank):'')
    + (S.woundTurns>0?' · 疗养中 ×'+(S.wound>=0.15?0.20:0.40):''));
  entry('sys','','三件机缘摆在面前。', null);
  cur = genCards();
  renderCards();
}

/* =========================================================
   FDR-013 批4 · R6 组合系统 + R1 表现层（音频 / 动画 / 开关 / 见闻录）
   🔴 铁律：动画只是视觉叠加，绝不 `setTimeout` 延迟状态变更（fate roll 例外）。
   ========================================================= */

/* ---------- R6 组合：触发账 / 持久加成 ---------- */
function hist(t){ return !!(S && S.seenCard && S.seenCard[t]); }
function heldEquipName(n){ return SLOTS.some(s=>S.equip[s[0]] && S.equip[s[0]].n===n); }
function inBag(n){ return !!(S && S.bag && S.bag.some(it=>it.n===n)); }
function hasArt(n){ return !!(S && ((S.seenArt && S.seenArt[n]) || S.arts.some(a=>a.n===n))); }
function held(n){ return heldEquipName(n) || inBag(n) || hasArt(n); }
function setHas(id){ try{ const r=setSum(); return r.sets.some(x=>x.id===id && x.cnt>=3); }catch(e){ return false; } }
/* 已解锁组合的持久（乘/率）加成汇总；立即一次性效果另在 applyComboImmediate 结算 */
function persistSum(){
  const r={artMul:1, bodyArtMul:1, mainMul:1, mainAtkBonusPerCp:0, xuanDrop:1, pillMul:1, danPoisonMul:1,
           healMul:1, waterCultMul:1, hpMaxPct:0, contribGain:0, relGainMul:1, breakP:0,
           luckyP:0, badP:0, ascendP:0, fateReroll:0, fleeP:0};
  if(!S || !S.codex) return r;
  const ids = Object.keys(S.codex);
  for(let i=0;i<ids.length;i++){
    const cm = COMBO_BY_ID[ids[i]]; if(!cm || !cm.fx) continue;
    const f = cm.fx;
    if(f.artMul)            r.artMul *= f.artMul;
    if(f.bodyArtMul)        r.bodyArtMul *= f.bodyArtMul;
    if(f.mainMul)           r.mainMul *= f.mainMul;
    if(f.mainAtkBonusPerCp) r.mainAtkBonusPerCp += f.mainAtkBonusPerCp;
    if(f.xuanDrop)          r.xuanDrop *= f.xuanDrop;
    if(f.pillMul)           r.pillMul *= f.pillMul;
    if(f.danPoisonMul)      r.danPoisonMul *= f.danPoisonMul;
    if(f.healMul)           r.healMul *= f.healMul;
    if(f.waterCultMul)      r.waterCultMul *= f.waterCultMul;
    if(f.hpMaxPct)          r.hpMaxPct += f.hpMaxPct;
    if(f.contribGain)       r.contribGain += f.contribGain;
    if(f.relGainMul)        r.relGainMul *= f.relGainMul;
    if(f.breakP)            r.breakP += f.breakP;
    if(f.luckyP)            r.luckyP += f.luckyP;
    if(f.badP)              r.badP += f.badP;
    if(f.ascendP)           r.ascendP += f.ascendP;
    if(f.fateReroll)        r.fateReroll += f.fateReroll;
    if(f.fleeP)             r.fleeP += f.fleeP;
  }
  return r;
}
/* 立即一次性效果（永久属性 / 数值）；仅组合命中那一次调用 */
function applyComboImmediate(cm){
  try{
    const f = cm.fx || {};
    if(f.fame)       S.fame = Math.max(0, S.fame + f.fame);
    if(f.fate)       S.fate = clamp((S.fate||50) + f.fate, 0, 100);
    if(f.dao)        S.dao  = clamp(S.dao + f.dao, 0, DAO.length-1);
    if(f.enemyClear) S.enemy = 0;
    if(f.enemy)      S.enemy += f.enemy;
    if(f.herb)       S.herb = Math.max(0, S.herb + f.herb);
    if(f.lifespan)   S.lifespan += f.lifespan;
    if(f.atk)        S.atkBonus += f.atk;
    if(f.def)        S.defBonus += f.def;
    if(f.guard)      S.guard += f.guard;
    if(f.esc)        S.escBonus = (S.escBonus||0) + f.esc;
    if(f.unlockCard && S.unlocked) S.unlocked[f.unlockCard] = 1;
    if(f.unlockEnding){ S.flags.ending = S.flags.ending || {}; S.flags.ending[f.unlockEnding] = 1; }
    if(f.fateReroll) S.comboReroll = (S.comboReroll||0) + f.fateReroll;
  }catch(e){}
}
/* 组合命中判定：applyCard 结算后、advance 前调用（§6.1） */
function checkCombos(){
  try{
    if(!S || over) return;
    for(let i=0;i<COMBO_TBL.length;i++){
      const cm = COMBO_TBL[i];
      if(S.codex[cm.id]) continue;
      let met = false;
      try{ met = !!cm.cond(); }catch(e){ met = false; }
      if(!met) continue;
      S.codex[cm.id] = 1;
      applyComboImmediate(cm);
      entry('big','','有两样东西忽然对上了。你从前没往这处想过。',
        '机缘相合 · <span class="pos">'+esc(cm.n)+'</span> · 轨 '+cm.track+' · '+esc(cm.ef));
      note(1, '机缘相合 · '+esc(cm.n));
      playComboReveal(cm);
      recomputeBound(); renderAll();
    }
  }catch(e){}
}
/* ---------- 见闻录 §6.3 ---------- */
function renderCodex(){
  try{
    const grid = $('codex-grid'); if(!grid) return;
    const total = COMBO_TBL.length, got = Object.keys(S.codex||{}).length;
    const hint = $('codex-hint');
    if(hint) hint.innerHTML = '机缘相合者已录 <b>'+cnNum(got)+'</b> / '+cnNum(total)+' · 未解锁者只余一句提示，不揭其名。';
    grid.innerHTML = COMBO_TBL.map(cm=>{
      if(S.codex[cm.id]){
        return '<div class="codex-item"><div class="cn serif">'+esc(cm.n)+'</div>'
          + '<div class="cm">'+cm.mem.map(m=>esc(m)).join(' · ')+'</div>'
          + '<div class="cfx">'+esc(cm.ef)+'</div></div>';
      }
      return '<div class="codex-item codex-locked"><div class="cn serif">？ ？ ？</div>'
        + '<div class="cm">'+cnNum(cm.mem.length)+' 张卡的呼应</div><div class="cfx">尚未相合</div></div>';
    }).join('');
  }catch(e){}
}
function openCodex(){ try{ renderCodex(); $('ov-codex').classList.remove('in'); }catch(e){} }

/* ---------- R1 音频模块（纯 WebAudio 程序化 · 0 KB · 绝不报错） ---------- */
let MUTE=false, MOTION_REDUCED=false, AC=null, MASTER=null;
function persistSet(){ try{ localStorage.setItem('fdr013_set', JSON.stringify({m:MUTE?1:0, r:MOTION_REDUCED?1:0})); }catch(e){} }
function loadSet(){ try{ const s=JSON.parse(localStorage.getItem('fdr013_set')||'{}'); MUTE=!!s.m; MOTION_REDUCED=!!s.r; }catch(e){} }
function setMute(on){ MUTE=!!on; try{ if(MASTER) MASTER.gain.value = MUTE?0:0.18; }catch(e){} persistSet(); }
function initAudio(){
  try{
    if(AC) return AC;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    AC = new Ctx();
    /* 音效总线（仅存音效一路） */
    MASTER = AC.createGain(); MASTER.gain.value = MUTE?0:0.18;
    try{
      const comp = AC.createDynamicsCompressor(); comp.connect(AC.destination);
      MASTER.connect(comp);
    }catch(e){
      try{ MASTER.connect(AC.destination); }catch(_){}
    }
    return AC;
  }catch(e){ AC=null; return null; }
}
function resumeAudio(){ try{ if(AC && AC.state==='suspended') AC.resume(); }catch(e){} }
function _env(g, t0, peak){ try{ g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.001,peak), t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.02+0.30); }catch(e){} }
function _osc(type, f0, t0, dur, peak, f1, dest){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f0, t0);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0+dur);
    o.connect(g); g.connect(dest||MASTER);
    try{ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(Math.max(0.001,peak), t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur); }catch(e){}
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
function _noise(t0, dur, peak, cutoff, dest){
  if(!AC) return;
  try{
    const len = Math.max(1, Math.floor(AC.sampleRate*dur));
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
    const n = AC.createBufferSource(); n.buffer = buf;
    const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = cutoff||800;
    const g = AC.createGain(); g.gain.value = peak;
    n.connect(f); f.connect(g); g.connect(dest||MASTER); n.start(t0);
  }catch(e){}
}
function playSE(key){
  try{
    if(!AC || MUTE) return;
    const t = AC.currentTime + 0.012;
    switch(key){
      case 'deal':      _osc('triangle', 880, t, 0.06, 0.16, 660); break;
      case 'pick':      _osc('sine', 1320, t, 0.09, 0.18); _osc('sine', 2640, t, 0.09, 0.05); break;
      case 'gain':      _osc('sine', 660, t, 0.11, 0.16, 990); break;
      case 'loss':      _osc('sawtooth', 330, t, 0.15, 0.13, 220); break;
      case 'curtain':   _osc('sine', 110, t, 0.6, 0.16); break;
      case 'dice_win':  _osc('sine', 990, t, 0.3, 0.18); _osc('sine', 1480, t, 0.3, 0.08); break;
      case 'dice_lose': _noise(t, 0.3, 0.26, 520); _osc('sine', 160, t, 0.4, 0.15); break;
      case 'realm':     [523,587,659,784,880].forEach((f,i)=>_osc('sine', f, t+i*0.11, 0.26, 0.13)); break;
      case 'strike':    _osc('square', 440, t, 0.05, 0.12); break;
      case 'hit':       _noise(t, 0.08, 0.24, 700); break;
      case 'tick':      _osc('square', 1200, t, 0.03, 0.10); break;
      case 'fate_good': [523,659,784].forEach(f=>_osc('sine', f, t, 0.5, 0.12)); break;
      case 'fate_bad':  _osc('sine', 440, t, 0.5, 0.12); _osc('sine', 466, t, 0.5, 0.09); _osc('sine', 80, t, 0.5, 0.12); break;
      case 'combo':     _osc('sine', 440, t, 0.8, 0.13); _osc('sine', 660, t, 0.8, 0.08); _osc('sine', 1100, t, 0.8, 0.05); break;
      case 'finale_dead':   _osc('sine', 220, t, 1.5, 0.16, 110); break;
      case 'finale_ascend': [220,330,440,550].forEach((f,i)=>_osc('sine', f, t+i*0.12, 1.6, 0.10)); break;
    }
  }catch(e){}
}


/* ---------- R1 动画模块（全部为视觉叠加；状态推进与其无关） ---------- */
function respectMotion(){
  if(MOTION_REDUCED) return true;
  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(e){ return false; }
}
function _fxHost(){ return $('fx'); }
function playGateSeq(win, rollText){                       // A4 冲大境界（非阻塞：pointer-events:none）
  try{
    const host = _fxHost(); if(!host || respectMotion()) return;
    const ov = document.createElement('div'); ov.className='fx-layer on';
    const gate = document.createElement('div'); gate.className='fx-gate'; ov.appendChild(gate);
    const dice = document.createElement('div'); dice.className='fx-dice rolling'; dice.textContent='◆'; ov.appendChild(dice);
    host.appendChild(ov);
    playSE('curtain');
    try{ const st=S.stage; if(st>=15){ const b=document.createElement('div'); b.className='fx-bolt'; ov.appendChild(b); } }catch(e){}
    setTimeout(()=>{ gate.classList.add('out'); }, 600);
    setTimeout(()=>{ dice.classList.remove('rolling'); dice.classList.add('settle'); dice.textContent=rollText; }, 600);
    setTimeout(()=>{ const v=document.createElement('div'); v.className='fx-verdict '+(win?'win':'lose'); v.textContent = win?'成':'败'; ov.appendChild(v); playSE(win?'dice_win':'dice_lose'); }, 1060);
    setTimeout(()=>{ ov.style.transition='opacity .5s'; ov.style.opacity='0'; }, 1900);
    setTimeout(()=>{ try{ ov.remove(); }catch(e){} }, 2450);
  }catch(e){}
}
let _realmTs = 0;
function playRealmUp(name){                                // A6 境界提升（非阻塞）
  try{
    const _now = Date.now(); if(_now - _realmTs < 1300) return; _realmTs = _now;
    playSE('realm');
    const host = _fxHost(); if(!host || respectMotion()) return;
    const ov = document.createElement('div'); ov.className='fx-layer on';
    const sweep = document.createElement('div'); sweep.className='fx-sweep'; ov.appendChild(sweep);
    const big = document.createElement('div'); big.className='fx-big serif'; big.textContent=name; ov.appendChild(big);
    host.appendChild(ov);
    setTimeout(()=>{ ov.style.transition='opacity .5s'; ov.style.opacity='0'; }, 900);
    setTimeout(()=>{ try{ ov.remove(); }catch(e){} }, 1500);
  }catch(e){}
}
function playComboReveal(cm){                              // A9 组合揭示（非阻塞）
  try{
    playSE('combo');
    const host = _fxHost(); if(!host || respectMotion()) return;
    const ov = document.createElement('div'); ov.className='fx-combo';
    const halo = document.createElement('div'); halo.className='fx-halo'; ov.appendChild(halo);
    const bands = document.createElement('div'); bands.className='fx-bands';
    const cols = ['--el-jin','--el-mu','--el-shui','--el-huo','--el-tu'];
    (cm.mem||[]).forEach((m,i)=>{ const b=document.createElement('div'); b.className='fx-band';
      b.style.background='var('+cols[i%5]+')'; b.style.animationDelay=(i*70)+'ms'; bands.appendChild(b); });
    ov.appendChild(bands);
    const nm = document.createElement('div'); nm.className='fx-cname serif'; nm.textContent=cm.n; nm.style.animationDelay='320ms'; ov.appendChild(nm);
    const tg = document.createElement('div'); tg.className='fx-ctag'; tg.textContent='机缘相合 · 见闻录已录'; tg.style.animationDelay='460ms'; ov.appendChild(tg);
    host.appendChild(ov);
    requestAnimationFrame(()=>{ try{ ov.classList.add('on'); }catch(e){} });
    setTimeout(()=>{ ov.style.transition='opacity .5s'; ov.style.opacity='0'; }, 1200);
    setTimeout(()=>{ try{ ov.remove(); }catch(e){} }, 1760);
  }catch(e){}
}
function playMist(level){                                  // A10 血煞红雾（L1–L3）
  try{ if(respectMotion()) return; const host=_fxHost(); if(!host) return;
    const el=document.createElement('div'); el.className='fx-mist'; el.style.opacity=String(level||1); host.appendChild(el);
    setTimeout(()=>{ try{ el.remove(); }catch(e){} }, 400);
  }catch(e){}
}
function playQi(){                                         // A11 走火脉冲
  try{ if(respectMotion()) return; const host=_fxHost(); if(!host) return;
    const el=document.createElement('div'); el.className='fx-qi'; host.appendChild(el);
    setTimeout(()=>{ try{ el.remove(); }catch(e){} }, 700);
  }catch(e){}
}
/* A3 结算数字跳动：HUD 数字自上一值递增到当前值（纯视觉） */
const _cuLast = {};
function animateHudNumbers(){
  if(respectMotion()) return;
  try{
    document.querySelectorAll('#h-nums [data-cu]').forEach(b=>{
      const key=b.getAttribute('data-cu'), to=Number(b.getAttribute('data-cv'))||0;
      const from=_cuLast[key]; _cuLast[key]=to;
      if(from==null || Math.abs(to-from)<1) return;
      const t0=performance.now(), dur=400;
      const stepfn=(now)=>{ const k=Math.min(1,(now-t0)/dur); b.textContent=fmtNum(Math.round(from+(to-from)*k));
        if(k<1) requestAnimationFrame(stepfn); else b.classList.add('num-pop'); };
      requestAnimationFrame(stepfn);
    });
  }catch(e){}
}
/* A7 终局：金雨（飞升）；纯视觉 */
function playFinaleFx(ascend){
  try{
    playSE(ascend?'finale_ascend':'finale_dead');
    if(!ascend || respectMotion()) return;
    const host=_fxHost(); if(!host) return;
    for(let i=0;i<14;i++){ const d=document.createElement('div'); d.className='fx-rain';
      d.style.left=(6+i*6.4)+'%'; d.style.animationDelay=(i*0.12)+'s'; host.appendChild(d);
      setTimeout(()=>{ try{ d.remove(); }catch(e){} }, 3200); }
  }catch(e){}
}
/* A5 战斗交手：引擎行逐条浮现 + 跳过（纯视觉） */
function playBattleSeq(entryEl){
  try{
    if(!entryEl || respectMotion()){ playSE('strike'); return; }
    const lines = entryEl.querySelectorAll('.bl');
    if(!lines.length){ playSE('strike'); return; }
    playSE('strike');
    const sk = document.createElement('button'); sk.className='mini-btn off'; sk.textContent='跳过'; sk.style.marginTop='6px';
    sk.onclick = ()=>{ try{ lines.forEach(x=>{ x.style.animation='none'; }); }catch(e){} playSE('hit'); sk.remove(); };
    entryEl.appendChild(sk);
  }catch(e){}
}

/* ---------- 设置开关 ---------- */
function toggleMute(){ setMute(!MUTE); try{ renderDrawer(); }catch(e){} }
function toggleMotion(){ MOTION_REDUCED=!MOTION_REDUCED; try{ document.body.classList.toggle('reduce-motion', MOTION_REDUCED); }catch(e){} persistSet(); try{ renderDrawer(); }catch(e){} }
let _detected=false;
function detectLowEnd(){                                   // §1.4 低端机自动降级（一次性、只读）
  if(_detected) return; _detected=true;
  try{
    const hc = navigator.hardwareConcurrency, dm = navigator.deviceMemory;
    let low = (hc && hc<=4) || (dm && dm<=4);
    let n=0, t0=performance.now(), sum=0;
    const tick=(now)=>{ if(n>0) sum += (now-t0); t0=now;
      if(++n<=32){ requestAnimationFrame(tick); }
      else{ const avg=sum/31; if(avg>33) low=true;
        if(low && !MOTION_REDUCED){ MOTION_REDUCED=true; try{ document.body.classList.toggle('reduce-motion',true); }catch(e){} persistSet(); } } };
    requestAnimationFrame(tick);
  }catch(e){}
}

/* ---------- 22. 绑定 ---------- */
$('btn-start').onclick = ()=>{ try{ initAudio(); resumeAudio(); }catch(e){} detectLowEnd(); start(); };   // 首次手势：懒创建 AudioContext（§1.3）
$('btn-again').onclick = showOpening;
$('btn-drawer').onclick = e=>{ $('drawer').classList.toggle('open'); e.target.classList.toggle('on'); };
$('btn-eng').onclick = e=>{ document.body.classList.toggle('show-eng'); e.target.classList.toggle('on'); };
/* FDR-011 批2 · R10 事件委托：抽屉器物区「换上 / 卸下」——不给每行 onclick（重渲染会泄漏） */
$('dgrid').addEventListener('click', e=>{
  const t = e.target;
  if(!t || !t.classList) return;
  /* FDR-013 批4 · R1 开关 / R6 见闻录入口（抽屉内，事件委托） */
  if(t.id==='btn-sound'){ toggleMute(); return; }
  if(t.id==='btn-motion'){ toggleMotion(); return; }
  if(t.id==='btn-codex'){ openCodex(); return; }
  if(t.classList.contains('swap') && t.dataset && t.dataset.i != null){ swapEquip(parseInt(t.dataset.i,10)); return; }
  if(t.classList.contains('fix') && t.dataset && t.dataset.slot){ repairItem(t.dataset.slot); return; }
  if(t.classList.contains('off') && t.dataset && t.dataset.slot){ if(t.disabled) return; unequipSlot(t.dataset.slot); return; }
  /* FDR-014 · 功法「遗忘」：两击确认，防误触（2.2s 内再点方生效） */
  if(t.classList.contains('forget') && t.dataset && t.dataset.art){ armForget(t); return; }
});
/* 两击确认：首击置「确认遗忘」，超时自动还原 */
let _forgetArmT = null;
function armForget(btn){
  const name = btn.dataset.art;
  if(btn.dataset.armed==='1'){
    if(_forgetArmT){ clearTimeout(_forgetArmT); _forgetArmT=null; }
    btn.dataset.armed=''; btn.textContent='遗忘'; btn.classList.remove('arm');
    forgetArt(name);
    return;
  }
  btn.dataset.armed='1'; btn.textContent='确认遗忘'; btn.classList.add('arm');
  if(_forgetArmT) clearTimeout(_forgetArmT);
  _forgetArmT = setTimeout(()=>{
    _forgetArmT=null;
    try{ btn.dataset.armed=''; btn.textContent='遗忘'; btn.classList.remove('arm'); }catch(e){}
  }, 2200);
}
/* HUD 生效 spec chip → 跳详情 */
$('h-nums').addEventListener('click', e=>{
  const t = e.target && e.target.closest && e.target.closest('[data-jump="drawer"]');
  if(!t) return;
  $('drawer').classList.add('open');
  $('btn-drawer').classList.add('on');
});
document.addEventListener('click', e=>{
  const dr = $('drawer');
  if(!dr.classList.contains('open')) return;
  if(dr.contains(e.target)) return;
  /* 抽屉内按钮触发重渲染后，原 target 已脱离 DOM → contains() 失效误关；用 composedPath 兜住 */
  if(e.composedPath && e.composedPath().indexOf(dr) >= 0) return;
  if(e.target.closest && e.target.closest('#btn-drawer')) return;
  if(e.target.closest && e.target.closest('[data-jump="drawer"]')) return;
  dr.classList.remove('open');
  $('btn-drawer').classList.remove('on');
});
$('btn-fold').onclick = ()=>{
  sealTurn();
  const ds = document.querySelectorAll('.turn');
  Array.prototype.forEach.call(ds, d=>{ d.open=false; });
  if(ds.length) ds[ds.length-1].open = true;
  logEl.scrollTop = logEl.scrollHeight;
};
$('btn-all').onclick = ()=>{
  sealTurn();
  Array.prototype.forEach.call(document.querySelectorAll('.turn'), d=>{ d.open=true; });
};
$('btn-re').onclick = ()=>{ if(confirm('重新开始？本局进度将清空。')) location.reload(); };
/* FDR-013 批4 · R6 见闻录 收起；R1 首次任意手势懒创建音频（绝不自动播） */
$('codex-go').onclick = ()=>{ $('ov-codex').classList.add('in'); };
document.addEventListener('pointerdown', function _audioOnce(){
  document.removeEventListener('pointerdown', _audioOnce);
  try{ initAudio(); resumeAudio(); }catch(e){}
}, {passive:true});

loadSet();
if(MOTION_REDUCED){ try{ document.body.classList.add('reduce-motion'); }catch(e){} }
newGame();
$('cards').style.display='none';
showOpening();
</script>
