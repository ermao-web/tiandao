<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>道心无垢</title>
<style>
:root{
  --bg:#121317; --panel:#1a1b20; --panel2:#15161a;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.055);
  --txt:#e8e6e3; --dim:#8f8b86; --dim2:#6d6a66;
  --red:#c2493c; --gold:#c9a227; --jade:#5f9e7f;
  /* FDR-013 批4 · R1 §1.2 五行色卡（由现有色板派生） */
  --el-jin:#d9c58a; --el-mu:#5fae7a; --el-shui:#5f8fc9; --el-huo:#c2493c; --el-tu:#b58a55;
  --ease-out:cubic-bezier(.2,.8,.3,1); --ease-in:cubic-bezier(.6,0,.8,.2); --bounce:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.7;
  height:100vh;height:100dvh;overflow:hidden;
}
.serif{font-family:"Songti SC","SimSun","Noto Serif SC",serif}

.wrap{max-width:880px;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0;position:relative}
.topbar{flex:0 0 auto;position:relative;z-index:25}

/* ---------------- HUD（主角面板 · 固定顶部） ---------------- */
.hud{flex:0 0 auto;background:var(--panel2);border-bottom:1px solid var(--line);padding:7px 12px 8px}
.hrow{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden}
.realm{font-size:16px;color:var(--gold);letter-spacing:1px;white-space:nowrap;flex:0 0 auto}
.htags{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;flex:0 1 auto;min-width:0}
.chip{font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:2px;color:var(--dim);white-space:nowrap}
.chip.loc{color:#9fb6c9;border-color:rgba(159,182,201,.3)}
.chip.sect{color:var(--gold);border-color:rgba(201,162,39,.35)}
.chip.loose{color:var(--dim2)}
.spacer{flex:1;min-width:4px}
.hbtn{font-size:10.5px;padding:3px 7px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;border-radius:2px;font-family:inherit;transition:.15s;white-space:nowrap;flex:0 0 auto}
.hbtn:hover{color:var(--txt);border-color:rgba(255,255,255,.28)}
.hbtn.on{color:var(--gold);border-color:rgba(201,162,39,.5)}
.bar{height:5px;background:rgba(255,255,255,.07);border-radius:1px;overflow:hidden;margin:5px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a1e,var(--gold));transition:width .4s}
.bar.hp i{background:linear-gradient(90deg,#7c2b23,var(--red))}
.nums{display:flex;flex-wrap:wrap;gap:1px 11px;font-size:10.5px;color:var(--dim2);letter-spacing:.1px;line-height:1.5;margin-top:3px}
.nums b{color:var(--txt);font-weight:500;margin-left:3px}
.nums b.gold{color:var(--gold)}
.nums b.red{color:var(--red)}

/* ---------------- 抽屉 ---------------- */
.drawer{
  position:absolute;top:100%;left:0;right:0;background:var(--panel);
  border-bottom:1px solid var(--line);max-height:56vh;overflow-y:auto;
  opacity:0;pointer-events:none;transform:translateY(-8px);transition:.2s;
  box-shadow:0 14px 30px rgba(0,0,0,.55);
}
.drawer.open{opacity:1;pointer-events:auto;transform:none}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:2px 22px;padding:12px 14px 16px}
.sec-h{font-size:10px;letter-spacing:2px;color:var(--dim2);border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:7px}
.sec{margin-bottom:12px}
.prow{display:flex;justify-content:space-between;align-items:baseline;padding:2px 0;font-size:12.5px;gap:10px}
.prow span:first-child{color:var(--dim);white-space:nowrap}
.prow span:last-child{color:var(--txt);text-align:right}
.prow em{font-style:normal;color:var(--dim2);font-size:11px;margin-left:5px}
.threat{font-size:11.5px;color:var(--dim2);line-height:1.8;margin-top:4px}
.threat b{color:var(--dim);font-weight:400}
.locs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lc{font-size:10.5px;padding:1px 7px;border-radius:2px;border:1px solid var(--line2);color:var(--dim2)}
.lc.on{color:var(--gold);border-color:rgba(201,162,39,.4)}
.lc.here{background:rgba(201,162,39,.10)}
.mini{font-size:11px;color:var(--dim2);line-height:1.75;margin-top:5px}
.mini b{color:var(--dim);font-weight:400}

/* ---------------- 叙事流 ---------------- */
.logtools{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:4px 12px;border-bottom:1px solid var(--line2);font-size:10.5px;color:var(--dim2);letter-spacing:1px}
#log{flex:1 1 auto;overflow-y:auto;min-height:80px;padding:9px 14px 14px}
.turn{border-bottom:1px solid var(--line2);padding:2px 0 5px}
.turn>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 9px;padding:4px 2px;font-size:11.5px;color:var(--dim2)}
.turn>summary::-webkit-details-marker{display:none}
.turn>summary::before{content:"▸";color:var(--dim2);font-size:10px}
.turn[open]>summary::before{content:"▾";color:var(--gold)}
.turn>summary .ty{color:var(--dim)}
.turn>summary .tc{color:var(--gold);opacity:.9}
.turn>summary .ts{color:var(--dim2);font-size:11px}
.tbody{padding:2px 0 4px 12px}
.entry{margin:0 0 9px}
.entry .who{font-size:10px;letter-spacing:2px;color:var(--dim2);margin-bottom:3px}
.entry .prose{font-size:14.5px;line-height:1.9;color:#d7d4d0}
.entry.choice .prose::before{content:"▸ ";color:var(--red);font-size:12px}
.entry.sys .prose{color:var(--dim);font-size:12.5px;font-style:italic}
.entry.big{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin:8px 0}
.entry.big .prose{font-size:16px;color:var(--gold);letter-spacing:.5px}
.engine{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:11px;color:var(--dim);background:rgba(255,255,255,.028);border-left:2px solid var(--line);padding:3px 9px;margin-top:6px;letter-spacing:.2px}
.engine .pos{color:var(--jade)}
.engine .neg{color:var(--red)}
.bwrap{border-left:2px solid rgba(194,73,60,.45);padding:1px 0 1px 10px;margin:6px 0}
.bwrap .engine{margin-top:3px}

/* ---------------- 卡牌 ---------------- */
#cards{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel2);padding:6px 11px 8px;max-height:58vh;overflow-y:auto}
.cards-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:10px;letter-spacing:2px;color:var(--dim2)}
.cards-h .q{margin-left:auto;letter-spacing:0;font-size:10px}
.cgrid{display:flex;flex-direction:column;gap:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 10px;transition:.15s}
.card:hover{border-color:rgba(194,73,60,.4)}
.chead{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.chead .cat{font-size:9.5px;letter-spacing:2px;color:var(--dim2)}
.tier{font-size:9.5px;letter-spacing:1px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--dim2);margin-left:auto}
.tier.t-灵缘{color:#7fa8c9;border-color:rgba(127,168,201,.35)}
.tier.t-宝缘{color:var(--gold);border-color:rgba(201,162,39,.4)}
.tier.t-玄缘{color:#b98ad1;border-color:rgba(185,138,209,.4)}
.tier.t-仙缘{color:#e8d9a0;border-color:rgba(232,217,160,.45);text-shadow:0 0 6px rgba(232,217,160,.35)}
.tier.t-道缘{color:#f0f4ff;border-color:rgba(240,244,255,.5);text-shadow:0 0 8px rgba(240,244,255,.45)}
.ttitle{font-size:14.5px;color:var(--txt);letter-spacing:.5px;margin-bottom:3px}
.tdesc{font-size:12.5px;line-height:1.7;color:#b8b4af;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.ext .tdesc{-webkit-line-clamp:unset;display:block}
.textra{display:none;margin-top:7px}
.card.ext .textra{display:block}
.tflav{font-size:11.5px;color:var(--dim2);font-style:italic}
.tcost{font-size:11.5px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--line2)}
.tcost::before{content:"代价 · ";color:var(--red);opacity:.8}
.cfoot{display:flex;gap:8px;margin-top:6px}
.cfoot button{font-family:inherit;font-size:11.5px;padding:4px 12px;border-radius:2px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);transition:.15s}
.cfoot .more{padding:4px 10px}
.cfoot .more:hover{color:var(--txt)}
.cfoot .pick{margin-left:auto;border-color:rgba(201,162,39,.45);color:var(--gold);letter-spacing:2px}
.cfoot .pick:hover{background:rgba(201,162,39,.10)}
.card.no .pick{border-color:rgba(255,255,255,.12);color:var(--dim2);cursor:not-allowed}
.eng{display:none;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--dim);line-height:1.6}
body.show-eng .eng{display:block}

/* ---------------- FDR-011 批2 · 换装 / spec（≤1.5 KB · 由现有色板派生） ---------------- */
.mini-btn{padding:1px 7px;font-size:10.5px;line-height:1.4;border-radius:2px;background:transparent;font-family:inherit;cursor:pointer;flex:0 0 auto}
.mini-btn.swap{border:1px solid rgba(201,162,39,.45);color:var(--gold)}
.mini-btn.off{border:1px solid var(--line2);color:var(--dim2)}
.mini-btn.fix{border:1px solid rgba(95,158,127,.5);color:var(--jade)}
.mini-btn.off[disabled]{opacity:.4;cursor:not-allowed}
.bag-row,.equip-row{display:flex;align-items:center;min-height:22px;gap:6px}
.bag-row>span:first-child,.equip-row>span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.bag-row>span:nth-child(2),.equip-row>span:nth-child(2){color:var(--txt);text-align:right;flex:0 1 auto}
.spec-note{padding-left:8px}
.spec-note em{color:var(--dim2);font-size:10.5px;margin-left:0}
.spec-chip{font-style:normal;color:var(--gold);font-size:10px;border:1px solid rgba(201,162,39,.4);border-radius:2px;padding:0 4px;margin-left:6px}
.spec-hud{color:var(--gold);border:1px solid rgba(201,162,39,.4);border-radius:2px;padding:0 4px;cursor:pointer;font-size:9.5px}
.warn{font-style:normal;color:var(--gold);font-size:9.5px;margin-left:5px;opacity:.88}
.learn-chip{font-size:9.5px;color:var(--gold);border:1px solid rgba(201,162,39,.45);border-radius:2px;padding:0 5px;letter-spacing:.5px;white-space:nowrap}
.tspec{font-size:11.5px;color:var(--gold);margin-top:5px;opacity:.92}
.tset{font-size:11.5px;color:#9fb6c9;margin-top:3px;opacity:.92}
.tretake{font-size:11.5px;color:var(--dim);margin-top:3px}
.entry.retake{border-left:2px solid var(--red);padding-left:10px}
.entry.retake .prose{color:var(--gold)}
.lvbar{display:inline-block;width:44px;height:4px;background:rgba(255,255,255,.10);border-radius:1px;margin:0 6px;vertical-align:middle;overflow:hidden}
.lvbar b{display:block;height:100%;background:var(--gold)}
.cpdots{font-style:normal;color:var(--gold);letter-spacing:1px;margin:0 6px;font-size:9.5px}
/* FDR-014 · 功法不限量：行内「主修」徽标 + 「遗忘」按钮 */
.art-row{align-items:center}
.art-row>span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-row>span:nth-child(2){color:var(--txt);flex:0 1 auto}
.art-tag{font-style:normal;font-size:9.5px;border-radius:2px;padding:0 4px;margin-right:6px;border:1px solid var(--line2);color:var(--dim2)}
.art-tag.main{color:var(--gold);border-color:rgba(201,162,39,.45)}
.mini-btn.forget{border:1px solid rgba(194,73,60,.5);color:var(--red);margin-left:6px}
.mini-btn.forget.arm{border-color:var(--red);background:rgba(194,73,60,.18);color:#e5726a}
.bag-list{max-height:264px;overflow-y:auto}
#toast{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--gold);
  background:rgba(26,27,32,.92);border:1px solid var(--line2);border-radius:2px;padding:3px 12px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;white-space:nowrap}
#toast.in{opacity:1}

/* ---------------- 浮层 ---------------- */
.ov{position:fixed;inset:0;background:rgba(8,9,11,.95);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.ov.in{display:none}
.box{max-width:620px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:24px 26px;max-height:92vh;overflow-y:auto}
.box h1{font-size:22px;letter-spacing:5px;color:var(--gold);font-weight:400;margin-bottom:5px}
.box .sub{font-size:11px;letter-spacing:2px;color:var(--dim2);margin-bottom:16px}
.box .p{font-size:14px;line-height:1.95;color:#cfccc7;margin-bottom:11px}
.box .roll{margin:14px 0;padding:12px 14px;background:var(--panel2);border:1px solid var(--line2);border-radius:3px}
.box .roll .prow{font-size:12.5px}
.box .go{margin-top:18px;padding:10px 26px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:inherit;font-size:14px;letter-spacing:3px;cursor:pointer;border-radius:2px;transition:.15s}
.box .go:hover{background:rgba(201,162,39,.10)}
.box .end-t{font-size:25px;letter-spacing:7px;color:var(--gold);text-align:center;margin:4px 0 14px}
.box .end-d{font-size:14px;line-height:1.95;color:#cfccc7;text-align:center;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.opts button{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;padding:9px 13px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;border-radius:2px;transition:.15s;line-height:1.6}
.opts button:hover{border-color:rgba(201,162,39,.5);background:rgba(201,162,39,.07)}
.opts button small{display:block;color:var(--dim2);font-size:11.5px;margin-top:3px;line-height:1.6}
.opts button.dis{opacity:.38;cursor:not-allowed}
.opts button.dis:hover{border-color:var(--line);background:transparent}

/* ---------------- FDR-012 批3 · R3 套装 / R5 天命 ---------------- */
.set-chip{font-style:normal;color:#9fb6c9;font-size:10px;border:1px solid rgba(159,182,201,.32);border-radius:2px;padding:0 4px;margin-left:6px}
.set-note{padding-left:8px}
.set-note em{color:var(--dim2);font-size:10.5px;margin-left:0}
.set-note em b{color:#9fb6c9;font-weight:500}
.set-hud{color:#9fb6c9;border:1px solid rgba(159,182,201,.35);border-radius:2px;padding:0 4px;cursor:pointer;font-size:9.5px}
.fate-chip{color:var(--gold);border:1px solid rgba(201,162,39,.4);border-radius:2px;padding:0 4px;cursor:pointer;font-size:9.5px}
.fate-risk{font-size:9.5px;color:#b98ad1;border:1px solid rgba(185,138,209,.4);border-radius:2px;padding:0 5px;letter-spacing:.5px;white-space:nowrap}
/* 天命判定浮层（A8 基础版） */
#ov-fate{z-index:70}
.fate-box{text-align:center}
.fate-title{font-size:20px;letter-spacing:8px;color:var(--gold);margin-bottom:14px}
.fate-wheel{position:relative;width:198px;height:198px;margin:0 auto 16px;border-radius:50%;
  background:conic-gradient(#8a6a1e 0deg 30deg,#2c3a2e 30deg 60deg,#1d3a44 60deg 90deg,#4a2620 90deg 120deg,#3a3320 120deg 150deg,
    #8a6a1e 150deg 180deg,#2c3a2e 180deg 210deg,#1d3a44 210deg 240deg,#4a2620 240deg 270deg,#3a3320 270deg 300deg,
    #8a6a1e 300deg 330deg,#2c3a2e 330deg 360deg);
  box-shadow:0 0 26px rgba(201,162,39,.18), inset 0 0 22px rgba(0,0,0,.6)}
.fate-wheel::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(255,255,255,.10)}
.fate-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;line-height:44px;
  border-radius:50%;background:var(--panel);border:1px solid rgba(201,162,39,.5);color:var(--gold);font-size:18px;z-index:2}
.fate-needle{position:absolute;left:50%;top:50%;width:3px;height:88px;margin-left:-1.5px;margin-top:-88px;transform-origin:50% 100%;
  background:linear-gradient(180deg,var(--gold),rgba(201,162,39,.15));border-radius:2px;z-index:3}
.fate-needle::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--gold)}
#ov-fate.spinning .fate-needle{filter:drop-shadow(0 0 6px rgba(201,162,39,.7))}
.fate-tier{font-size:34px;letter-spacing:10px;margin-top:6px;opacity:0;transform:scale(.6);
  transition:opacity .28s ease, transform .28s cubic-bezier(.2,1.4,.4,1)}
.fate-tier.in{opacity:1;transform:none}
.fate-tier.good{color:var(--gold);text-shadow:0 0 16px rgba(201,162,39,.6)}
.fate-tier.bad{color:var(--red);text-shadow:0 0 16px rgba(194,73,60,.6)}
.fate-tier.flat{color:var(--dim)}
.fate-note{font-size:12px;color:var(--dim2);margin-top:6px;min-height:18px}

/* =========================================================
   FDR-013 批4 · R1 表现层（动画 / 特效 / 组合揭示 / 见闻录 / 开关）
   预算 ≤ 8 KB · 只用 transform/opacity · 氛围层 pointer-events:none
   ========================================================= */
/* —— 动画清单 §1.1 —— */
@keyframes dealIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pickSeal{0%{box-shadow:0 0 0 0 rgba(201,162,39,.0)}45%{box-shadow:0 0 0 2px rgba(201,162,39,.85),0 0 14px rgba(201,162,39,.5)}100%{box-shadow:0 0 0 1px rgba(201,162,39,.35)}}
@keyframes countTick{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes realmUp{0%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes finaleTitle{from{opacity:0;transform:translateY(10px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.14em}}
@keyframes goldSweep{from{transform:translateX(-140%)}to{transform:translateX(140%)}}
@keyframes curtainIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@keyframes curtainOut{from{transform:translateY(0)}to{transform:translateY(-100%)}}
@keyframes diceRoll{from{transform:rotate(0)}to{transform:rotate(2160deg)}}
@keyframes diceSettle{0%{transform:scale(1.5)}60%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes boltFlash{0%{opacity:0}18%{opacity:.9}36%{opacity:.15}60%{opacity:.7}100%{opacity:0}}
@keyframes comboConverge{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:none}}
@keyframes comboBurst{0%{opacity:0;transform:scale(.5);filter:blur(6px)}55%{opacity:1;transform:scale(1.08);filter:blur(0)}100%{opacity:1;transform:scale(1)}}
@keyframes haloSpin{to{transform:rotate(360deg)}}
@keyframes harmFlash{0%{opacity:0;transform:translateX(0)}25%{opacity:.9;transform:translateX(-3px)}60%{transform:translateX(3px)}100%{opacity:0;transform:none}}
@keyframes qiPulse{0%{opacity:0}40%{opacity:.85}100%{opacity:0}}
@keyframes rainFall{from{opacity:0;transform:translateY(-12px)}20%{opacity:1}to{opacity:0;transform:translateY(60px)}}
/* —— 发牌 A1 / 选卡 A2 —— */
.card.deal{animation:dealIn 180ms var(--ease-out) both}
.card.pick-seal{animation:pickSeal 220ms var(--ease-out) both}
.card.fading{opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
/* —— 引擎行结算数字 A3 —— */
.num-pop{animation:countTick 400ms linear both}
/* —— 境界提升 A6 —— */
.realm-pop{animation:realmUp 1200ms var(--bounce) both}
/* —— 终局 A7 —— */
.box.finale .end-t{animation:finaleTitle 1500ms var(--ease-in) both}
/* —— 视觉叠加层（A4/A6/A9 共用；pointer-events:none ⇒ 永不阻塞交互） —— */
#fx{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
.fx-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.fx-layer.on{opacity:1}

.fx-gate.out{animation:curtainOut .5s var(--ease-in) both}
.fx-bolt{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 30%,rgba(219,230,255,.55),transparent 70%);animation:boltFlash .5s linear both}
.fx-dice{width:74px;height:74px;border-radius:8px;background:var(--panel);border:1px solid rgba(201,162,39,.55);color:var(--gold);

.fx-dice.rolling{animation:diceRoll 900ms var(--ease-out) both}
.fx-dice.settle{animation:diceSettle 260ms var(--bounce) both}
.fx-big{font-size:30px;letter-spacing:10px;color:var(--gold);text-shadow:0 0 20px rgba(201,162,39,.5);animation:realmUp 1200ms var(--bounce) both}
.fx-verdict{font-size:40px;letter-spacing:14px;font-weight:400}
.fx-verdict.win{color:#e6d79a;text-shadow:0 0 22px rgba(217,197,138,.6)}
.fx-verdict.lose{color:var(--red);text-shadow:0 0 22px rgba(194,73,60,.6)}
/* —— 组合揭示 A9 —— */
.fx-combo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0}
.fx-combo.on{opacity:1}
.fx-bands{display:flex;gap:12px}
.fx-band{width:12px;height:74px;border-radius:3px;opacity:0;animation:comboConverge 700ms var(--ease-out) both}
.fx-combo.on .fx-band{animation-name:comboBurst}
.fx-halo{position:absolute;width:230px;height:230px;border-radius:50%;border:1px solid rgba(201,162,39,.35);

.fx-combo.on .fx-halo{opacity:1}
.fx-cname{font-size:24px;letter-spacing:8px;color:var(--gold);text-shadow:0 0 18px rgba(201,162,39,.55);animation:comboBurst 900ms var(--ease-out) both}
.fx-ctag{font-size:11.5px;letter-spacing:3px;color:var(--dim);animation:comboBurst 1s var(--ease-out) both}
/* —— 血煞红雾 / 走火反馈（L1–L3） —— */
.fx-mist{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 55%,rgba(140,20,20,.28),transparent 72%);animation:harmFlash .3s var(--ease-out) both}
.fx-qi{position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(194,73,60,.55);animation:qiPulse .6s var(--ease-in) both}

.codex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:8px;margin-top:8px}

K('人际','灵缘','落水的老道','河湾里有人喊救命。你想了想，把一个湿透的老道拖上了岸。他咳了半天，攥着你的袖子。','救人的时候，没想那么多。','他湿了你一身，也惹了一身麻烦。',{rel:{n:'落水老道',v:2},debts:1,fame:2},{min:2,max:8}),
K('人际','灵缘','卖消息的瘸子','镇上那个瘸腿的凑过来，说后山最近不太平，要几个铜钱。','他的消息，七分真三分假。','那几个铜钱，是你半个月的饭。',{ss:-10},{min:2,max:7}),
K('人际','宝缘','独行的女修','山道上遇见一个独行的女修。她说前路凶险，愿与你同行一段。','同行的路，走一段算一段。','她的来路，你没问。',{cultivate:25,rel:{n:'独行女修',v:2}},{min:4,max:9}),
K('人际','灵缘','坊市的老掌柜','你替老掌柜搬了半日的货，他多留你喝了一盏茶，说了些行价。','东西的价钱，不在货上。','你知道了些你不该知道的。',{ss:20,rel:{n:'坊市掌柜',v:1}},{min:3,max:9,loc:['市']}),
K('人际','灵缘','同门的照应','你在山门口崴了脚，两个同门把你架了回去，一路上笑得很大声。','笑归笑，抬还是会抬。','你欠了他们一顿酒。',{fame:2,rel:{n:'同门',v:2}},{min:3,max:9,sect:'in'}),
K('人际','宝缘','秘境里的陌生人','石室里还有一个人。你们背对着背退了出去，谁也没回头。','走着走着，就成了同行的人。','你不知道他叫什么。',{cultivate:40,rel:{n:'同行者',v:1}},{min:6,max:9,loc:['秘']}),
K('人际','灵缘','泽边的渔家','泽边的渔家留你住了一宿，煮了一锅杂鱼。第二天临走，塞给你一把晒干的草。','水边的人，话少，手不空。','你替他们补了半天的渔网。',{herb:2,fame:2},{min:8,max:9,loc:['泽']}),
K('人际','宝缘','散修的酒局','一伙散修在破庙里喝酒，见你进来，递过来一只碗。你坐下了。','散修的酒，喝的是抱团。','你听了一夜的牢骚。',{cultivate:30,ss:20,rel:{n:'散修一伙',v:2}},{min:4,max:9,sect:'out'}),
K('人际','玄缘','金丹修士的一眼','那人从云上落下来时，你连呼吸都放轻了。他看了你一眼，什么也没说就走了。','被看一眼，就够你记十年。','你在原地站了很久。',{cultivate:60,fame:5},{min:10}),
/* ============ 功法 · 16 ============ */
K('功法','凡缘','村学先生的口诀','教书的先生不识修行，却会一套吐纳的法子，说是祖上传下来的。他教给了你。','先生说是养生的。','口诀残缺，你只能照着硬练。',{cultivate:8,mainArt:'粗浅吐纳诀'},{max:3}),
K('功法','凡缘','打更人的调息法','夜里打更的老汉，一字一字地教你怎么把气吊在胸口不散。','他打了一辈子的更。','他的法子慢，你不一定等得及。',{cultivate:6},{max:3}),
K('功法','凡缘','拳师的三招','镇上的老拳师教你三招站桩，说练熟了受用不尽。','功夫是一天一天磨出来的。','站到腿肚子打颤。',{cultivate:6},{max:3}),
K('功法','凡缘','抄来的字帖','你照着旧字帖一笔一笔地练字，练着练着，竟也觉出些门道。','字里也有气。','费了不少灯油。',{cultivate:5},{max:3}),
K('功法','灵缘','残页上的三式拳','集市上收来的一页残纸，上头画着三个起手式。你照着比划了几个月。','纸上没写怎么收势。','练岔了，筋骨要疼些日子。',{arts:1,cultivate:12},{min:1,max:5}),
K('功法','灵缘','祠堂旧匾后的手抄','老祠堂的匾后塞着一卷手抄，纸都脆了。你小心展开，开头几句像是引气的路数。','前人藏东西，多半有道理。','你不敢全信，只挑着练。',{cultivate:18,mainArt:'残卷引气术'},{min:1,max:6}),
K('功法','灵缘','老猎户的听风诀','山里的老猎户教你怎么听风辨物，说这比眼睛管用。你跟着他在山里蹲了好几个夜。','风里有东西，你得学会听。','山里的夜，冷得钻骨头。',{arts:1,cultivate:12},{min:2,max:8}),
K('功法','灵缘','货栈换来的拓本','你把攒下的东西抵给了货栈，换回一册拓本。拓本旧，字口却清。','舍得出去，才换得回来。','你几乎掏空了自己。',{arts:1,ss:-12},{min:2,max:8}),
K('功法','灵缘','丹房里的火诀','丹房的老师傅随手教了你两手看火的诀窍。他说这不算传功，算搭手。','火候不到，药就是草。','你在丹房里熏了一身药味。',{arts:1,cultivate:30},{min:3,max:9,sect:'in'}),
K('功法','宝缘','石壁上的刻痕','洞窟深处的石壁上刻着一路指法。笔画深得几乎看不见了，你用手一寸寸摸过去。','刻它的人，早不在了。','你在暗处描了整整两日。',{arts:1,cultivate:40},{min:4,max:9}),
K('功法','宝缘','藏经阁的一夜','你借着洒扫的差事在阁里留了一夜。第三层最里头的架子，落了很厚的灰。','有些书，就是等人来翻。','你被执事记了一笔。',{cultivate:55,mainArt:'青云引气经'},{min:4,max:9,sect:'in'}),
K('功法','宝缘','秘境里的半卷帛书','帛书压在石台下，一半已经烂了。你只来得及记住前面的行气路数。','剩下的半卷，在别人手里。','你走的时候，听见了脚步声。',{arts:1,cultivate:60},{min:6,max:9,loc:['秘']}),
K('功法','宝缘','泽底的水行诀','你在一艘沉船里摸到一只铜匣，匣里的帛还干着。','水里的东西，最会藏。','你在水底憋得太久，耳鸣了半旬。',{arts:1,cultivate:70},{min:8,max:9,loc:['泽']}),
K('功法','玄缘','洞天石壁的道纹','石壁上的纹路不是刻的，是长出来的。你顺着它走了一遍，浑身发麻。','看得懂的人，才配站在这里。','你看完之后躺了三日。',{arts:1,cultivate:120},{min:10,loc:['天']}),
K('功法','玄缘','剑冢里的残意','断剑插了一地，你拔不出任何一把。可你走了一圈，手里像是多了点什么。','剑不在手上，在眼睛里。','你的手被割了七道口子。',{arts:2,cultivate:110},{min:10}),
K('功法','玄缘','长老的传功','长老把手按在你背上的时候，你觉得有一江水灌了进来。','到了这一步，得有人肯渡你。','你欠了宗门一份大情。',{arts:2,cultivate:150},{min:10,sect:'in'}),
/* ============ 危险 · 16 ============ */
K('危险','凡缘','荒山的野狼','天黑你还在山梁上，三只狼远远跟着。你捡了根烧火棍，退到崖边，才把它们熬走。','它们不急，你急。','胳膊上被撕开一道口子。',{lifespan:-1},{max:3}),
K('危险','凡缘','夜路的坟地','夜里你路过一片坟地。风把纸钱吹得直响。你走得很快，但没跑。','心里有鬼，才有鬼。','一夜没敢合眼。',{dao:-1},{max:3}),
K('危险','凡缘','坡上的滑石','下坡时脚下一滑，你滚出去老远，好在只是皮外伤。','山里的路，是给熟人走的。','擦破了半边身子。',{lifespan:-1},{max:3}),
K('危险','灵缘','拦路的山匪','山口的三个汉子要你留下买路钱。你把大半的盘缠给了他们，一声没吭。','破财免灾，老话。','往后半个月，你只能喝粥。',{ss:-20,lifespan:-1},{min:1,max:5}),
K('危险','灵缘','发了狂的野猪','灌木里冲出一头獠牙野猪。你躲不及时，被撞进了沟里。','山里的畜生，比人干脆。','肋骨断了一根。',{lifespan:-2},{min:1,max:6}),
K('危险','灵缘','山中的毒瘴','谷底的瘴气是青色的。你掩着口鼻硬穿过去，出来时眼前一阵阵发黑。','山里的雾，不都是雾。','你歇了整整三日。',{lifespan:-3},{min:2,max:8,loc:['野']}),
K('危险','灵缘','夜半的梦魇','连着几夜，你梦见同一个人在雾里叫你。醒来的时候，衣裳都是湿的。','梦是假的，怕是真的。','你有些分不清了。',{dao:-1},{min:2,max:8}),
K('危险','灵缘','走火','你贪快，把周天的路线走岔了。一口气堵在膻中，半日才散开。','急于求成，总要还的。','你退了半步。',{progressPct:-0.12,lifespan:-2},{min:2,max:9}),
K('危险','灵缘','两修士的争斗','两个修士在半空斗法，你在崖下躲着。等他们走了，你上去捡了些散落的东西。','神仙打架，凡人捡漏。','余波扫下来，你半天爬不起来。',{ss:25,lifespan:-2,cultivate:15},{min:3,max:9}),
K('危险','灵缘','坊市的口角','你挡了人家的路，对方身后站着三个人。你低声道了歉。','低头不丢人，断腿才丢人。','你赔了一笔钱。',{ss:-25,lifespan:-1},{min:3,max:9,loc:['市']}),
K('危险','灵缘','同门相争','为了一份差事，同门在山道上拦住了你。你们谁也没动手，但话都说尽了。','撕破脸，只在一句话。','你多了一个仇人。',{dao:-1,enemy:1},{min:4,max:9,sect:'in'}),
K('危险','宝缘','守物兽','洞最深处的暗处卧着一头似鹿非鹿的东西。你屏着气绕过去，捡了它脚边的东西就退。','拿了别人的，总要付点什么。','它追了你半里地。',{cultivate:35,lifespan:-4},{min:6,max:9,loc:['秘']}),
K('危险','宝缘','沼泽里的陷足','一脚踩空，半个人陷了下去。你抓着草根，一点一点把自己拔出来。','泽地不拦人，它只是不收。','你丢了鞋子，也丢了半条命。',{lifespan:-5,herb:1},{min:8,max:9,loc:['泽']}),
K('危险','宝缘','水妖的试探','水面浮起一串泡泡，然后是一只手。你后退了三步，它没有追。','它只是在看你够不够吃。','你丢了水边搭的窝棚。',{ss:40,lifespan:-4,cultivate:30},{min:8,max:9,loc:['泽']}),
K('危险','玄缘','洞天里的傀儡','石人从壁上走了下来，一步一个坑。你退到坑道里，屏了半个时辰的气。','老东西守老地方。','你的左肩废了三个月。',{cultivate:80,material:4,lifespan:-8},{min:10,loc:['天']}),
K('危险','玄缘','遗蜕的威压','那具遗蜕坐得笔直。你只看了一眼，膝盖就软了。','有的人死了，还在看着。','你爬出洞天的时候，头发白了一片。',{cultivate:100,dao:-1,lifespan:-6},{min:10,loc:['天']}),
/* ============ 抉择 · 16 ============ */
K('抉择','凡缘','路边的钱袋','路边的草里有个钱袋，鼓鼓的。四下无人。你想了想，把它捡起来，在地头等了半日。','等不来人，钱就归你；等来了，就当白等。','你等了半日，回来时天黑了。',{ss:18,fame:1},{max:3}),
K('抉择','凡缘','村里的苛捐','里正又来摊派。别人都躲，你出头说了几句，说得里正脸上挂不住。','出头的人，都记在别人心里。','你被记了一笔。',{ss:-12,fame:3},{max:3}),
K('抉择','凡缘','邻家的门户','邻里丢了鸡，挨家挨户地找。没人来问你，你还是把自家院子开给他看了。','问心无愧，就不怕人看。','你耽误了半日的活。',{fame:1},{max:3}),
K('抉择','凡缘','集上多找的铜钱','集上买东西，摊主多找了你几个铜钱。你走出十几步，又折了回去。','几个铜钱的事。','你多跑了一趟。',{fame:2},{max:3}),
K('抉择','灵缘','受伤的陌生人','山路上躺着一个人，气息还在。你把他背到了镇上，中途后悔了三次。','背他的时候，你骂了自己一路。','他伤得重，你的药也搭了进去。',{herb:-1,fame:3,rel:{n:'受伤的陌生人',v:2},debts:1},{min:1,max:6}),
K('抉择','灵缘','散修的路','有人劝你去投个宗门，说背靠大树好乘凉。你在山门口站了一整夜，转身走了。','有门有派，也有门有派的苦。','你成了真正的散修，也真的一无所有。',{ss:40,fame:2},{min:2,max:9,sect:'out'}),
K('抉择','灵缘','同门的求助','同门来信，说手头紧，问你借些灵石，年底就还。','借出去的钱，多半回不来。','你借了，心里空了一块。',{ss:-15,rel:{n:'同门',v:1},fame:1},{min:2,max:7,sect:'in'}),
K('抉择','灵缘','旧友的旧账','多年前的一个旧相识找上门来，说你欠他的，该还了。你其实记不清。','记不清的账，最难还。','你还了，心里别扭。',{ss:-20,rel:{n:'旧相识',v:-1}},{min:2,max:8}),
K('抉择','灵缘','墙外的传功','夜里你去看了一场传功。你躲在墙外，把该听的不该听的都听了。','听来的东西，用起来总不踏实。','你怕人认出你来。',{cultivate:28,dao:-1,fame:-1},{min:3,max:8}),
K('抉择','宝缘','一地灵脉的归属','两伙人为一片灵脉争了起来。有人来拉你入伙，许你一份。','入了伙，就由不得自己。','你点头了。从此有了一伙人，也有了对面的人。',{cultivate:30,ss:40,enemy:1},{min:4,max:9}),
K('抉择','灵缘','长老的暗示','长老把手里的茶盏放下，说山上的事，总要有人去做。你听懂了，也没全懂。','有些话，是拿来猜的。','你接了一桩不好推的差事。',{contrib:20,ss:20},{min:5,max:9,sect:'in'}),
K('抉择','宝缘','同道的夺宝之争','石室里还有一个人，也在盯着那卷东西。你们对视了一瞬。','先动手的，未必赢。','你抢在了前面，也留下了个仇人。',{cultivate:45,enemy:1},{min:6,max:9,loc:['秘']}),
K('抉择','灵缘','泽边船家的求助','船家的孩子在泽里走丢了两天。你下水找了一夜，捞上来的时候人是活的。','泽水很冷，你也没多想。','你冻伤了肺，咳嗽了小半年。',{fame:3,rel:{n:'泽边船家',v:2},ss:-20,lifespan:-2},{min:8,max:9,loc:['泽']}),
K('抉择','宝缘','旧宗的残卷','有人在坊市暗中兜售一册残卷，价钱高得离谱，来路也不干净。','便宜的东西，才最贵。','你买下之后，总觉得有人在跟着你。',{cultivate:50,ss:-80,enemy:1},{min:5,max:9,loc:['市']}),
K('抉择','玄缘','拍卖行上的压价','一件东西你势在必得。你把价喊到了自己都心虚的地方。','心里没底的人，喊价最响。','你几乎掏空了积蓄。',{ss:-200,material:6,fame:3},{min:10,loc:['市']}),
K('抉择','玄缘','洞天里的三问','石壁上有三问，你答了两问，第三问答不出来。你在那儿坐到天亮。','答不出来，也是答案。','你出洞时，把两问忘了。',{cultivate:80,dao:1},{min:10,loc:['天']}),
/* ============ 心境 · 14 ============ */
K('心境','凡缘','照常打坐','你在柴房里坐了半宿。没什么变化，也没什么不好。','日子就是这么过去的。','一夜就这么过去了。',{cultivate:6},{max:3}),
K('心境','凡缘','一场梦','你梦见自己站在很高的地方。醒来时，枕头是湿的。','梦里的风，也是风。','你发了半天呆。',{cultivate:5},{max:3}),
K('心境','凡缘','灶前的火星','你守着灶火，看火苗一跳一跳。心里也跟着慢慢静下来。','火有火的脾气。','一锅饭烧糊了。',{cultivate:5},{max:3}),
K('心境','凡缘','屋后的月亮','夜里睡不着，你到屋后坐了坐。月亮很亮，照得地上像落了一层霜。','看过月亮的人，心都不太一样。','第二天你起晚了。',{cultivate:6,dao:1},{max:3}),
K('心境','灵缘','夜里的静','这一夜格外静。你听着自己的呼吸，一呼一吸都落到了实处。','有时候，静就是药。','你坐到天亮，忘了睡。',{cultivate:12,dao:1},{min:2,max:6}),
K('心境','灵缘','心头的刺','有件事一直横在心里。你越想越烦，越练越乱。','心不静，气就散。','你白练了一晚。',{cultivate:10,dao:-1},{min:2,max:9}),
K('心境','灵缘','雨天的顿悟','雨打在瓦上，你忽然想起很多年前的一件事。那一瞬间，有什么东西松了。','顿悟不多，一辈子就那么几次。','你错过了半场雨，也想通了半句话。',{cultivate:25,dao:1},{min:3,max:9}),
K('心境','灵缘','旧仇的回响','走在路上，你忽然想起那个人的脸。握拳的时候，指甲掐进了掌心。','仇是记在肉里的。','你这一路都不得安生。',{cultivate:15,dao:-1},{min:3,max:9}),
K('心境','灵缘','走火入魔的一夜','你练得太急，夜里忽然听见有人在耳边数数。数到七的时候你咬破了舌头。','有些路，走快一步就出事。','你两颊凹陷，歇了小半年。',{dao:-2,cultivate:40,lifespan:-2},{min:4,max:9}),
K('心境','宝缘','闭关三日','你封了门窗，谁也不见。三天后出来的时候，人瘦了一圈，眼睛却亮。','人是要在黑里待一待的。','这三天你什么也没吃。',{cultivate:45,dao:1},{min:5,max:9}),
K('心境','宝缘','月下的剑意','你对着月亮把学过的拳脚走了一遍。走到最后一遍的时候，你听见了风声。','东西是练出来的，不是想出来的。','你练到两腿发软。',{cultivate:60,arts:1,dao:1},{min:6,max:9}),
K('心境','宝缘','泽边的独坐','你在泽边坐了很久。水面什么也没有，你还是坐着。','空的地方，才能装东西。','你被蚊子咬了一身。',{cultivate:70,dao:1},{min:8,max:9,loc:['泽']}),
K('心境','玄缘','洞天里的枯坐','你在洞天里坐着，什么也不想。中间醒过几次，不记得是哪一年。','不记得的事，都长在身上了。','你出去的时候，胡子长到了胸口。',{cultivate:130,dao:2},{min:10,loc:['天']}),
K('心境','玄缘','心魔','夜里你看见一个人站在床前，长得和你一模一样。他什么也没说，你也没动。','看见自己，是件很累的事。','你这一夜之后老了很多。',{dao:-2,cultivate:60,lifespan:-5},{min:10}),
/* ============ 器物 · 16 ============ */
K('器物','凡缘','铁匠铺的旧刀','铁匠把炉底的旧刀翻出来，说砍柴使得，砍人使不得。','刀旧，钢还在。','你攒了半年的钱。',{ss:-15,equip:{n:'柴刀',p:3}},{max:4}),
K('器物','灵缘','猎户的短弓','老猎户的弓用了十几年，弓弦上还留着他的手汗。','东西认人，也认手。','你替他打了三个冬天的柴。',{ss:-20,equip:{n:'猎弓',p:4}},{min:1,max:6,loc:['野','镇']}),
K('器物','灵缘','一件旧皮甲','旧皮甲上补了七八处，缝线却结实。你把它套在身上试了试。','补过的，才牢。','你脱下来的时候一身汗。',{ss:-25,equip:{n:'旧皮甲',p:3}},{min:1,max:6}),
K('器物','灵缘','坊市里的青锋剑','剑鞘是新的，剑是旧的。老板说这叫物有所值。','会挑的人，看刃不看鞘。','你花光了全部身家。',{ss:-60,equip:{n:'青锋剑',p:9}},{min:3,max:9,loc:['市']}),
K('器物','灵缘','坊市里的护身符','摊主说这符能挡一劫。你问他挡不挡第二劫，他笑了。','挡一劫就值一劫的钱。','你半信半疑地付了钱。',{ss:-45,equip:{n:'护身玉符',p:6}},{min:3,max:9,loc:['市']}),
K('器物','灵缘','一柄断剑','剑断了半截，断口却很平。你握着剩下的一半试了试，比新的还沉手。','断了的东西，反而实在。','你用了半个月才找到合适的手感。',{material:1,equip:{n:'断剑',p:7}},{min:4,max:9,loc:['野','秘']}),
K('器物','灵缘','同门转手的法器','同门急着用钱，把一件使了多年的法器折价让给了你。','急用钱的人，最好说话。','你欠了他一个人情。',{ss:-70,equip:{n:'青木剑',p:11}},{min:4,max:9,sect:'in'}),
K('器物','灵缘','宗门赐下的道袍','你办完第一桩门派差事，执事给了你一件新的道袍。','穿上它，别人就知道你是谁家的。','这件袍子，穿上了就不好脱。',{equip:{n:'云纹道袍',p:8}},{min:5,max:9,sect:'in'}),
K('器物','灵缘','一枚温养的灵石','那石头攥久了会热。你把它缝在贴身的衣袋里。','护心的东西，都不出声。','你为此把攒的钱又掏空了。',{ss:-80,equip:{n:'护心石',p:10}},{min:5,max:9}),
K('器物','宝缘','秘境里拾得的铜镜','铜镜背面刻着东西。你不认得，可它握在手里比石头重。','古时的东西，都压手。','你盯着它看久了，有点晕。',{equip:{n:'古铜镜',p:12}},{min:6,max:9,loc:['秘']}),
K('器物','宝缘','云梦泽的蛟筋','泽里的老渔家说这是蛟的筋。你试着拉了拉，手被弹开了。','水里的东西，性子都硬。','你花了三年的积蓄。',{ss:-90,equip:{n:'蛟筋索',p:14}},{min:8,max:9,loc:['泽']}),
K('器物','宝缘','泽底捞出的铁匣','匣子沉得离谱，你把水倒了三遍才提得动。','沉的东西，里面装着沉的东西。','你的肩膀脱了臼。',{equip:{n:'玄铁匣',p:16}},{min:8,max:9,loc:['泽']}),
K('器物','宝缘','坊市的千年寒铁','摊主赌咒说是千年寒铁。你敲了敲，声是闷的。','买定离手，各认各的命。','回去才发现里头有砂眼。',{ss:-120,equip:{n:'寒铁剑',p:18}},{min:7,max:9,loc:['市']}),
K('器物','玄缘','洞天里的古剑','剑插在石里，你拔了三天。第四天早上，它自己滑了出来。','不是你的剑，不会认你。','你拔剑的时候，掌心裂了一道口。',{equip:{n:'归墟古剑',p:30}},{min:10,loc:['天']}),
K('器物','玄缘','铸剑师的一炉','铸剑师说他这辈子只开三次炉。前两次的剑，都死了主人。','好剑是拿命换的。','你把所有身家都押了上去。',{ss:-260,equip:{n:'流光剑',p:38}},{min:10,loc:['市']}),
K('器物','玄缘','遗蜕手上的戒指','戒指戴在骨头上，你取了很久才取下来。','死人的东西，最干净也最脏。','你戴上去的时候，手指凉了一整年。',{ss:-150,equip:{n:'储物戒',p:12}},{min:10,loc:['天']}),
/* ============ 地方 · 12（行路与落脚） ============ */
K('地方','灵缘','入山','你收拾了一个包袱，往南荒深处走。回头时，青石镇的屋顶已经看不见了。','走的人，才知道路有多长。','你把家门的钥匙埋在了门槛下。',{locate:'野'},{min:1,loc:['镇']}),
K('地方','灵缘','回镇','山里待久了，你还是回了趟镇子。街上的人还在为米价吵架。','你在山上待惯了，看他们像看画。','来回一趟，走了半个月。',{locate:'镇'},{min:2,loc:['野']}),
K('地方','灵缘','下山采买','你揣着钱下山。坊市比你记得的热闹得多。','有人的地方，就有价钱。','你在人堆里挤了一整天。',{locate:'市'},{min:3,loc:['镇','野']}),
K('地方','灵缘','离开坊市','坊市里的味道让你睡不着。天没亮你就出了城。','闻惯了钱味，就闻不惯草味。','你走的时候没跟任何人打招呼。',{locate:'野'},{min:4,loc:['市']}),
K('地方','宝缘','寻访落霞','你花了两季打听落霞秘境的入口。最后是一个醉汉指的路。','没人去的地方，才轮得到你。','你在山口等了三个月，等雾散。',{locate:'秘'},{min:6,loc:['镇','野','市']}),
K('地方','灵缘','出了秘境','你从秘境里出来的时候，身上的衣服已经不遮体了。','进去的人多，出来的人少。','你在山口躺了两天。',{locate:'野'},{min:7,loc:['秘']}),
K('地方','宝缘','向云梦去','你沿江往南走了半年。越走水气越重，天越低。','大的地方，说话都慢。','你走坏了两双鞋。',{locate:'泽'},{min:8,loc:['野','市']}),
K('地方','灵缘','离开云梦','泽边的雾气你受够了。你顺着水往回走。','待不住的地方，就是不该待。','你走出泽地的时候，鞋子还在滴水。',{locate:'野'},{min:9,loc:['泽']}),
K('地方','玄缘','入归墟','你站在洞口看了很久。洞里没有风，也没有回声。','往里走一步，就回不了头。','你把随身的东西都留在了洞口。',{locate:'天'},{min:10,loc:['野','秘','泽']}),
K('地方','灵缘','山中的落脚','你在背风处搭了个窝棚，一住就是一季。','人总要有个屋顶。','下雨的时候，窝棚漏得像筛子。',{cultivate:15,lifespan:1},{min:2,max:9,loc:['野']}),
K('地方','灵缘','荒村的一夜','山里有个荒村，房梁还立着。你在灶边睡了一夜。','空房子比破庙暖和。','你走的时候，把灶灰抹平了。',{cultivate:10,herb:1},{min:3,max:9,loc:['野']}),
K('地方','宝缘','泽畔的草庐','你在泽边搭了间草庐，住下就不想动。','水边住久了，人也会软。','潮气进了骨头。',{cultivate:40,dao:1,lifespan:3},{min:8,max:9,loc:['泽']}),
/* ============ 秘境 · 14（只在秘境 / 泽 / 洞天出现） ============ */
K('秘境','宝缘','落霞的门','雾散的那一刻，崖下露出一道石门。门上的刻字已经风化得看不出了。','门开着的时候，不算藏。','你在门前站了很久才进去。',{cultivate:45,lifespan:-2},{min:6,max:9,loc:['秘']}),
K('秘境','宝缘','石门后的石室','石室空得反常。只有靠墙的地方，摆着几个倒扣的陶罐。','空得反常的地方，往往不空。','你踩碎了一个陶罐，声音在洞里滚了很久。',{ss:60,material:3},{min:6,max:9,loc:['秘']}),
K('秘境','宝缘','古碑前的一坐','碑上没有字，只有几道刻痕。你看着看着就坐下了。','看不懂的东西，看久了会有用。','你坐到腿麻。',{cultivate:60,dao:1},{min:6,max:9,loc:['秘']}),
K('秘境','宝缘','秘境的水池','池水清得能看见底下的石头，石头缝里长的东西你叫不出名字。','越清的水，越看不出深浅。','你喝了之后吐了两天。',{herb:4,cultivate:35},{min:6,max:9,loc:['秘']}),
K('秘境','宝缘','深处的尸骸','尸骸靠着石壁，坐得很正。他手边放着一个没打开的匣子。','死在这里的人，都是自己走进来的。','你把尸骸埋了，才去拿匣子。',{material:4,ss:80,lifespan:-3},{min:7,max:9,loc:['秘']}),
K('秘境','宝缘','秘境里的幻阵','你走了一个时辰，回到了同一个地方。第三次的时候你坐下了。','困住你的不是路，是你自己。','你出来的时候，头发乱得像草。',{dao:-1,cultivate:70},{min:7,max:9,loc:['秘']}),
K('秘境','宝缘','云梦的水府','水府的柱子是活的，摸上去会缩。你在里面不敢大声喘气。','水底下的东西，比岸上老。','你出来的时候，耳朵一直在响。',{ss:120,material:5},{min:8,max:9,loc:['泽']}),
K('秘境','宝缘','泽底的沉船','船身半埋在淤泥里，桅杆还立着。舱里的箱子锁着，你用石头砸开了。','沉下去的，总有浮上来的一天。','你在水里呛了三次。',{material:4,ss:90,lifespan:-2},{min:8,max:9,loc:['泽']}),
K('秘境','宝缘','泽心岛的一夜','岛上什么也没有，只有草。你躺了一夜，听见水里一直有东西在动。','岛是给累了的人准备的。','你没敢合眼。',{cultivate:90,dao:1},{min:8,max:9,loc:['泽']}),
K('秘境','宝缘','水府的残卷','卷子泡了不知多少年，字迹却还在。你把它摊在石头上晾了一夜。','水泡过的东西，最难保存，也最难毁。','你晾了三天才敢卷起来。',{arts:1,cultivate:80},{min:9,max:9,loc:['泽']}),
K('秘境','玄缘','归墟第一重','门后是一段很长的台阶。你走了很久，回头看，入口还是那么大。','越深的地方，越不讲道理。','你数着台阶，数到一半就忘了。',{cultivate:150,ss:200},{min:10,loc:['天']}),
K('秘境','玄缘','归墟深处','你看见的东西不是给你看的。你只看了一眼，就往回走。','有些地方，来过就算赢了。','你的手一直在抖。',{material:8,cultivate:180,lifespan:-10},{min:10,loc:['天']}),
K('秘境','玄缘','洞天里的时间','你出来的时候，外面的树粗了一圈。你说不清自己在里面待了多久。','时间在有的地方，是弯的。','你少了好几年的寿。',{cultivate:220,lifespan:-15},{min:10,loc:['天']}),
K('秘境','玄缘','遗蜕前的一拜','你先拜了三拜。那具遗蜕像是点了一下头——也可能是你的错觉。','敬，是给自己留后路。','你起身的时候，膝盖在响。',{dao:2,arts:1,cultivate:160},{min:10,loc:['天']}),
/* ============ 宗门 · 19（青云宗） ============ */
K('宗门','灵缘','外门考选','青云宗在山下设了考选。三百人里取十二个，你排到了最后一个。','名次不重要，进去了才重要。','你在山门外跪了一夜。',{sect:true},{min:2,max:9,sect:'out',entry:1}),
K('宗门','灵缘','山门前的长队','山门外排着长队，有人已经等了两年。你排在队尾，看着山上的云。','门里的人，看不见门外的队。','你等了整整一季。',{sect:true,fame:1},{min:2,max:9,sect:'out',entry:1}),
K('宗门','灵缘','外门杂役','你被分去看药圃。每天除草、挑水，手上的茧比在山里的时候还厚。','先学会干活，再学做事。','你一年没正经练过功。',{contrib:8,ss:10,herb:1},{min:2,max:5,sect:'in'}),
K('宗门','灵缘','讲经堂的一场','外门每月开一次讲经。你挤在后排，把能听懂的那几句记了下来。','听不懂的，先记下来。','你回来抄了三个晚上。',{contrib:5,cultivate:30},{min:3,max:9,sect:'in'}),
K('宗门','灵缘','采药差事','执事发下竹篓，让你们往南荒深处采药。同去的人各走各的路。','差事是借口，出去才是真的。','你摔下山坡，磕破了额头。',{contrib:12,herb:2,ss:15},{min:3,max:7,sect:'in'}),
K('宗门','灵缘','巡山','巡山是苦差。你在山道上来回了两个月，见到的野物比人多。','守着山的人，最先知道山里的变化。','你被冻掉了两个脚趾的知觉。',{contrib:15,ss:20,lifespan:-1},{min:4,max:8,sect:'in'}),
K('宗门','灵缘','丹房帮工','丹房缺人手，你被调去烧火。三个月下来，你能闻出哪一炉要废。','火候是闻出来的。','你被熏得半年闻不见饭香。',{contrib:10,pill:2},{min:4,max:9,sect:'in'}),
K('宗门','灵缘','演武场的比试','你在演武场赢了三场，输了两场。第四场结束的时候，有人给你递了水。','输赢都记在同一本册子上。','你被打掉了两颗牙。',{contrib:18,fame:2,lifespan:-1},{min:4,max:9,sect:'in'}),
K('宗门','灵缘','内门的门槛','执事把你的名字圈了出来，说下一批内门有你。','圈出来的名字，也会划掉。','你为了这份差，把该走的关系都走了。',{contrib:25,ss:30},{min:5,max:9,sect:'in'}),
K('宗门','灵缘','阁里的差事','藏经阁要一个识字的人抄书。你去了，抄了半年的目录。','抄目录的人，迟早会想翻书。','你抄到手腕发炎。',{contrib:12,cultivate:45},{min:5,max:9,sect:'in'}),
K('宗门','宝缘','长老的点拨','你运气走岔，长老路过，抬手在你背上按了一下。那口气就顺了。','有人的一句话，顶你自己想三年。','你从此欠着一份人情。',{contrib:10,cultivate:60,dao:1},{min:6,max:9,sect:'in'}),
K('宗门','宝缘','同门的倾轧','有人把你的差事抢了，还说你办事不妥。你去找执事，执事说知道了。','知道，就是不办。','你从此多留了个心眼。',{dao:-1,contrib:-5,enemy:1},{min:6,max:9,sect:'in'}),
K('宗门','宝缘','真传之争','三个内门争一个真传的名额。你的名字在最后。','站到台面上的人，都得挨一刀。','有人在你的丹里动了手脚。',{contrib:40,fame:4,enemy:1},{min:7,max:9,sect:'in'}),
K('宗门','宝缘','驻守坊市','宗门要人在黑石坊市看着铺子。你去了，一守就是两年。','看铺子的人，最先学会算账。','你被山下的风气泡软了。',{contrib:20,ss:60},{min:7,max:9,sect:'in',loc:['市']}),
K('宗门','宝缘','宗门大比','大比三年一次。你站在台上，看见底下站着很多张不认识的脸。','赢下来的人，才算进了山门。','你被打断了两根肋骨。',{contrib:60,fame:6,ss:50,lifespan:-2},{min:8,max:9,sect:'in'}),
K('宗门','宝缘','长老的召见','长老问你话，你答得谨慎。他听完，只说了一句「还行」。','还行，是很好的评价了。','你出了一身冷汗。',{contrib:30,pill:3},{min:8,max:9,sect:'in'}),
K('宗门','宝缘','执事的差遣','执事把一桩说不清的事交给你。你做完了，他也没问你怎么办的。','有些差事，办完就当没办过。','你得罪了不该得罪的人。',{contrib:35,ss:80,enemy:1},{min:9,max:9,sect:'in'}),
K('宗门','玄缘','授职','门中给了你一个正式的职司。你穿上那件袍子，站在了堂上。','站上去容易，站住难。','从此你的名字写在了一本册子上。',{contrib:80,fame:8},{min:10,sect:'in'}),

{"c":"战斗","tier":"宝缘","t":"泽里伸出来的那只手","d":"水面浮起一串泡，然后是一只手。它搭上船舷的时候，你才看清那手上有鳞。","f":"它只是在看你够不够吃。","cost":"船在水中央。","ef":{"battle":{"foe":"水妖","pw":[105,135],"loot":"宝缘","canFlee":true}},"min":8,"max":12,"loc":["泽"]},
{"c":"战斗","tier":"灵缘","t":"仇家找上门","d":"你在路上被拦住了。对方说，还记得那年吗。你记得，你一直记得。","f":"结下的仇，总有来讨的一天。","cost":"躲不掉，这次是冲你来的。","ef":{"battle":{"foe":"旧仇","scale":1,"loot":"灵缘","canFlee":true,"ambush":true}},"min":3},
{"c":"战斗","tier":"灵缘","t":"宗门差事 · 清剿妖巢","d":"执事把一面旗交给你，说山坳里那窝狼该清了。你去了，窝里比说的大。","f":"差事上的字，总比实情少。","cost":"这是差事，推不掉。","ef":{"battle":{"foe":"狼巢之主","scale":0.85,"loot":"灵缘","canFlee":false},"contrib":15},"min":4,"sect":"青云宗"},
{"c":"战斗","tier":"宝缘","t":"血煞门的劫道者","d":"岭上的人不拦路，他们直接动手。你听见背后的风声时，已经晚了半步。","f":"魔道不谈条件。","cost":"他们看上了你身上所有能用的。","ef":{"battle":{"foe":"血煞劫道者","scale":1.05,"loot":"宝缘","canFlee":true,"ambush":true}},"min":6,"loc":["煞","野","墟"]},
{"c":"战斗","tier":"宝缘","t":"青丘的巡山妖","d":"林子里走出一个披着皮的。它问你是谁家的。你说你没家，它笑了。","f":"在它的林子里，你才是异类。","cost":"它不打算放你过去。","ef":{"battle":{"foe":"巡山妖","scale":0.95,"loot":"宝缘","canFlee":true}},"min":7,"loc":["丘","野"]},
{"c":"战斗","tier":"灵缘","t":"商盟的护队（认错了人）","d":"一队押货的把你围了，说你昨夜动过他们的货。你没有，可他们不信。","f":"认错人的时候，是最难讲理的时候。","cost":"解释要花时间，他们不给。","ef":{"battle":{"foe":"商盟护队","scale":0.8,"loot":"凡缘","canFlee":true}},"min":4,"loc":["市","墟"]},
{"c":"战斗","tier":"宝缘","t":"夺宝的那个散修","d":"石室里还有一个人，也在盯着那卷东西。你们对视了一瞬，谁都没说话。","f":"先动手的，未必赢。","cost":"东西只有一份。","ef":{"battle":{"foe":"夺宝散修","scale":1,"loot":"宝缘","canFlee":true}},"min":6,"max":12,"loc":["秘","野"]},
{"c":"战斗","tier":"玄缘","t":"古修遗蜕前的幻影","d":"你先拜了三拜，起身时面前多了一个人。他穿着和你一样的衣服。","f":"他不是鬼，是你自己留下的。","cost":"退不开，它挡在来路上。","ef":{"battle":{"foe":"遗蜕幻影","scale":1.15,"loot":"玄缘","canFlee":false}},"min":10,"loc":["天"]},
{"c":"战斗","tier":"玄缘","t":"妖潮的前哨","d":"天边黑了一线。等你看清的时候，那不是云，是跑起来的东西。","f":"潮来了，先到的是最快的那批。","cost":"你身后是镇子。","ef":{"battle":{"foe":"妖潮前哨","scale":1.35,"loot":"玄缘","canFlee":true,"ambush":true}},"min":10,"loc":["野","泽","丘"]},
{"c":"战斗","tier":"宝缘","t":"演武场上没能收住手","d":"你本只想赢。可他倒了之后还抓着你的袖子，你又补了一下。场上没人说话。","f":"台上收不住的手，台下收不住的命。","cost":"从此台上有了你的说法。","ef":{"battle":{"foe":"同门","scale":1,"loot":"凡缘","canFlee":false},"enemy":1,"dao":-1,"contrib":-10},"min":7,"sect":"青云宗"},
{"c":"宗门","tier":"灵缘","t":"山门外的长队","d":"山门外排着长队，有人已经等了两年。你排在队尾，看着山上的云，忽然不确定自己在等什么。","f":"门里的人，看不见门外的队。","cost":"你等了整整一季。","ef":{"sect":true,"sectJoin":"青云宗","fame":1},"min":2,"max":9,"sect":"out"},
{"c":"宗门","tier":"灵缘","t":"执事房的杂役","d":"你被分去执事房扫地、挑水、跑腿。一天下来，手上的茧比在山里时还厚。","f":"先学会干活，再学做事。","cost":"你一年没正经练过功。","ef":{"contrib":8,"ss":10,"herb":1},"min":2,"max":6,"sect":"青云宗"},
{"c":"宗门","tier":"宝缘","t":"内门的腰牌","d":"执事把你的名字圈了出来，说下一批内门有你。腰牌是新的，字是旧的。","f":"圈出来的名字，也会划掉。","cost":"你为了这份差，把该走的关系都走了。","ef":{"contrib":25,"ss":30},"min":6,"sect":"青云宗"},
{"c":"宗门","tier":"灵缘","t":"血煞岭的引路人","d":"岭下有人等着，见你上来，只问了一句：怕不怕。你说不怕。他笑了。","f":"进这道门的，都说自己不怕。","cost":"你从此回不了青云宗。","ef":{"sect":true,"sectJoin":"血煞门","dao":-1},"min":4,"max":11,"loc":["煞","野"],"sect":"join","entry":1},
{"c":"宗门","tier":"灵缘","t":"献上的那碗血","d":"堂里递过来一只碗。你接的时候手很稳，喝下去的时候喉咙是烫的。","f":"入了这门，身子就不全是自己的。","cost":"你咳了三天。","ef":{"contrib":20,"lifespan":-2,"atk":3},"min":5,"sect":"血煞门"},
{"c":"宗门","tier":"宝缘","t":"噬心堂的差事","d":"堂里给了你一桩差事，说对方也是修士。你问为什么，堂里说不用问。","f":"问得少的，活得久。","cost":"你做完之后，有人记住了你的脸。","ef":{"contrib":45,"ss":120,"lifespan":-3,"enemy":1},"min":7,"sect":"血煞门"},
{"c":"宗门","tier":"灵缘","t":"商盟的记账先生","d":"柜台后面坐着个记账的，问你会不会认字。你说会一点。他推过来一本账。","f":"商盟不问出身，问你值多少。","cost":"你得押上半年的自由。","ef":{"sect":true,"sectJoin":"黑石商盟","ss":-40},"min":3,"max":10,"loc":["市","墟"],"sect":"join","entry":1},
{"c":"宗门","tier":"灵缘","t":"押一趟货","d":"一队人，一辆车，走三个月。路上没人说话，只在换马的时候点头。","f":"货到了，人才算活。","cost":"路上什么都可能遇上。","ef":{"contrib":18,"ss":60,"lifespan":-1},"min":3,"sect":"黑石商盟"},
{"c":"宗门","tier":"宝缘","t":"柜上的位置","d":"大掌柜把你叫到柜上，指了指他旁边那把椅子。坐下之后你才发现，那椅子比站着冷。","f":"坐上去的人，说话要过一遍脑子。","cost":"从此你说的每句话都算商盟的。","ef":{"contrib":60,"fame":4,"ss":150},"min":7,"sect":"黑石商盟"},
{"c":"宗门","tier":"灵缘","t":"破庙里的那只碗","d":"破庙里一伙人在喝酒，见你进来，递过来一只碗。你接了，喝了一口，是凉的。","f":"散修的酒，喝的是抱团。","cost":"你听了一夜的牢骚。","ef":{"sect":true,"sectJoin":"无定散修盟","cultivate":20},"min":2,"max":12,"loc":["墟","野"],"sect":"join","entry":1},
{"c":"宗门","tier":"灵缘","t":"替盟里跑一趟","d":"盟里缺人往南边送一封信。没人愿意去，你去了。信送到了，收信的人连门都没开。","f":"跑腿的活，总得有人干。","cost":"来回走了一个多月。","ef":{"contrib":15,"fame":2},"min":3,"sect":"无定散修盟"},
{"c":"宗门","tier":"宝缘","t":"散修盟的公断","d":"两个散修争一头妖的皮，请你来断。你断完了，两个都不太满意，但都认了。","f":"没官没府的地方，话就得有人来说。","cost":"从此两边的事，都算在你头上。","ef":{"contrib":40,"fame":5,"dao":1},"min":6,"sect":"无定散修盟"},
{"c":"宗门","tier":"宝缘","t":"青丘的引路人","d":"林子里走出一个披着皮的，说它奉命来接一个人。它看了你很久，说，就是你。","f":"妖不骗人，妖只是不解释。","cost":"人族的山门，从此对你关了。","ef":{"sect":true,"sectJoin":"青丘妖族","dao":-1,"lifespan":10},"min":7,"loc":["丘","泽"],"sect":"join","entry":1},
{"c":"宗门","tier":"宝缘","t":"月下的妖宴","d":"他们围着一堆火坐下，吃的什么你没敢细看。有人递给你一杯，你喝了。","f":"吃了别人的饭，就是别人的人。","cost":"酒是腥的，你没吐。","ef":{"contrib":35,"lifespan":3,"dao":-1,"cultivate":60},"min":8,"sect":"青丘妖族"},
{"c":"秘境","tier":"宝缘","t":"石门后的第二条甬道","d":"第一条甬道走到底是一堵墙。你在墙上摸到一道缝，缝后面还有一条。","f":"看得见的路，都不算路。","cost":"你在窄处挤了很久。","ef":{"cultivate":70,"material":3,"lifespan":-2},"min":6,"max":10,"loc":["秘"]},
{"c":"秘境","tier":"宝缘","t":"泽底的水府偏殿","d":"正殿你不敢进，偏殿的门是开的。柱子上刻着的人脸，越看越像活的。","f":"偏殿里的东西，是给客人看的。","cost":"你出来的时候耳朵一直在响。","ef":{"ss":130,"material":5,"cultivate":80},"min":8,"max":12,"loc":["泽"]},
{"c":"秘境","tier":"玄缘","t":"归墟的第二重","d":"第二重的台阶比第一重陡。你走到一半，回头看，第一重已经看不见了。","f":"越深的地方，越不讲道理。","cost":"你在里面待了不知多久。","ef":{"cultivate":200,"ss":220,"lifespan":-8},"min":11,"loc":["天"]},
{"c":"秘境","tier":"宝缘","t":"血煞岭的地火窟","d":"窟底是红的，往上冒着热气。你靠近一步，眉毛就焦了一截。","f":"地里烧的火，比炉里的凶。","cost":"你出来时眉毛没了半边。","ef":{"cultivate":90,"material":4,"lifespan":-3},"min":6,"loc":["煞"]},
{"c":"秘境","tier":"宝缘","t":"青丘的祠堂","d":"祠堂里没有牌位，只有一排挂着的皮。风一过，它们都动了一下。","f":"它们不是死了，是换了个样子。","cost":"你在那儿站到天亮。","ef":{"cultivate":110,"dao":1,"lifespan":-4},"min":9,"loc":["丘"]},
{"c":"秘境","tier":"灵缘","t":"无定墟下的旧窖","d":"棚户底下有个窖，里面堆着不知多少年的破烂。你翻了半天，翻出几样还能使的。","f":"穷人的窖，富人的坟。","cost":"你在里面呛了一身灰。","ef":{"ss":45,"material":2,"herb":2},"min":4,"loc":["墟"]},
{"c":"秘境","tier":"玄缘","t":"洞天里的药园","d":"药园荒了，可土还是黑的。你认出其中两三株，剩下的连名字都叫不出。","f":"没人管的地方，长的东西最野。","cost":"你在园里守了整整一季。","ef":{"herb":8,"cultivate":160,"lifespan":6},"min":12,"loc":["天"]},
{"c":"秘境","tier":"玄缘","t":"归墟最深的那口井","d":"井不深，可你看不见底。你把石子丢下去，等了很久，没有回声。","f":"没有回声的地方，不要喊第二声。","cost":"你少了几年的寿。","ef":{"cultivate":300,"dao":2,"lifespan":-15},"min":14,"loc":["天"]},
{"c":"疗伤","tier":"凡缘","t":"山里的止血草","d":"你认得那种草，嚼碎了敷在伤口上，辣得抽气。血倒是慢下来了。","f":"山里的草，认得伤。","cost":"你用掉了一味药。","ef":{"heal":{"pct":0.25},"herb":-1},"min":0},
{"c":"疗伤","tier":"灵缘","t":"借了间屋子躺三天","d":"一户人家腾了半间屋给你。你躺了三天，什么也没想，什么也没练。","f":"躺得住的人，才好得快。","cost":"三天就这么过去了。","ef":{"heal":{"pct":0.45}},"min":1},
{"c":"疗伤","tier":"灵缘","t":"药铺的一碗汤","d":"药铺掌柜给你熬了一碗黑的。你喝下去，从喉咙苦到胃里，然后身上松了。","f":"苦的东西，多半管用。","cost":"两味好药搭了进去。","ef":{"heal":{"pct":0.55},"herb":-2},"min":1,"max":9,"loc":["镇","市","墟"]},
{"c":"疗伤","tier":"灵缘","t":"老道留下的一丸丹","d":"那丸药你一直没舍得吃。今天你抠出来，闻了闻，还是那个味道。","f":"留着的东西，总有要用的那天。","cost":"你吃掉了一颗丹，也添了一分毒。","ef":{"heal":{"pct":0.7},"pill":-1,"danPoison":2},"min":2},
{"c":"疗伤","tier":"宝缘","t":"温泉里泡了半月","d":"山背阴处有一眼温泉。你泡了半个月，泡到皮肤发皱，骨头里的寒气才散。","f":"热水治不了大病，能治累。","cost":"半个月什么也没干。","ef":{"heal":{"pct":0.6},"cure":true,"lifespan":1},"min":5,"loc":["野","泽"]},
{"c":"疗伤","tier":"宝缘","t":"同门替你推宫过血","d":"同门把手按在你背上，推了整整一夜。天亮时他脸色比你还差。","f":"肯给你推血的人，不多。","cost":"你欠了他一份大的。","ef":{"heal":{"pct":0.8},"cure":true,"debts":1},"min":5,"sect":"in"},
{"c":"疗伤","tier":"宝缘","t":"自己在洞里舔伤口","d":"没人来，你只能自己来。你把伤口洗干净，咬着布条缠好，然后坐着等天亮。","f":"没人管的时候，人也得活。","cost":"好得慢，也留下了根。","ef":{"heal":{"pct":0.35},"hpMax":{"pct":-0.03},"dao":1},"min":4},
{"c":"疗伤","tier":"玄缘","t":"洞天里的静水","d":"一潭静水，你下去坐着。水不冷不热，泡久了，身上那些旧伤像被人一点点抹平了。","f":"有的水，泡的不是身子。","cost":"你在水里坐到分不清昼夜。","ef":{"heal":{"pct":1},"cure":true,"hpMax":{"pct":0.05},"lifespan":-3},"min":10,"loc":["天"]},
{"c":"危险","tier":"灵缘","t":"一场硬扛过去的大病","d":"你烧了半个月，烧到认不出人。等烧退了，你发现自己轻了很多，也空了很多。","f":"病这东西，不看你是谁。","cost":"你瘦了一圈，也少了几年。","ef":{"lifespan":-4,"hpMax":{"pct":-0.06},"cultivate":-10},"min":2},
{"c":"危险","tier":"灵缘","t":"走火的那半个时辰","d":"一口气堵在膻中，上不去也下不来。你咬着牙把它压回去，压回去的时候眼前全黑了。","f":"急于求成的，总要还。","cost":"你退了半步，也折了些寿。","ef":{"progressPct":-0.15,"lifespan":-3,"dao":-1},"min":2,"max":9},
{"c":"危险","tier":"宝缘","t":"强行冲了一次关","d":"你明知还差一点，还是冲了。那口气撞在关卡上，弹回来的时候，你听见自己骨头响了一声。","f":"差一点，就是差很多。","cost":"你冲了，也赔了。","ef":{"progressPct":-0.2,"lifespan":-6,"hpMax":{"pct":-0.08},"dao":-1},"min":4},
{"c":"危险","tier":"宝缘","t":"丹毒发作的一夜","d":"你身上那股药味越来越重。这一夜它发作了，你在地上滚到天亮，指甲抓裂了席子。","f":"吃下去的，总要出来。","cost":"毒是出来了一些，人也空了一些。","ef":{"danPoison":-5,"lifespan":-3,"hpMax":{"pct":-0.05}},"min":4},
{"c":"危险","tier":"宝缘","t":"被人下在酒里的东西","d":"那碗酒你喝了。半个时辰之后，你才发现自己握不住剑。","f":"敬酒的人，不一定是想敬你。","cost":"你现在知道是谁了，可你拿他没办法。","ef":{"lifespan":-5,"hpMax":{"pct":-0.07},"enemy":1,"dao":-1},"min":5,"loc":["市","墟","煞"]},
{"c":"危险","tier":"玄缘","t":"心魔坐了一整夜","d":"夜里你看见一个人坐在床前，长得和你一模一样。他什么也没说，你也没动。天亮时他还在。","f":"看见自己，是件很累的事。","cost":"这一夜之后，你老了很多。","ef":{"lifespan":-7,"dao":-2,"cultivate":80},"min":8},
{"c":"危险","tier":"玄缘","t":"逆行周天","d":"你把周天倒着走了一遍。气是走了，走的方向不对，走完之后你吐了血。","f":"有的路，倒着走也能走，只是要付钱。","cost":"血换来的，不会白给你。","ef":{"lifespan":-8,"hpMax":{"pct":-0.1},"atk":6,"cultivate":90},"min":9},
{"c":"危险","tier":"灵缘","t":"在洞里睡过了头","d":"你本只想坐一夜。等你睁眼，洞口的光已经换过好几回了。你爬出去，山下的树粗了一圈。","f":"洞里的时间，是别人的时间。","cost":"你不知少了多少年。","ef":{"lifespan":-5,"cultivate":120},"min":5,"loc":["秘","天","煞"]},
{"c":"危险","tier":"宝缘","t":"替人挡下来的那一击","d":"那一击是冲着他去的。你把他推开，自己挨了。挨完你躺在地上，想了很久自己为什么推。","f":"推开的那一瞬间，没想过值不值。","cost":"你替他挨了，他替你记着。","ef":{"lifespan":-6,"hp":{"pct":-0.5},"fame":3,"rel":{"n":"被你救下的人","v":3}},"min":5},
{"c":"危险","tier":"玄缘","t":"油尽灯枯之前","d":"你最近常常忘了自己刚才要做什么。你摸了摸自己的脉，跳得比以前慢了很多。","f":"灯要灭的时候，会先亮一下。","cost":"要续这一口气，得拿东西换。","ef":{"lifespan":8,"dao":-1,"progressPct":-0.3},"min":10},

/* ===== 卡池 C · FDR-007 四派系补充（xs / hs / wd / qq，各 1 入门 + 5 事务） ===== */
{"c":"宗门","tier":"灵缘","t":"岭口的那道石槽","d":"岭口横着一道石槽，槽底的黑是旧的。引路人递来一把薄刀，说先放自己的。你割开了，血顺着槽走，走了很远才渗完。","f":"门里的规矩，是先收你的，再给你。","cost":"你少了些寿，也少了一点自己。","ef":{"sect":true,"sectJoin":"血煞门","lifespan":-3,"dao":-1},"min":6,"max":12,"sect":"join","loc":["煞"],"entry":1},
{"c":"宗门","tier":"宝缘","t":"堂里的血祭","d":"堂中地上有一圈旧痕，痕里是干的。你站进去，念的词是从别人那儿听来的。念到一半，你觉出身上有东西被抽出去了。","f":"要得快，就得先把自己的摆上。","cost":"这一场，你折了寿。","ef":{"cultivate":65,"lifespan":-5,"dao":-1,"contrib":12},"min":6,"max":11,"sect":"xs"},
{"c":"宗门","tier":"宝缘","t":"半道上截下的那颗丹","d":"山下有人要破境，丹托了人捎。堂里让你去截。你截到了。他跪在地上，没抬头——不是认输，是不敢记住你的脸。","f":"他要的东西，现在是你的了。","cost":"从此有人记得你。","ef":{"pill":1,"contrib":30,"ss":55,"dao":-1,"enemy":1},"min":7,"max":12,"sect":"xs"},
{"c":"宗门","tier":"宝缘","t":"噬心堂的药池","d":"池子里泡着人，也泡着药。管池的让你下去，说泡到骨头响为止。你泡了。出来时皮是红的，那股味半个月没散。","f":"有的药，是用人养的。","cost":"你身上那股味，洗不掉了。","ef":{"cultivate":75,"contrib":15,"lifespan":-4,"dao":-1},"min":8,"max":12,"sect":"xs"},
{"c":"宗门","tier":"灵缘","t":"这个月的献纳","d":"堂里按例收献。你把这个月能拿出来的都摊在案上。管事的扫了一眼，说不够。你又掏了一次，这次掏的是压箱底的。","f":"进门容易，按月交难。","cost":"你把留着冲关的那味药也折了进去。","ef":{"contrib":35,"ss":-60,"herb":-1,"lifespan":-1},"min":9,"max":12,"sect":"xs"},
{"c":"宗门","tier":"玄缘","t":"空出来的那个位子","d":"上一个堂主没了。位子空着，谁也不坐——坐上去的人，得先去办一桩事。你报了名。","f":"坐上去的人，先被派去死。","cost":"你把退路自己断了。","ef":{"contrib":70,"ss":150,"atk":6,"lifespan":-4,"enemy":1},"min":11,"max":12,"sect":"xs"},
{"c":"宗门","tier":"灵缘","t":"找保人","d":"商盟要一个保人。你沿街问了一整条，最后在一家棺材铺签的字。那掌柜说，他保过的人，多半用不上棺材。","f":"肯保你的，都先算过你会不会跑。","cost":"你欠了棺材铺一份人情。","ef":{"sect":true,"sectJoin":"黑石商盟","ss":-25,"debts":1},"min":3,"max":9,"sect":"join","loc":["市"],"entry":1},
{"c":"宗门","tier":"灵缘","t":"路上折了价","d":"车在半道翻了，货撒了一地。你捡回来一半，另一半记在你头上。柜上没骂你，只是拿笔在账上添了一行。","f":"亏了的货，账上找得回来。","cost":"这一趟白跑，还倒贴。","ef":{"contrib":20,"ss":-35,"debts":1,"material":1},"min":3,"max":7,"sect":"hs"},
{"c":"宗门","tier":"灵缘","t":"去收一笔旧账","d":"柜上让你去收一笔拖了很久的账。欠钱的是个熟脸，说再宽半月。你说不行。说的时候，你自己也不太信自己。","f":"催债的人，最先学会看脸色。","cost":"从此街上有人绕着你走。","ef":{"contrib":28,"ss":70,"enemy":1},"min":4,"max":9,"sect":"hs"},
{"c":"宗门","tier":"灵缘","t":"给岭上送的那批货","d":"这批货是往血煞岭去的。押运的人问你做不做。你说岭上杀人不眨眼。他说那是岭上的事，货是我们的事。","f":"生意归生意。","cost":"回来之后，你身上有股洗不掉的味道。","ef":{"contrib":32,"ss":85,"rep":{"id":"xs","v":8},"dao":-1},"min":5,"max":9,"sect":"hs"},
{"c":"宗门","tier":"宝缘","t":"人情折成账","d":"你欠甲一个人情，甲欠乙一笔钱。柜上教你把这三笔并成一笔。并完之后，你不欠甲了——你欠柜上。","f":"账算清了，人就没那么亲了。","cost":"从此甲见你，先低头。","ef":{"debts":-1,"contrib":30,"ss":55,"dao":-1},"min":6,"max":9,"sect":"hs"},
{"c":"宗门","tier":"宝缘","t":"后半夜的市","d":"后半夜才开的市，货都盖着布。你看中一件，问来路。卖的人说不问。你买了，回去掀开，是件好东西。","f":"不问来路的东西，便宜得有道理。","cost":"你把账上能动的都动了。","ef":{"material":3,"contrib":45,"ss":-130,"dao":-1},"min":7,"max":9,"sect":"hs"},
{"c":"宗门","tier":"灵缘","t":"棚子底下的空位","d":"无定墟的棚子是自己长出来的。有人挪了挪，给你腾出一块干地方，说坐吧。没人问你是谁，也没人问你会什么。","f":"这里不问来历，只问你肯不肯搭手。","cost":"从今夜起，别人的事也是你的事。","ef":{"sect":true,"sectJoin":"无定散修盟","debts":1,"fame":1},"min":4,"max":10,"sect":"join","loc":["墟"],"entry":1},
{"c":"宗门","tier":"灵缘","t":"搭伙进山","d":"三四个人凑一趟南荒，说好见者有份。进去了才发现，各人心里那本账不一样。回来的路上，谁也没提分多少。","f":"搭伙容易，算账难。","cost":"这一趟，你什么也没落下。","ef":{"cultivate":35,"ss":40,"material":1,"debts":1},"min":4,"max":8,"sect":"wd"},
{"c":"宗门","tier":"灵缘","t":"分赃那一夜","d":"一趟秘境下来，东西摊在地上，谁拿哪一件，谁都觉得吃亏。吵到天亮，最后是抽的签。抽完没人说话，各自走了。","f":"穷人的公道，是抽签抽出来的。","cost":"你分到的那一件，不是你想要的。","ef":{"contrib":20,"material":2,"ss":30,"debts":1},"min":5,"max":10,"sect":"wd"},
{"c":"宗门","tier":"宝缘","t":"托给你的那个孩子","d":"一个熟脸要出去一趟，说回不来就把小子托给你。他没说去哪。他走了，孩子留下了，坐在门槛上等你安排。","f":"托孤的人，多半知道自己回不来。","cost":"你多了张嘴，也多了份牵挂。","ef":{"contrib":25,"ss":-30,"rel":{"n":"托孤的孩子","v":2},"debts":1},"min":6,"max":10,"sect":"wd"},
{"c":"宗门","tier":"宝缘","t":"凑份子","d":"你要冲这一关，差一味药。盟里的人一家凑一点，凑到半夜，凑出来了。钱不多，可你数的时候手是抖的。","f":"一个人的难处，一群人摊就没那么难。","cost":"这份子，你得记一辈子。","ef":{"herb":2,"ss":40,"contrib":18,"debts":2},"min":7,"max":10,"sect":"wd"},
{"c":"宗门","tier":"宝缘","t":"大家凑钱埋的那个人","d":"他死在野地里，是盟里的人抬回来的。没人知道他全名，只知道他姓什么。你把钱掏了，别人也掏了，凑够了棺材钱。","f":"散修没有宗门，死了总得有人埋。","cost":"你掏的是自己下个月的钱。","ef":{"contrib":20,"ss":-25,"fame":1,"dao":1},"min":8,"max":10,"sect":"wd"},
{"c":"宗门","tier":"宝缘","t":"祠堂前的那道题","d":"祠堂前没有人，只有一块石。石上刻着一句话，是妖文，你认得一半。守祠的让你把另一半补上。你补了，它看了很久。","f":"妖不看你会不会，看你答得对不对。","cost":"你答完了，就不再只是人了。","ef":{"sect":true,"sectJoin":"青丘妖族","dao":-1,"lifespan":5},"min":9,"max":15,"sect":"join","loc":["丘"],"entry":1},
{"c":"宗门","tier":"灵缘","t":"回礼回错了","d":"它送你一捧还带着毛的骨头。你按人的规矩道了谢，周围忽然静下来。后来有人告诉你，那东西不该谢，收下就走。","f":"它们的礼数，和人反着来。","cost":"你犯了忌，没人肯说是哪一条。","ef":{"contrib":12,"dao":-1,"cultivate":40},"min":9,"max":13,"sect":"qq"},
{"c":"宗门","tier":"灵缘","t":"递过来的那一块","d":"火边递来一块，还热着。你闻出那是什么，也知道不吃就坐不到天亮。你吃了。吃完没人看你——这比看你更难受。","f":"它们不看你的脸，是给你留最后的体面。","cost":"你没吐，也忘不掉那个味道。","ef":{"contrib":20,"lifespan":3,"dao":-1,"cultivate":45},"min":10,"max":14,"sect":"qq"},
{"c":"宗门","tier":"宝缘","t":"化形的那一夜","d":"按篇上的法子，你熬到后半夜。骨头在里头挪了位置，疼得说不出话。天亮时你站起来了，影子还是你的，轮廓不是了。","f":"人形是借来的，借久了，就忘了还。","cost":"你照水看了一眼，没敢看第二眼。","ef":{"cultivate":80,"dao":-1,"lifespan":-3,"def":8,"contrib":15},"min":11,"max":15,"sect":"qq"},
{"c":"宗门","tier":"宝缘","t":"被它们看过一遍","d":"月巡的一圈人停在林子里，其中一个走过来，围着你看了三圈。它没说话，走回去也不知道说了什么。你从头到尾站着没动。","f":"它们不审你，它们只是看。","cost":"那一夜你没敢睡实。","ef":{"contrib":30,"fame":-1,"dao":-1,"rep":{"id":"qq","v":10}},"min":12,"max":15,"sect":"qq"},
{"c":"宗门","tier":"玄缘","t":"祠堂前的誓","d":"守祠的让你跪下，说一遍就行。你跪了。说完之后，它把你扶起来，说从今天起，你死了要送回来。","f":"契不是签的，是说的。","cost":"你死后得回来，它们要收。","ef":{"contrib":55,"lifespan":8,"dao":-1,"cultivate":90},"min":13,"max":15,"sect":"qq"},

/* ===== 卡池 D · FDR-007 工程侧补遗（四家通用事务，各 3 张） ===== */
{"c":"宗门","tier":"灵缘","t":"替堂里守那夜的火","d":"火不能灭，你守了整整一夜。添柴的时候你看见堂里那口井，井沿上缺了一块，缺口是旧的。","f":"守着火的人，最先知道什么叫熬。","cost":"你一夜没合眼。","ef":{"contrib":14,"cultivate":40,"lifespan":-1},"min":6,"max":12,"sect":"xs"},
{"c":"宗门","tier":"宝缘","t":"岭口收上来的供奉","d":"岭下几个村子按月送来东西。你收一处，记一笔。最后那一处的人跪着不肯起来，你也没扶。","f":"收别人的时候，手不能软。","cost":"你记住了那张脸。","ef":{"contrib":30,"ss":90,"dao":-1},"min":7,"max":12,"sect":"xs"},
{"c":"宗门","tier":"宝缘","t":"血使的黑牌子","d":"牌子是冷的，上面没刻名字，只有一道槽。管事的说，认牌子不认人。你接过来掂了掂，比想的沉。","f":"能让人认的东西，都不轻。","cost":"从此他们只认这块牌子。","ef":{"contrib":50,"atk":5,"lifespan":-3,"enemy":1},"min":10,"max":12,"sect":"xs"},
{"c":"宗门","tier":"灵缘","t":"柜上教你认秤","d":"账房的人把秤推给你，说先学认星。你认了一下午，往后称什么都忍不住多看两眼。","f":"心里那杆秤准了，手上这杆才有用。","cost":"你欠了账房一份指点。","ef":{"contrib":16,"ss":40,"debts":1},"min":3,"max":9,"sect":"hs"},
{"c":"宗门","tier":"灵缘","t":"替柜上盘那一夜的账","d":"一整年的账堆在案上，你盘到后半夜。盘到快完的时候才发现，少的那一笔在最前头。","f":"账错了不会自己喊，得有人看到最后。","cost":"你知道了一件不该知道的事。","ef":{"contrib":24,"ss":35,"dao":-1},"min":5,"max":9,"sect":"hs"},
{"c":"宗门","tier":"宝缘","t":"商路上的旧交情","d":"押货的队伍里有个旧相识。最难走的那段他替你顶了，说算还上次的。你没想起来上次是哪一次。","f":"路上的交情，还的时候才知道有多少。","cost":"这份人情，你还没还。","ef":{"contrib":40,"ss":60,"rel":{"n":"商路上的旧相识","v":1},"debts":1},"min":8,"max":9,"sect":"hs"},
{"c":"宗门","tier":"灵缘","t":"替人垫的那笔药钱","d":"盟里有人断了药，你替他垫上。他说下个月还。下个月他人没来，药倒是抓回来了。","f":"散修之间的账，记的不是钱。","cost":"你自己那味药，拖了半年才配上。","ef":{"contrib":15,"ss":-20,"herb":1,"debts":1},"min":4,"max":10,"sect":"wd"},
{"c":"宗门","tier":"灵缘","t":"棚子底下分的一碗汤","d":"有人熬了一锅汤，谁路过谁喝一口。你端着碗蹲在棚子底下听他们说话，热气糊了一脸。","f":"穷人的好处，是一碗汤能分很多人。","cost":"你那一碗是最后剩的。","ef":{"contrib":18,"heal":{"pct":0.3},"debts":1},"min":5,"max":10,"sect":"wd"},
{"c":"宗门","tier":"宝缘","t":"盟里说出来的一句话","d":"你和另一伙人吵起来，吵到要动手。盟里最老的那个只说了一句话，两边都不吭声了。","f":"没规矩的地方，话的分量全在人身上。","cost":"从此你也得说这样的话。","ef":{"contrib":35,"fame":3,"dao":1},"min":7,"max":10,"sect":"wd"},
{"c":"宗门","tier":"灵缘","t":"学着它们的样子坐","d":"它们坐着的时候不动，也不闭眼。你学着坐了半夜，起来时腿麻得像不是自己的。","f":"学别的东西容易，学它怎么待着难。","cost":"你站起来的时候摔了一跤。","ef":{"contrib":15,"cultivate":50,"dao":-1},"min":9,"max":14,"sect":"qq"},
{"c":"宗门","tier":"宝缘","t":"林子深处的一夜","d":"它们带你往林子深处走了一夜。天亮的时候你回头看，来路看不见了。它们说，本来就没有。","f":"它们的路，走出一次就没有第二次。","cost":"你想不起自己是怎么进去的。","ef":{"contrib":28,"material":2,"lifespan":2,"dao":-1},"min":10,"max":15,"sect":"qq"},
{"c":"宗门","tier":"宝缘","t":"月巡回来的那条路","d":"你跟着月巡走了一圈，回来时只剩自己。路过人族的村子，你站在村口没敢进去。","f":"走过那一圈之后，你自己闻着也不太像人了。","cost":"村里的孩子看见你就躲。","ef":{"contrib":38,"def":4,"fame":-1,"dao":-1},"min":11,"max":15,"sect":"qq"}

];

const rnd  = (a,b)=>a+Math.random()*(b-a);
const ri   = (a,b)=>Math.floor(rnd(a,b+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp= (v,a,b)=>v<a?a:(v>b?b:v);
function wpick(w){                                   // 按权重取索引
  let t=0; for(let i=0;i<w.length;i++) t+=w[i];
  if(t<=0) return 0;
  let r=Math.random()*t;
  for(let i=0;i<w.length;i++){ r-=w[i]; if(r<=0) return i; }
  return w.length-1;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* FDR-010 批1 · 数值分档显示（v4 §4.2/§7.6）：只作用于数值层，卡面仍零数字。
   目的：35 档后 STEP/气血/战力可达 6 位，HUD 面板需压缩宽度以守 390×844 · HUD ≤110px */
function fmtNum(v){
  v = Math.round(v);
  const a = Math.abs(v);
  if(a >= 1e8) return (v/1e8).toFixed(1)+'亿';
  if(a >= 1e4) return (v/1e4).toFixed(1)+'万';
  return String(v);
}
/* FDR-012 批3 · R3 §3.2 装备境界缩放：clamp( HP_BASE[stage] / HP_BASE[GRADE_MIN[g]], 1, GEAR_CAP[g] )
   低品阶装备在高境界自动贬值（凡铁在渡劫≈无效）；同一件随主人境界增强（法器认主），避免越级装备 */
function gearScale(g){
  const sb  = clamp(S.stage, 0, HP_BASE.length-1);
  const idx = clamp(GRADE_MIN[clamp(g,0,5)], 0, HP_BASE.length-1);
  return clamp(HP_BASE[sb] / HP_BASE[idx], 1, GEAR_CAP[clamp(g,0,5)]);
}

const CN_D = ['零','一','二','三','四','五','六','七','八','九'];
function cnNum(n){
  n = Math.round(n);
  if(!isFinite(n) || n<=0) return '零';
  if(n<10) return CN_D[n];
  if(n===10) return '十';
  if(n<20) return '十'+CN_D[n%10];
  if(n<100){ const t=Math.floor(n/10), o=n%10; return CN_D[t]+'十'+(o?CN_D[o]:''); }
  if(n<1000){ const h=Math.floor(n/100), r=n%100; return CN_D[h]+'百'+(r?cnNum(r):''); }
  return String(n);
}
function specInfo(it){ if(!it||!it.spec||!SPEC_TBL[it.spec]) return null; return Object.assign({id:it.spec}, SPEC_TBL[it.spec]); }

function artMulOf(a){

function mainArt(){ for(let i=0;i<S.arts.length;i++) if(S.arts[i].main) return S.arts[i]; return null; }
function secArts(){ return S.arts.filter(a=>!a.main); }

function artBonus(detail){
  let atk=0, def=0, hp=0;
  const m0 = mainArt(), secs = secArts();
  let mainAdj = 1;
  if(m0 && secs.some(s=>wxRel(m0.el,s.el)==='ke')) mainAdj = 0.80;      // 气息相冲
  /* 兼修互克（FDR-014）：不限量后兼修可多门 —— 凡与任一同门兼修相克者 ×0.85（成对判定，不叠乘） */
  let secAdj = {};
  for(let i=0;i<secs.length;i++){
    for(let j=i+1;j<secs.length;j++){
      if(wxRel(secs[i].el,secs[j].el)==='ke'){ secAdj[secs[i].n]=0.85; secAdj[secs[j].n]=0.85; }
    }
  }
  const cf = persistSum();                               // FDR-013 批4 · R6 组合持久加成
  S.arts.forEach(a=>{
    const tbl = ART_TBL[a.type] || ART_TBL['养元'];
    const row = tbl[clamp(a.lv,0,4)];
    const cap = Math.min(1 + CP_STEP*((a.cp)||0), 1.20);   // FDR-011 批2 · 参悟加成（v4 §2.2 规则3，封顶 ×1.20）
    let m;
    if(a.main) m = WX_ATTR[wxRel(S.rootEl,a.el)] * mainAdj;
    else       m = (1 + (WX_ATTR[wxRel(S.rootEl,a.el)]-1)*0.5) * 0.60 * (secAdj[a.n]||1);
    let cmul = cf.artMul * (a.type==='炼体' ? cf.bodyArtMul : 1) * (a.main ? cf.mainMul : 1);
    const cpB = a.main ? (cf.mainAtkBonusPerCp * (a.cp||0)) : 0;
    const A = row[0]*m*cap*cmul*(1+cpB), D = row[1]*m*cap*cmul, H = row[2]*m*cap*cmul;
    atk+=A; def+=D; hp+=H;
    if(detail) detail.push({n:a.n, lv:a.lv, type:a.type, el:a.el, mul:m*cap*cmul, cp:(a.cp||0), atk:A, def:D, hp:H});
  });
  return {atk:atk, def:def, hp:hp};
}
function rootBonus(){
  const el = S.rootEl; let A=0,D=0,H=0;
  if(el==='金'){A=0.10;}
  else if(el==='木'){D=0.02;H=0.06;}
  else if(el==='水'){D=0.06;H=0.04;}
  else if(el==='火'){A=0.06;}
  else if(el==='土'){D=0.10;H=0.08;}
  if(S.rootGrade==='天灵根'){A+=0.08;D+=0.08;H+=0.08;}
  return {A:A,D:D,H:H};
}
/* FDR-012 批3 · R3 §3.5 套装统计：同一套同时装备的件数 → p2/p3 效果（含行囊不计） */
function setSum(){
  const equipped = SLOTS.map(s=>S.equip[s[0]]).filter(Boolean).map(it=>it.n);
  const r = {atk:0,def:0,esc:0,life:0,bag:0,ssGain:0,contribGain:0,artGain:0,
             fleeP:0,breakP:0,fateShift:0,sell:0,pay:0,xuanDrop:0,xuanWeight:1,sets:[]};
  Object.keys(SET_TBL).forEach(id=>{
    const S0 = SET_TBL[id];
    let cnt = 0;
    S0.parts.forEach(p=>{ if(equipped.indexOf(p)>=0) cnt++; });
    if(cnt<=0) return;
    const fx2 = cnt>=2 ? S0.p2 : null, fx3 = cnt>=3 ? S0.p3 : null;
    [fx2,fx3].forEach(fx=>{ if(!fx) return;
      Object.keys(fx).forEach(k=>{ if(k==='xuanWeight') r.xuanWeight *= fx[k]; else r[k] = (r[k]||0) + fx[k]; });
    });
    r.sets.push({id:id, n:S0.n, cnt:cnt, max:S0.parts.length, on2:!!fx2, on3:!!fx3});
  });
  return r;
}

function equipSum(){
  let atk=0,def=0,hp=0,esc=0;
  SLOTS.forEach(s=>{
    const it = S.equip[s[0]]; if(!it) return;
    const m = durMul(it);
    atk += (it.atk||0)*m; def += (it.def||0)*m; hp += (it.hp||0)*m; esc += (it.esc||0)*m;
  });
  /* FDR-011 批2 · spec 生效来源：佩饰(主) + 法器(副)（v4 §3.3）。非叠取最高、可叠累加 */
  const srcs = [S.equip.ornament, S.equip.treasure].filter(it=>it && it.spec && SPEC_TBL[it.spec]);
  const best = {}, acc = {};
  srcs.forEach(it=>{
    const id = it.spec, g = clamp(it.g||0,0,5);
    const val = SPEC_VAL[id] ? SPEC_VAL[id](g) : 0;
    if(SPEC_TBL[id].stack) acc[id] = (acc[id]||0) + val;
    else                   best[id] = Math.max(best[id]||0, val);
  });
  const life       = best.lifespan || 0;
  const cult       = 1 + (best.cult || 0);
  const healB      = best.heal || 0;
  const fameMul    = (best.fame||0) > 0 ? best.fame : 1;
  const ward       = best.ward || 0;
  const fortune    = best.fortune || 0;
  const vigor      = best.vigor || 0;
  const purity     = (best.purity||0) > 0 ? best.purity : 1;
  const escapeSpec = acc.escape || 0;
  const thorns     = acc.thorns || 0;
  const karmaShift = Math.min(acc.karma || 0, 0.35);     // 因果可叠，上限 +0.35（v4 §3.3）
  /* FDR-012 批3 · R3 §3.5 套装并入：直接加成并入 atk/def/esc/寿元；其余派生经 setFx 透出 */
  const st = setSum();
  atk += st.atk; def += st.def; esc += st.esc;
  const insightMul = ((best.insight||0)>0 ? best.insight : 1) * (1 + st.artGain);
  const fateShift  = karmaShift + st.fateShift;   // 因果 spec + 归墟套装（上限在 fateTier 内统一施加）
  return {atk:atk, def:def, hp:hp, esc:esc + escapeSpec, life:life + st.life, cult:cult, healB:healB,
          fameMul:fameMul, ward:ward, fortune:fortune, vigor:vigor, insightMul:insightMul,
          purity:purity, thorns:thorns, karmaShift:karmaShift, specs:srcs.map(specInfo),
          setFx:{bag:st.bag, ssGain:st.ssGain, contribGain:st.contribGain, artGain:st.artGain,
                 fleeP:st.fleeP, breakP:st.breakP, fateShift:st.fateShift, sell:st.sell, pay:st.pay,
                 xuanDrop:st.xuanDrop, xuanWeight:st.xuanWeight},
          sets:st.sets, fateShift:fateShift};
}
function stats(detail){
  const sb = clamp(S.stage,0,STAGES.length-1);
  const eq = equipSum();
  const artDetail = [];
  const ab = artBonus(detail?artDetail:null);
  const rb = rootBonus();
  const boneHp  = (S.bone-50)/100*0.30 + 1;
  const boneAtk = (S.bone-50)/100*6;
  const boneDef = (S.bone-50)/100*4;

  let hpMax = (HP_BASE[sb] + eq.hp + ab.hp + HP_BASE[sb]*rb.H + HP_BASE[sb]*eq.vigor) * boneHp * (1 - clamp(S.wound,0,0.50)) * (1 + persistSum().hpMaxPct);
  hpMax = Math.max(Math.round(HP_BASE[sb]*0.15), Math.round(hpMax));
  const atk = Math.round(ATK_BASE[sb] + eq.atk + ab.atk + ATK_BASE[sb]*rb.A + boneAtk + S.atkBonus);
  const def = Math.round(DEF_BASE[sb] + eq.def + ab.def + DEF_BASE[sb]*rb.D + boneDef + S.defBonus);
  const maxLife = Math.max(LIFE_CAP[sb], Math.max(S.lifespan,0) + eq.life);
  const power = Math.round(atk + def*0.5 + hpMax*0.1);
  const o = {
    hpMax:hpMax, atk:atk, def:def, power:power, esc:Math.round(eq.esc + (S.escBonus||0)),
    maxLife:maxLife, cult:eq.cult, healB:eq.healB,
    fameMul:eq.fameMul, ward:eq.ward, fortune:eq.fortune, thorns:eq.thorns,
    insightMul:eq.insightMul, purity:eq.purity, vigor:eq.vigor, karmaShift:eq.karmaShift,
    specs:eq.specs, setFx:eq.setFx, sets:eq.sets, fateShift:eq.fateShift,
    baseA:ATK_BASE[sb], baseD:DEF_BASE[sb], baseH:HP_BASE[sb],
    eqA:eq.atk, eqD:eq.def, eqH:eq.hp,
    abA:ab.atk, abD:ab.def, abH:ab.hp,
    rbA:ATK_BASE[sb]*rb.A, rbD:DEF_BASE[sb]*rb.D, rbH:HP_BASE[sb]*rb.H,
    boneAtk:boneAtk, boneDef:boneDef, boneHp:boneHp, wound:clamp(S.wound,0,0.50),
    arts:detail?artDetail:null
  };
  return o;
}
function recomputeBound(){                     // 属性变化后收口
  const st = stats();
  if(S.hp > st.hpMax) S.hp = st.hpMax;
  if(S.hp < 1) S.hp = 1;
  return st;
}

function rankName(){
  if(!S.sect) return '无门无派';
  const F = FACTIONS[S.sect.id];
  return F.n+' · '+F.ranks[clamp(S.sect.rank,0,F.ranks.length-1)];
}
function rankNext(){
  if(!S.sect) return '';
  const F = FACTIONS[S.sect.id];
  if(S.sect.rank >= F.ranks.length-1) return '已至顶' ;
  return '再 '+Math.max(0, F.need[S.sect.rank+1]-S.contrib);
}

    : '<div class="prow"><span>尚无往来之人</span><span></span></div>';

    + (S.debts?P('未了的人情', S.debts):'')

  /* FDR-013 批4 · R1 §1.4 开关 + R6 §6.3 见闻录入口（塞进抽屉，不撑高 HUD） */
  const combosGot = Object.keys(S.codex||{}).length;

  Object.keys(S.codex||{}).forEach(id=>{ const cm=COMBO_BY_ID[id]; if(cm) cmHtml += '<i class="combo-chip">'+esc(cm.n)+'</i> '; });
  rows.push('<div class="sec"><div class="sec-h">声 色 · 见 闻</div>'
    + '<div class="setrow">'
    + '<button class="hbtn '+(MUTE?'':'on')+'" id="btn-sound">声 · '+(MUTE?'静':'开')+'</button>'

function summaryText(){
  const L = S.chg.slice().sort((a,b)=>a.pri-b.pri);

function sealTurn(){
  if(!turnBox) return;
  const sm = turnBox.querySelector('summary');
  if(!sm) return;
  const head = turnBox._head || '';
  sm.innerHTML = '<span class="ty">'+esc(head)+'</span>'
    + (turnBox._card ? '<span class="tc">《'+esc(turnBox._card)+'》</span>' : '')
    + '<span class="ts">'+summaryText()+'</span>';
}
function openTurn(label, sub, cardTitle){
  const prev = document.querySelectorAll('.turn');
  Array.prototype.forEach.call(prev, d=>{ d.open = false; });
  if(turnBox) sealTurn();
  const d = document.createElement('details');
  d.className='turn'; d.open=true;
  d._head = label+' · '+sub; d._card = cardTitle || '';
  d.innerHTML = '<summary><span class="ty">'+esc(d._head)+'</span>'+(d._card?'<span class="tc">《'+esc(d._card)+'》</span>':'')+'</summary><div class="tbody"></div>';
  logEl.appendChild(d);
  turnBox = d;
  S.chg = [];
  logEl.scrollTop = logEl.scrollHeight;
  return d.querySelector('.tbody');
}
function entry(cls, who, prose, engine){
  if(!turnBox) return null;
  const host = turnBox.querySelector('.tbody') || logEl;
  const el = document.createElement('div');
  el.className = 'entry' + (cls?' '+cls:'');
  el.innerHTML = (who ? '<div class="who">'+who+'</div>' : '')
               + (prose ? '<div class="prose serif">'+prose+'</div>' : '')
               + (engine ? '<div class="engine">'+engine+'</div>' : '');
  host.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
  return el;
}

function askChoice(title, desc, engHtml, opts, onPick){

/* ---------- 14. 门控与抽卡 ---------- */
function secName(){ return S.sect ? FACTIONS[S.sect.id].n : null; }
function hasFac(id){ return (S.sect && S.sect.id===id) || S.trade===id; }

/* 派系名 ⇄ id —— 两分支并存：既有卡写全名，FDR-007 新增卡写 id（P0-4） */
function facIdOf(s){ return FID_BY_NAME[s] || (FACTIONS[s] ? s : null); }
/* 入伙 / 改投卡的目标派系（由 ef.sectJoin 反查） */
function joinTarget(c){
  const e = (c && c.ef) || {};
  if(e.sectJoin && typeof e.sectJoin==='string') return facIdOf(e.sectJoin);
  if(e.sect===true) return 'qy';
  return null;
}
/* 是否需要「改投确认」：返回被抛下的旧派系 id，无需确认则返回 null */
function switchFrom(c){
  const id = joinTarget(c);
  if(!id || !S.sect) return null;      // 无门庭 → 正常入伙
  if(S.sect.id===id)  return null;     // 已在此派
  if(id==='hs')       return null;     // 商盟是生意不是门庭，可并存（D6）
  return S.sect.id;
}

function eligible(c){
  if(S.stage < (c.min||0)) return false;
  if(c.max!=null && S.stage > c.max) return false;
  if(c.loc && c.loc.indexOf(LOCS[S.loc].id) < 0) return false;
  const s = c.sect;
  if(s){
    if(s==='in'){ if(!S.sect) return false; }
    else if(s==='out'){ if(S.sect) return false; }
    else if(s==='join'){                              // 入伙 / 改投：无门庭可入伙；已有别家门庭则走 askChoice 确认
      const id = joinTarget(c);
      if(!id || !FACTIONS[id]) return false;
      if(S.sect && S.sect.id===id) return false;      // 已在此派，不再发入门卡
      if(!S.sect && S.trade===id)  return false;      // 商盟已兼且尚未入门庭
    }
    else if(s.charAt(0)==='!'){ const id = facIdOf(s.slice(1)); if(id && hasFac(id)) return false; }
    else { const id = facIdOf(s); if(!id || !hasFac(id)) return false; }
  }
  if(c.entry){
    if(S.declined) return false;
    if(S.noJoin && S.noJoin[c.t]) return false;       // 这张入门卡已被当面回绝过，不再反复劝
  }
  /* FDR-010 批1 · years 卡治理（增补 §B.4 G5/G6）：冷却未过或预算用尽 → 门控屏蔽 */
  if(c.ef && c.ef.years && ((S.yearsCd||0)>0 || (S.yearsTotal||0) >= YEAR_BUDGET)) return false;
  /* FDR-011 批2 · R9 对阵类战争卡关系门控（增补 §C.1.2）。复用现成 factionRel()/REL_TBL，零新表。
     🔴 商盟(hs) 在 REL_TBL 无敌对行 ⇒ 商盟玩家天然遇不到对阵类 —— 刻意，不要"修"。
     🔴 o.war={} 缺省 relMax=-41(WAR_REL_GATE)；给出 vs 则只看该派，否则看整行最差。 */
  if(c.war){
    if(!S.sect) return false;                                  // 无门无派不主动参战（散修卷入卡不挂 war）
    const thr = (c.war.relMax != null) ? c.war.relMax : WAR_REL_GATE;
    let hostile = false;
    if(c.war.vs){ hostile = factionRel(c.war.vs) <= thr; }
    else {
      const row = REL_TBL[S.sect.id] || {};
      for(const k in row){ if(factionRel(k) <= thr){ hostile = true; break; } }
    }
    if(!hostile) return false;
  }
  /* FDR-012 批3 · R5 §5.5 天命卡频率门控：走正常类目通道（天然满足"三卡类目互异"），
     另加冷却 + 解锁门槛：stage ≥ 1 才见；结算后 fateCd=4（最多每 5 回合一次）；开局前 6 回合不出 */
  if(c.c==='天命' && (S.stage < 1 || (S.fateCd||0) > 0)) return false;
  /* FDR-013 批4 · R6 组合专属卡：未解锁不入池（默认隐藏，命中组合后放行） */
  if(c.unlock && !(S.unlocked && S.unlocked[c.unlock])) return false;
  if(S.woundTurns>0 && (c.c==='战斗' || c.c==='危险')) return false;
  return true;
}

function travelCard(i){
  const L = LOCS[i];
  return {id:-1, c:'地方', tier:'灵缘', t:'前往'+L.name, d:L.enter+'路不好走，你走了很久。',
          f:'路是自己走出来的。', cost:'这一去，就是好几个月。', ef:{locate:L.id}, min:0, _travel:true};
}
function hostAmbushCard(){
  const pool = CARDS.map((c,i)=>Object.assign({id:i},c))
                    .filter(c=>c.c==='战斗' && eligible(c) && c.ef && c.ef.battle && c.ef.battle.ambush);
  return pool.length ? pick(pool) : null;
}

function genCards(){
  const recent = new Set();
  S.memory.forEach(m=>m.ids.forEach(id=>recent.add(id)));
  const all   = CARDS.map((c,i)=>Object.assign({id:i}, c)).filter(eligible);
  const fresh = all.filter(c=>!recent.has(c.id));
  const out=[], usedId=new Set(), usedCat=new Set();

  if(S.nudge>0 && S.nextLoc!=null){
    out.push(travelCard(S.nextLoc));
    usedId.add(-1); usedCat.add('地方');
    S.nudge--;
  }

  // 敌对地区的遭遇权重提升
  const L = LOCS[S.loc];
  let hostile = false;
  if(L.own){ const v = factionRel(L.own); hostile = v <= -21; }
  const drawFrom = pool=>{
    const own0 = LOCS[S.loc].own;              // FDR-007：站在别家地盘上，这家人更愿意来搭话
    const ownCount = S.sect ? LOCS.filter(X=>X.own===S.sect.id).length : 0;
    const relRow = S.sect ? (REL_TBL[S.sect.id] || {}) : {};
    let worst = 0; for(const k in relRow){ if(relRow[k] < worst) worst = relRow[k]; }
    const warMul = 1 + Math.max(0, -worst - 41) / 20;   // FDR-011 批2 · R9：最差关系 −41→×1.0，−81→×3.0
    const w = pool.map(c=>{
      let v = TIER_W[c.tier] || 1;
      if(hostile && c.c==='战斗') v *= (factionRel(L.own) <= -41 ? 3.0 : 1.8);
      if(own0 && joinTarget(c)===own0) v *= 6; // 地盘所属派系的入门卡曝光提升
      if(c.war && S.sect) v *= warMul;         // R9 关系加权：与敌派越差，战争卡越密
      // R9 · W-2 卡池效应：战败失地后（我方地盘 ≤1）本门 sect 门控卡出现率减半
      if(c.sect && S.sect && c.sect===S.sect.id && ownCount<=1) v *= 0.5;
      return v;
    });
    return pool[wpick(w)];
  };

  /* FDR-007：站在别家地盘上，这家人会主动来搭话 —— 与 travel 助推同构，冷却 HAIL_CD 回合 */
  if(S.hailCd>0) S.hailCd--;
  if(S.hailCd<=0 && L.own && out.length<3 && !usedCat.has('宗门')){
    const hails = all.filter(c=>c.c==='宗门' && joinTarget(c)===L.own && !usedId.has(c.id));
    if(hails.length){
      const hit = drawFrom(hails);
      usedId.add(hit.id); usedCat.add('宗门'); out.push(hit);
      S.hailCd = HAIL_CD;
    }
  }

  if(hostile){
    const amb = hostAmbushCard();
    if(amb && Math.random()<0.18){ usedId.add(amb.id); usedCat.add(amb.c); out.push(amb); }
  }

  const fill = src=>{
    shuffle(CATS.slice()).forEach(cat=>{
      if(out.length>=3 || usedCat.has(cat)) return;
      const pool = src.filter(c=>c.c===cat && !usedId.has(c.id));
      if(!pool.length) return;
      const hit = drawFrom(pool);
      usedId.add(hit.id); usedCat.add(cat); out.push(hit);
    });
  };
  fill(fresh);
  fill(all);
  if(out.length<3){
    const rest = fresh.concat(all);
    rest.forEach(c=>{ if(out.length<3 && !usedId.has(c.id) && !usedCat.has(c.c)){ usedId.add(c.id); usedCat.add(c.c); out.push(c); } });
    rest.forEach(c=>{ if(out.length<3 && !usedId.has(c.id)){ usedId.add(c.id); out.push(c); } });
  }
  /* FDR-011 批2 · R9 ③ 关口强制注入：BIG 关口前一回合，若本局尚未出过战事卡，
     强制把一张 min≤stage 的战事卡塞进三选一（"战火延烧"），保证关键节点必遇战争。 */
  const nearGate = BIG[S.stage] && isFinite(curStep()) && S.progress >= curStep()*0.85;
  if(!(S.flags && S.flags.warSeen) && nearGate && out.length>=3 && !out.some(c=>c.c==='战事')){
    const wp = all.filter(c=>c.c==='战事' && !usedId.has(c.id));
    if(wp.length){
      const hit = wp[Math.floor(Math.random()*wp.length)];
      out[2] = hit; usedId.add(hit.id);      // 替换最后一格：out[0]/out[1] 必非战事，三卡类目仍互异
    }
  }
  if(S.flags && out.some(c=>c.c==='战事')) S.flags.warSeen = true;
  return out.slice(0,3);
}

function engval(v){
  if(v===true) return '是';
  if(v===false) return '否';
  if(typeof v==='number') return String(v);
  if(typeof v==='string') return v;
  return JSON.stringify(v);
}
function cardEng(c){
  const e = c.ef||{};
  const p = ['causeTag='+c.c, 'tier='+c.tier, 'realmCoef='+coef(),
             'band='+(c.min||0)+'-'+(c.max==null?'∞':c.max),
             'loc='+(c.loc?c.loc.join('/'):'任'), 'sectGate='+(c.sect||'任')];
  if(e.cultivate) p.push('cultivateBase='+e.cultivate);
  Object.keys(e).forEach(k=>{
    if(k==='cultivate') return;
    const v = e[k];
    if(k==='equip' && v){
      p.push('equip='+v.n+'[slot='+v.slot+',g='+v.g+',grade='+GRADE_N[clamp(v.g||0,0,5)]
        +(v.atk!=null?',atk='+v.atk:'')+(v.def!=null?',def='+v.def:'')
        +(v.hp!=null?',hp='+v.hp:'')+(v.esc!=null?',esc='+v.esc:'')+(v.spec?',spec='+specEngTag(v.spec, v.g==null?0:v.g):'')+(v.set?',set='+v.set:'')+']');
      return;
    }
    /* FDR-012 批3 · R5 天命卡引擎行：fate=risk:std · tier 由 rollFate 摊出 */
    if(k==='fate' && v){ p.push('fate=risk:'+(v.risk||'std')); return; }
    if(k==='art' && v){ p.push('art='+v.n+'['+v.el+'/'+v.type+',lv='+(v.lv||0)+']'); return; }
    if(k==='battle' && v){
      p.push('battle='+v.foe+(v.pw?('[pw='+v.pw[0]+'–'+v.pw[1]+']'):('[scale=×'+v.scale+']'))
        +'[loot='+v.loot+',flee='+(v.canFlee?'Y':'N')+(v.ambush?',ambush':'')+']');
      return;
    }
    if(k==='heal' && v){ p.push('heal=+'+Math.round(v.pct*100)+'%hp'); return; }
    if(k==='hpMax' && v){ p.push('hpMax='+(v.pct>0?'+':'')+Math.round(v.pct*100)+'%'); return; }
    if(k==='hp' && v){ p.push('hp='+(v.pct>0?'+':'')+Math.round(v.pct*100)+'%'); return; }
    if(k==='rel' && v){ p.push('rel='+v.n+(v.v>0?'+':'')+v.v); return; }
    p.push(k+'='+engval(v));
  });
  return p.join(' · ');
}
